<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mark1z Design</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        /* ===== БАЗОВЫЕ СТИЛИ ===== */
        :root {
            --bg-start: #0a050d;
            --bg-mid: #100820;
            --bg-end: #0a0012;
            --primary: #7c3aed;
            --secondary: #be185d;
            --accent: #9d174d;
            --text: #f5f3ff;
            --text-muted: rgba(245, 243, 255, 0.5);
            --card-bg: rgba(18, 8, 30, 0.8);
            --card-border: rgba(124, 58, 237, 0.3);
            --shadow: 0 6px 20px rgba(0,0,0,0.5);
            --radius: 20px;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, var(--bg-start), var(--bg-mid), var(--bg-end));
            color: var(--text);
            min-height: 100vh;
            padding: 16px 16px 80px;
            overflow-x: hidden;
            letter-spacing: 0.02em;
            -webkit-user-select: none;
            user-select: none;
        }
        img {
            -webkit-touch-callout: none !important;
            -webkit-user-drag: none !important;
            user-drag: none !important;
            pointer-events: auto;
        }
        /* ===== ЗВЁЗДЫ ===== */
        .stars-container { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
        .star { position:absolute; background:rgba(255,255,255,0.7); border-radius:50%; opacity:0; animation: twinkle var(--duration) ease-in-out infinite; animation-delay: var(--delay); }
        @keyframes twinkle { 0%,100%{opacity:0; transform:scale(0.3)} 50%{opacity:0.3; transform:scale(1)} }
        .asteroid-container { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:hidden; }
        .asteroid { position:absolute; background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 70%); border-radius:50%; width:4px; height:4px; opacity:0; animation: flyAsteroid linear infinite; }
        @keyframes flyAsteroid { 0% { transform: translate(0,0) scale(0.5); opacity:0; } 10% { opacity:0.6; } 90% { opacity:0.6; } 100% { transform: translate(var(--tx), var(--ty)) scale(1.5); opacity:0; } }
        .app-container { position:relative; z-index:1; max-width:600px; margin:0 auto; }
        /* ===== HEADER ===== */
        .header { text-align:center; padding:30px 0 20px; position: relative; }
        .header .faq-button { position:absolute; top:20px; right:20px; background: rgba(124,58,237,0.3); border:1px solid var(--card-border); color:#fff; width:40px; height:40px; border-radius:50%; font-size:20px; cursor:pointer; transition:all 0.3s; }
        .header .faq-button:hover { background: rgba(124,58,237,0.6); }
        .header .wheel-button { position:absolute; top:20px; left:20px; background: rgba(124,58,237,0.3); border:1px solid var(--card-border); color:#fff; width:40px; height:40px; border-radius:50%; font-size:20px; cursor:pointer; transition:all 0.3s; }
        .header .wheel-button:hover { background: rgba(124,58,237,0.6); }
        .header .promo-button { position:absolute; top:70px; left:20px; background: rgba(124,58,237,0.3); border:1px solid var(--card-border); color:#fff; width:40px; height:40px; border-radius:50%; font-size:20px; cursor:pointer; transition:all 0.3s; }
        .header .promo-button:hover { background: rgba(124,58,237,0.6); }
        .logo { width:100px; height:100px; margin:0 auto 16px; border-radius:28px; overflow:hidden; box-shadow:0 4px 15px rgba(124,58,237,0.3); position:relative; }
        .logo img { width:100%; height:100%; object-fit:cover; }
        .brand-name { font-size:30px; font-weight:800; background:linear-gradient(to right, #a78bfa, #c084fc, #a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation: brandGlow 6s ease-in-out infinite; }
        @keyframes brandGlow { 0%,100%{filter:drop-shadow(0 0 4px rgba(124,58,237,0.3))} 50%{filter:drop-shadow(0 0 8px rgba(124,58,237,0.5))} }
        .tagline { color:var(--text-muted); font-size:13px; letter-spacing:2px; text-transform:uppercase; }
        /* ===== ВКЛАДКИ ===== */
        .tabs { display:flex; background:rgba(10,5,18,0.8); backdrop-filter:blur(20px); border:1px solid var(--card-border); border-radius:40px; padding:6px; margin:25px 0; }
        .tab-btn { flex:1; padding:12px 6px; background:transparent; border:none; color:var(--text-muted); font-weight:600; border-radius:32px; cursor:pointer; transition:all 0.3s; }
        .tab-btn.active { background:linear-gradient(135deg, rgba(124,58,237,0.7), rgba(190,24,93,0.7)); color:#fff; }
        .section { display:none; animation: fadeIn 0.4s; }
        .section.active { display:block; }
        @keyframes fadeIn { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none} }
        /* ===== КАРТОЧКИ ===== */
        .card { background:var(--card-bg); backdrop-filter:blur(10px); border:1px solid var(--card-border); border-radius:var(--radius); padding:24px; margin-bottom:16px; box-shadow:var(--shadow); }
        .card h3 { font-size:21px; font-weight:700; margin-bottom:12px; color:#e9d5ff; }
        .btn { background: linear-gradient(135deg, var(--primary), var(--secondary)); color:#fff; border:none; padding:10px 20px; border-radius:20px; font-weight:600; cursor:pointer; transition: transform 0.2s, box-shadow 0.2s; display:inline-block; margin:5px; text-decoration:none; font-size:14px; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(124,58,237,0.5); }
        .btn:active { transform: scale(0.96); }
        .btn:disabled { opacity:0.5; pointer-events:none; }
        .btn-sm { padding:6px 12px; font-size:12px; }
        /* ===== ПОРТФОЛИО ===== */
        .categories-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
        .category-card { background: rgba(15,7,25,0.8); border:1px solid var(--card-border); border-radius:var(--radius); padding:20px; text-align:center; cursor:pointer; transition: transform 0.3s, border-color 0.3s; position:relative; overflow:hidden; }
        .category-card:hover { transform: scale(1.02); border-color: var(--primary); }
        .category-card .folder-icon { font-size:48px; margin-bottom:10px; position:relative; z-index:1; }
        .category-card .category-name { font-weight:600; margin-bottom:8px; position:relative; z-index:1; }
        .category-card .work-count { color:var(--text-muted); font-size:12px; position:relative; z-index:1; }
        .category-card .cover-bg { position:absolute; top:0; left:0; width:100%; height:100%; background-size:cover; background-position:center; opacity:0.15; pointer-events:none; z-index:0; }
        .category-card .admin-actions { position:absolute; top:5px; right:5px; display:none; gap:3px; z-index:2; }
        .admin-mode .category-card .admin-actions { display:flex; }
        .works-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:15px; }
        .work-item { background: rgba(15,7,25,0.9); border:1px solid var(--card-border); border-radius:var(--radius); overflow:hidden; position:relative; display:flex; flex-direction:column; }
        .work-image-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 100%;
            height: 0;
            overflow: hidden;
            background: #0a050d;
        }
        .work-image-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }
        .work-item .work-info { padding: 8px; font-size:12px; color:var(--text-muted); text-align:center; flex-shrink:0; }
        .work-item .work-actions { position:absolute; top:8px; right:8px; display:flex; gap:5px; z-index:2; }
        .work-actions button { background:rgba(0,0,0,0.6); border:none; color:white; border-radius:50%; width:30px; height:30px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; }
        .add-work-btn { display:flex; align-items:center; justify-content:center; aspect-ratio:1/1; background: rgba(124,58,237,0.2); border:2px dashed var(--primary); border-radius:var(--radius); cursor:pointer; font-size:32px; color:var(--primary); transition: background 0.3s; }
        .add-work-btn:hover { background: rgba(124,58,237,0.3); }
        /* ===== МОДАЛЬНОЕ ОКНО ===== */
        .modal-overlay { position:fixed; inset:0; background: rgba(0,0,0,0.7); display:none; align-items:center; justify-content:center; z-index:1000; padding:16px; }
        .modal { background:#1a0b2e; border:1px solid var(--card-border); border-radius:var(--radius); padding:24px; width:100%; max-width:500px; max-height:90vh; overflow-y:auto; position:relative; }
        .modal input, .modal textarea, .modal select { width:100%; padding:10px; margin-bottom:10px; background:rgba(255,255,255,0.05); border:1px solid var(--card-border); border-radius:10px; color:#fff; font-size:14px; }
        .modal textarea { min-height:80px; resize:vertical; }
        .modal button { margin-right:10px; }
        .modal img.preview { max-width:100%; max-height:200px; object-fit:contain; margin-bottom:10px; border-radius:10px; display:none; }
        .admin-only { display:none; }
        .admin-mode .admin-only { display:inline-block; }
        /* ===== ОТЗЫВЫ ===== */
        .review-card { padding:20px; position:relative; }
        .review-author { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
        .review-avatar { width:40px; height:40px; border-radius:50%; background: linear-gradient(135deg, #7c3aed, #be185d); display:flex; align-items:center; justify-content:center; font-weight:700; color:white; overflow:hidden; flex-shrink:0; }
        .review-avatar img { width:100%; height:100%; object-fit:cover; }
        .review-text { color:var(--text-muted); font-size:14px; line-height:1.6; }
        .review-images { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
        .review-images img { width:60px; height:60px; object-fit:cover; border-radius:8px; cursor:pointer; border:1px solid var(--card-border); }
        .review-images img.single { width:100%; height:auto; max-height:300px; object-fit:contain; }
        .stars { color:#fbbf24; letter-spacing:2px; }
        .review-footer { display:flex; align-items:center; gap:12px; margin-top:12px; flex-wrap:wrap; }
        .like-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 15px;
            color: var(--text-muted);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        .like-btn:active { transform: scale(0.9); }
        .like-btn .emoji { font-size:16px; display:inline-block; transition:transform 0.15s ease; }
        .like-btn .count { font-size:13px; font-weight:500; min-width:12px; }
        .like-btn.active { background: linear-gradient(135deg, rgba(124,58,237,0.5), rgba(190,24,93,0.5)); border-color: rgba(124,58,237,0.4); color:#fff; }
        .like-btn.animating .emoji { animation: pop 0.35s ease; }
        @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.5); } 100% { transform: scale(1); } }
        .review-actions { display:flex; gap:5px; }
        .review-actions button { background:rgba(255,255,255,0.05); border:none; color:var(--text-muted); padding:4px 10px; border-radius:12px; font-size:12px; cursor:pointer; transition:background 0.2s; }
        .review-actions button:hover { background:rgba(255,255,255,0.1); }
        .admin-reply { margin-top:10px; padding:10px 14px; background:rgba(124,58,237,0.08); border-left:2px solid var(--primary); border-radius:8px; font-size:13px; color:var(--text-muted); display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
        .admin-reply .reply-text { flex:1; }
        .admin-reply strong { color:#a78bfa; font-weight:600; }
        .admin-reply .edit-reply-btn { background:transparent; border:none; color:var(--text-muted); cursor:pointer; font-size:14px; padding:2px 6px; border-radius:4px; transition:background 0.2s; flex-shrink:0; }
        .admin-reply .edit-reply-btn:hover { background:rgba(255,255,255,0.05); }
        .admin-reply-edit { display:flex; gap:8px; width:100%; margin-top:8px; }
        .admin-reply-edit textarea { flex:1; padding:8px; border:1px solid var(--card-border); border-radius:8px; background:rgba(0,0,0,0.3); color:var(--text); font-size:13px; resize:vertical; min-height:50px; }
        .admin-reply-edit button { padding:8px 16px; font-size:12px; }
        /* ===== ЗАКАЗЫ ===== */
        .order-list { display:flex; flex-direction:column; gap:12px; }
        .order-item { display:flex; align-items:center; justify-content:space-between; padding:16px 18px; background: rgba(15,7,25,0.8); border:1px solid var(--card-border); border-radius:16px; cursor: pointer; transition: border-color 0.2s; }
        .order-item:hover { border-color: var(--primary); }
        .order-info h4 { font-size:16px; font-weight:600; }
        .order-info p { font-size:12px; color:var(--text-muted); margin-top:4px; }
        .order-info a { color:var(--accent); text-decoration:none; }
        .price-old { text-decoration: line-through; color: var(--text-muted); margin-right: 5px; }
        .price-new { color: var(--accent); font-weight: 700; }
        /* ===== КОНСТРУКТОР ЗАКАЗА ===== */
        .option-group { margin-bottom:16px; }
        .option-group label { display:flex; align-items:center; gap:10px; padding:10px 14px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); border-radius:12px; cursor:pointer; transition:all 0.2s; }
        .option-group label:hover { background:rgba(255,255,255,0.06); }
        .option-group label input[type="checkbox"] { width:18px; height:18px; accent-color:var(--primary); cursor:pointer; flex-shrink:0; }
        .option-group .option-info { flex:1; }
        .option-group .option-name { font-size:14px; font-weight:500; }
        .option-group .option-price { font-size:13px; color:var(--text-muted); }
        .option-group .quantity-control { display:flex; align-items:center; gap:8px; margin-top:6px; margin-left:28px; }
        .option-group .quantity-control button { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); border-radius:8px; color:#fff; width:28px; height:28px; cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; transition:background 0.2s; }
        .option-group .quantity-control button:hover { background:rgba(255,255,255,0.12); }
        .option-group .quantity-control span { min-width:24px; text-align:center; font-weight:500; }
        .order-total { margin-top:20px; padding-top:16px; border-top:1px solid var(--card-border); text-align:right; font-size:18px; font-weight:700; color:#e9d5ff; }
        .order-total span { color:var(--accent); }
        .reference-upload { margin-top:12px; }
        .reference-upload .preview-thumb { position:relative; display:inline-block; margin:4px; }
        .reference-upload .preview-thumb img { width:60px; height:60px; object-fit:cover; border-radius:8px; border:1px solid var(--card-border); }
        .reference-upload .preview-thumb .remove-btn { position:absolute; top:-6px; right:-6px; background:rgba(255,0,0,0.8); color:#fff; border:none; border-radius:50%; width:18px; height:18px; cursor:pointer; font-size:10px; display:flex; align-items:center; justify-content:center; }
        /* ===== ОСТАЛЬНЫЕ СТИЛИ ===== */
        .resume-highlight { font-size:16px; font-weight:600; font-style:italic; color:#e9d5ff; margin:12px 0; padding:14px 16px; background: rgba(124,58,237,0.15); border-left:3px solid var(--primary); border-radius:12px; }
        .skills-list { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
        .skill-badge { background: rgba(124,58,237,0.2); border:1px solid rgba(124,58,237,0.3); padding:8px 14px; border-radius:20px; font-size:13px; font-weight:500; color:#ddd6fe; }
        .experience-badge { display:inline-block; background:linear-gradient(135deg, var(--primary), var(--secondary)); padding:6px 14px; border-radius:20px; font-weight:700; color:#fff; font-size:14px; margin-left:8px; }
        .footer { text-align:center; margin-top:30px; padding:10px; color:var(--text-muted); font-size:12px; opacity:0.7; position:relative; }
        .footer a { color: var(--accent); text-decoration: none; }
        .footer .version { position:absolute; bottom:5px; right:10px; font-size:10px; opacity:0.5; color:var(--text-muted); pointer-events:none; }
        #imageViewer { position:fixed; inset:0; background:rgba(0,0,0,0.9); display:none; align-items:center; justify-content:center; z-index:2000; flex-direction:column; overflow:hidden; touch-action:none; }
        #imageViewer img { max-width:95%; max-height:85%; object-fit:contain; transition: transform 0.2s; transform-origin:center; position:relative; }
        #imageViewer .save-btn { margin-top:15px; }
        #imageViewerClose { position:absolute; top:20px; right:20px; background:rgba(0,0,0,0.6); border:none; color:white; font-size:28px; width:40px; height:40px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:2001; }
        #loadingScreen { position:fixed; top:0; left:0; width:100%; height:100%; background: radial-gradient(ellipse at center, #1a0b2e 0%, #0a0012 100%); display:flex; align-items:center; justify-content:center; z-index:9999; transition: opacity 0.5s ease, visibility 0.5s ease; overflow:hidden; }
        #loadingScreen.hidden { opacity:0; visibility:hidden; pointer-events:none; }
        .loader { width:80px; height:80px; border-radius:50%; border:4px solid rgba(124,58,237,0.2); border-top-color: var(--primary); animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-logo { font-size:48px; margin-bottom:20px; animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); } }
        .loading-stars { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
        .loading-star { position:absolute; background:white; border-radius:50%; opacity:0; animation: loadingTwinkle 2s ease-in-out infinite; }
        @keyframes loadingTwinkle { 0%,100% { opacity:0; transform:scale(0.3); } 50% { opacity:0.8; transform:scale(1); } }
        @media (max-width: 400px) { .categories-grid { grid-template-columns:repeat(2,1fr); } .brand-name { font-size:24px; } .tab-btn { font-size:11px; padding:10px 4px; } .card { padding:18px; } }
        .preview-thumb { position: relative; display: inline-block; margin: 5px; }
        .preview-thumb img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; border: 1px solid var(--card-border); }
        .preview-thumb .remove-btn { position: absolute; top: -8px; left: -8px; background: rgba(255, 0, 0, 0.8); color: white; border: none; width: 20px; height: 20px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; padding: 0; }
        .case-container { position: relative; width: 100%; max-width: 400px; margin: 20px auto; overflow: hidden; }
        .case-strip { display: flex; transition: transform 0.1s linear; }
        .case-item { min-width: 120px; height: 100px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; color: #fff; background: linear-gradient(145deg, #2a1a3e, #1a0b2e); border: 2px solid var(--card-border); border-radius: 16px; margin: 0 5px; }
        .case-arrow { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 40px; color: #fff; pointer-events: none; z-index: 2; filter: drop-shadow(0 0 10px rgba(255,255,255,0.8)); }
        .case-modal { text-align: center; }
        .case-modal .close-btn { position: absolute; top: 10px; right: 10px; background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
        .case-timer { margin: 10px 0; font-size: 14px; color: #fbbf24; }
        .post-modal { text-align: center; }
        .post-modal .close-btn { position: absolute; top: 10px; right: 10px; background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
        .post-content { margin: 15px 0; line-height: 1.5; }
        .post-link { color: #a855f7; text-decoration: underline; }
        .post-image { max-width: 100%; border-radius: 10px; margin: 10px 0; }
        .post-checkbox { display: flex; align-items: center; gap: 5px; margin: 10px 0; }
        .post-checkbox input { width: auto; }
        .admin-post-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; border: 1px solid var(--card-border); border-radius: 10px; margin-bottom: 10px; }
        .admin-post-item button { background: none; border: none; color: #f87171; cursor: pointer; font-size: 18px; }
        .order-item.admin-grab { cursor: grab; }
        .order-item.admin-grab:active { cursor: grabbing; }
    </style>
</head>
<body oncontextmenu="return false;">
    <!-- ===== ЗАГРУЗОЧНЫЙ ЭКРАН ===== -->
    <div id="loadingScreen">
        <div class="loading-stars" id="loadingStars"></div>
        <div style="text-align: center; position: relative; z-index: 1;">
            <div class="loading-logo">🎨</div>
            <div class="loader"></div>
        </div>
    </div>

    <!-- ===== ЗВЁЗДЫ И АСТЕРОИДЫ ===== -->
    <div class="stars-container" id="starsContainer"></div>
    <div class="asteroid-container" id="asteroidContainer"></div>

    <!-- ===== ОСНОВНОЙ КОНТЕЙНЕР ===== -->
    <div class="app-container">
        <div class="header">
            <button class="faq-button" onclick="openFaqModal()">?</button>
            <button class="wheel-button" id="wheelBtn" onclick="openCaseModal()">🎁</button>
            <button class="promo-button" onclick="openPromoModal()">🏷️</button>
            <div class="logo" id="logoContainer">

        function dataURLToBlob(dataUrl) {
            var parts = dataUrl.split(',');
            var mime = parts[0].match(/:(.*?);/)[1];
            var bstr = atob(parts[1]);
            var n = bstr.length;
            var u8arr = new Uint8Array(n);
            while (n--) { u8arr[n] = bstr.charCodeAt(n); }
            return new Blob([u8arr], { type: mime });
        }

        function compressImage(file, maxSize, quality) {
            maxSize = maxSize || 800;
            quality = quality || 0.7;
            return new Promise(function(resolve) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    var img = new Image();
                    img.onload = function() {
                        var canvas = document.createElement('canvas');
                        var width = img.width;
                        var height = img.height;
                        if (width > height && width > maxSize) {
                            height = height * maxSize / width;
                            width = maxSize;
                        } else if (height > maxSize) {
                            width = width * maxSize / height;
                            height = maxSize;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        var ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = function() { resolve(null); };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function uploadFileToSupabase(file, folder) {
            var cleanName = file.name.replace(/[^\w\d\-_.]/g, '_');
            var timestamp = Date.now();
            var fileName = timestamp + '_' + cleanName;
            var path = folder + '/' + fileName;
            return supabase.storage.from('public').upload(path, file, { cacheControl: '3600', upsert: false })
                .then(function(res) {
                    if (res.error) throw res.error;
                    var publicUrl = supabase.storage.from('public').getPublicUrl(path);
                    if (!publicUrl.data || !publicUrl.data.publicUrl) {
                        throw new Error('Не удалось получить URL загруженного файла');
                    }
                    return publicUrl.data.publicUrl;
                });
        }

        function downloadImage(url, filename) {
            if (!url) {
                alert('Ошибка: URL изображения не указан');
                return;
            }
            fetch(url)
                .then(function(response) { return response.blob(); })
                .then(function(blob) {
                    var link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = filename || 'image.jpg';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    setTimeout(function() { URL.revokeObjectURL(link.href); }, 1000);
                })
                .catch(function(err) {
                    alert('Не удалось скачать изображение: ' + err.message);
                });
        }

            });
            return Promise.all(promises);

            if (remaining <= 0) {
                timerEl.textContent = 'Доступно для прокрута!';
                var btn = document.getElementById('caseSpinBtn');
                if (btn) btn.disabled = false;
                return;
            }
            var days = Math.floor(remaining / (24*60*60*1000));
            var hours = Math.floor((remaining % (24*60*60*1000)) / (60*60*1000));
            var minutes = Math.floor((remaining % (60*60*1000)) / (60*1000));
            var seconds = Math.floor((remaining % (60*1000)) / 1000);

            strip.innerHTML = '';

        function spinCase() {
            var spinBtn = document.getElementById('caseSpinBtn');
            if (spinBtn.disabled) return;
            spinBtn.disabled = true;
            var strip = document.getElementById('caseStrip');
            var items = strip.children;
            var itemWidth = items[0].offsetWidth + 10;
            var totalItems = items.length;

            var totalProb = caseProbabilities.reduce(function(a,b){ return a+b; }, 0);
            var r = Math.random() * totalProb;
            var chosenIndex = 0;
            for (var i = 0; i < caseProbabilities.length; i++) {
                r -= caseProbabilities[i];
                if (r <= 0) { chosenIndex = i; break; }
            }

            var repetitions = totalItems / caseItems.length;
            var targetItemIndex = (repetitions - 1) * caseItems.length + chosenIndex;

            var containerWidth = document.getElementById('caseContainer').clientWidth;
            var targetX = -(targetItemIndex * itemWidth) + (containerWidth - itemWidth) / 2;
            var startX = strip.getBoundingClientRect().left - document.getElementById('caseContainer').getBoundingClientRect().left;
            var duration = Math.random() * (5000 - 3000) + 3000;
            var startTime = performance.now();

            function animate(now) {
                var elapsed = now - startTime;
                var progress = Math.min(elapsed / duration, 1);
                var ease = 1 - Math.pow(1 - progress, 3);
                var x = startX + (targetX - startX) * ease;
                strip.style.transform = 'translateX(' + x + 'px)';
                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    var discount = parseInt(caseItems[chosenIndex]);
                    if (!window.isAdmin) {
                        applyDiscount(discount);
                        localStorage.setItem('lastSpinTime', Date.now());
                        localStorage.setItem('lastSpinDiscount', discount);
                        lastSpinTime = Date.now();
                        lastSpinDiscount = discount;
                        alert('Поздравляем! Ваша скидка: ' + discount + '%');
                    } else {
                        alert('Вы админ, скидка не применена (тестовый режим). Выпало: ' + discount + '%');
                    }
                    canSpinNow = false;
                    spinBtn.disabled = false;
                    closeModal();
                    renderOrdersSection();
                }
            }
            requestAnimationFrame(animate);
        }

                if (!discount) return;
                var data = { code: code, type: 'discount', used: false };
                if (discount.toLowerCase() === 'free') {
                    data.free = true;
                } else {
                    data.discount_percent = parseInt(discount);
                }
                supabase.from('promocodes').insert([data])
                    .then(function(res) {
                        if (res.error) { alert('Ошибка: ' + res.error.message); return; }
                        alert('Промокод на скидку создан!');
                    });
            }
            closeModal();
        }

        function loadOptionsForService(serviceId) {
            var container = document.getElementById('optionManagerContent');
            container.innerHTML = '<p style="color:var(--text-muted)">Загрузка...</p>';

            supabase.from('service_options').select('*').eq('service_id', serviceId).order('order', { ascending: true })
                .then(function(res) {
                    if (res.error) {
                        container.innerHTML = '<p style="color:var(--text-muted)">Ошибка загрузки</p>';
                        return;
                    }
                    var options = res.data || [];
                    var html = `
                        <div style="margin-bottom:15px;">
                            <button class="btn btn-sm" onclick="showAddOptionForm(${serviceId})">➕ Добавить опцию</button>
                        </div>
                        <div id="optionsList">
                    `;
                    if (options.length === 0) {
                        html += '<p style="color:var(--text-muted)">Нет опций для этой услуги</p>';
                    } else {
                        options.forEach(function(opt, idx) {
                            html += `
                                <div class="order-item" data-id="${opt.id}" style="cursor:grab; margin-bottom:8px;">
                                    <div class="order-info">
                                        <h4>${opt.name}</h4>
                                        <p>${opt.price} ₽ ${opt.description ? '· ' + opt.description : ''}</p>
                                    </div>
                                    <div>
                                        <button class="btn btn-sm" onclick="editOption(${opt.id})">✏️</button>
                                        <button class="btn btn-sm" onclick="deleteOption(${opt.id})">🗑️</button>
                                    </div>
                                </div>
                            `;
                        });
                    }
                    html += '</div>';
                    container.innerHTML = html;

                    // Сортировка опций
                    var list = document.getElementById('optionsList');
                    if (list && window.isAdmin) {
                        if (sortableInstances.options) sortableInstances.options.destroy();
                        sortableInstances.options = new Sortable(list, {
                            animation: 150,
                            delay: 200,
                            delayOnTouchOnly: true,
                            onEnd: function(evt) {
                                var items = [].slice.call(list.children).filter(function(el) {
                                    return el.dataset && el.dataset.id;
                                });
                                updateOptionsOrder(items);
                            }
                        });
                    }
                });
        }

        function updateOptionsOrder(items) {
            var promises = [];
            items.forEach(function(item, index) {
                var id = item.dataset.id;
                promises.push(supabase.from('service_options').update({ order: index }).eq('id', id));
            });
            Promise.all(promises);
        }

        function showAddOptionForm(serviceId) {
            var container = document.getElementById('optionManagerContent');
            var formHtml = `
                <div style="background:rgba(255,255,255,0.03); border-radius:12px; padding:16px; margin-top:10px;">
                    <h4>Добавить опцию</h4>
                    <input type="text" id="optName" placeholder="Название опции (например, Аватарка)">
                    <input type="number" id="optPrice" placeholder="Цена (₽)">
                    <input type="text" id="optDescription" placeholder="Описание (необязательно)">
                    <button class="btn btn-sm" onclick="saveOption(${serviceId})">Сохранить</button>
                    <button class="btn btn-sm" onclick="loadOptionsForService(${serviceId})" style="background:rgba(255,255,255,0.1);">Отмена</button>

            `;
            // Вставляем форму в начало контейнера
            var containerHtml = container.innerHTML;

        function saveOption(serviceId) {
            var name = document.getElementById('optName').value.trim();
            var price = document.getElementById('optPrice').value.trim();
            var description = document.getElementById('optDescription').value.trim();
            if (!name) { alert('Введите название'); return; }
            if (!price) { alert('Введите цену'); return; }

            supabase.from('service_options').select('order').eq('service_id', serviceId).order('order', { ascending: false }).limit(1)
                .then(function(res) {
                    var nextOrder = (res.data && res.data.length > 0) ? (res.data[0].order || 0) + 1 : 0;
                    return supabase.from('service_options').insert([{
                        service_id: serviceId,
                        name: name,
                        price: parseInt(price),
                        description: description,
                        order: nextOrder
                    }]);
                })
                .then(function() {
                    loadOptionsForService(serviceId);
                })
                .catch(function(err) {
                    alert('Ошибка: ' + err.message);
                });
        }

        function editOption(optionId) {
            supabase.from('service_options').select('*').eq('id', optionId).single()
                .then(function(res) {
                    if (res.error || !res.data) return;
                    var opt = res.data;
                    var serviceId = opt.service_id;
                    var container = document.getElementById('optionManagerContent');
                    var formHtml = `
                        <div style="background:rgba(255,255,255,0.03); border-radius:12px; padding:16px; margin-top:10px;">
                            <h4>Редактировать опцию</h4>
                            <input type="text" id="editOptName" placeholder="Название" value="${opt.name}">
                            <input type="number" id="editOptPrice" placeholder="Цена (₽)" value="${opt.price}">
                            <input type="text" id="editOptDescription" placeholder="Описание" value="${opt.description || ''}">
                            <button class="btn btn-sm" onclick="updateOption(${optionId}, ${serviceId})">Сохранить</button>
                            <button class="btn btn-sm" onclick="loadOptionsForService(${serviceId})" style="background:rgba(255,255,255,0.1);">Отмена</button>
                        </div>
                    `;
                    // Заменяем первый элемент списка на форму
                    var list = document.getElementById('optionsList');
                    if (list) {
                        list.innerHTML = formHtml + list.innerHTML;
                    } else {
                        container.innerHTML = formHtml + container.innerHTML;
                    }
                });
        }

        function updateOption(optionId, serviceId) {
            var name = document.getElementById('editOptName').value.trim();
            var price = document.getElementById('editOptPrice').value.trim();
            var description = document.getElementById('editOptDescription').value.trim();
            if (!name) { alert('Введите название'); return; }
            if (!price) { alert('Введите цену'); return; }

            supabase.from('service_options').update({
                name: name,
                price: parseInt(price),
                description: description
            }).eq('id', optionId)
                .then(function() {
                    loadOptionsForService(serviceId);
                })
                .catch(function(err) {
                    alert('Ошибка: ' + err.message);
                });
        }

        function deleteOption(optionId) {
            if (!confirm('Удалить опцию?')) return;
            supabase.from('service_options').select('service_id').eq('id', optionId).single()
                .then(function(res) {
                    if (res.error) return;
                    var serviceId = res.data.service_id;
                    return supabase.from('service_options').delete().eq('id', optionId)
                        .then(function() {
                            loadOptionsForService(serviceId);
                        });
                })
                .catch(function(err) {
                    alert('Ошибка: ' + err.message);
                });
        }

        function showCreatePostForm() {
            var modal = document.getElementById('modalOverlay');

            content.innerHTML = `
                <h3>Создать пост</h3>

        function previewPostImage(event) {
            var file = event.target.files[0];
            if (!file) return;
            tempPostFile = file;
            var reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('postImagePreview').src = e.target.result;
                document.getElementById('postImagePreview').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        function savePost() {
            var title = document.getElementById('postTitle').value.trim();
            var content = document.getElementById('postContent').value.trim();
            var conditions = document.getElementById('postConditions').value.trim();
            var link = document.getElementById('postLink').value.trim();
            var activeUntil = document.getElementById('postActiveUntil').value.trim();
            if (!title || !content) { alert('Заполните заголовок и текст'); return; }
            var activeUntilDate = null;
            if (activeUntil !== '0' && activeUntil) {
                activeUntilDate = new Date(activeUntil);
                if (isNaN(activeUntilDate.getTime())) {
                    alert('Неверный формат даты');
                    return;
                }
            }
            var postData = {
                title: title,
                content: content,
                conditions: conditions,
                link: link,
                active: true,
                active_until: activeUntilDate ? activeUntilDate.toISOString() : null
            };
            if (tempPostFile) {
                compressImage(tempPostFile, 800, 0.7)
                    .then(function(compressedDataUrl) {
                        var blob = dataURLToBlob(compressedDataUrl);
                        var file = new File([blob], tempPostFile.name, { type: 'image/jpeg' });
                        return uploadFileToSupabase(file, 'posts');
                    })
                    .then(function(url) {
                        postData.image = url;
                        tempPostFile = null;
                        return supabase.from('posts').insert([postData]);
                    })
                    .then(function(res) {
                        if (res.error) { alert('Ошибка сохранения: ' + res.error.message); return; }
                        alert('Пост опубликован!');
                        openPostManager();
                    })
                    .catch(function(err) {
                        alert('Ошибка загрузки изображения: ' + err.message);
                    });
            } else {
                supabase.from('posts').insert([postData])
                    .then(function(res) {
                        if (res.error) { alert('Ошибка сохранения: ' + res.error.message); return; }
                        alert('Пост опубликован!');
                        openPostManager();
                    });
            }
        }

        function deletePost(id) {
            if (confirm('Удалить этот пост для всех?')) {
                supabase.from('posts').update({ active: false }).eq('id', id)
                    .then(function() {
                        loadPostsList();
                    });
            }
        }

        // ================================================================
        // ПОКАЗ ПОСТОВ ПРИ ЗАГРУЗКЕ
        // ================================================================
        function loadActivePosts() {
            supabase.from('posts').select('*').eq('active', true)
                .then(function(res) {
                    if (res.error) throw res.error;
                    activePosts = [];
                    res.data.forEach(function(post) {
                        if (post.active_until && new Date(post.active_until) < new Date()) {
                            supabase.from('posts').update({ active: false }).eq('id', post.id);
                            return;
                        }
                        activePosts.push(post);
                    });
                    if (activePosts.length > 0) {
                        showPost(activePosts[0]);
                    }
                })
                .catch(function(err) {
                    console.error('Ошибка загрузки постов:', err);
                });
        }

        function showPost(post) {
            if (viewedPosts.indexOf(post.id.toString()) !== -1) return;
            currentPostId = post.id;
            var modal = document.getElementById('modalOverlay');
            var content = document.getElementById('modalContent');
            content.innerHTML = `
                <div class="post-modal">
                    <button class="close-btn" onclick="askClosePost()">×</button>
                    <h3>${post.title || 'Объявление'}</h3>
                    ${post.image ? '<img src="' + post.image + '" class="post-image">' : ''}
                    <div class="post-content">${post.content}</div>
                    ${post.conditions ? '<p><strong>Условия:</strong> ' + post.conditions + '</p>' : ''}
                    ${post.link ? '<a class="post-link" href="' + post.link + '" target="_blank">Перейти к боту</a>' : ''}
                </div>
            `;
            modal.style.display = 'flex';
        }

        function askClosePost() {
            var modal = document.getElementById('modalOverlay');
            var content = document.getElementById('modalContent');
            content.innerHTML = `
                <div class="post-modal">
                    <button class="close-btn" onclick="closeModal()">×</button>
                    <h3>Не показывать этот пост?</h3>
                    <label class="post-checkbox">
                        <input type="checkbox" id="dontShowAgain"> Больше не показывать этот пост
                    </label>
                    <button class="btn" onclick="confirmClosePost()">Подтвердить</button>
                    <button class="btn" onclick="closeModal()">Отмена</button>
                </div>
            `;
            modal.style.display = 'flex';
        }

        function confirmClosePost() {
            var dontShow = document.getElementById('dontShowAgain').checked;
            if (dontShow && currentPostId) {
                if (viewedPosts.indexOf(currentPostId.toString()) === -1) {
                    viewedPosts.push(currentPostId.toString());
                    localStorage.setItem('viewedPosts', JSON.stringify(viewedPosts));
                }
            }
            closeModal();
            var nextPost = null;
            for (var i = 0; i < activePosts.length; i++) {
                if (viewedPosts.indexOf(activePosts[i].id.toString()) === -1) {
                    nextPost = activePosts[i];
                    break;
                }
            }
            if (nextPost) {
                showPost(nextPost);
            }
        }

        function setupRealTimeListeners() {
            // Категории
            supabase.channel('portfolio_categories_changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'portfolio_categories' }, function(payload) {
                    console.log('Изменение в категориях:', payload);
                    loadPortfolioCategories();
                    if (currentCategoryId) openCategory(currentCategoryId);
                })
                .subscribe(function(status, err) {
                    if (err) console.error('Ошибка подписки на категории:', err);
                });

            // Услуги
            supabase.channel('services_changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'services' }, function(payload) {
                    console.log('Изменение в услугах:', payload);
                    loadServices();
                })
                .subscribe();

            // Опции услуг
            supabase.channel('service_options_changes')

        function setupSortableForCategories() {
            var grid = document.getElementById('categoriesGrid');
            if (!grid || !window.isAdmin) return;
            if (sortableInstances.categories) sortableInstances.categories.destroy();
            sortableInstances.categories = new Sortable(grid, {
                animation: 150,
                delay: 200,
                delayOnTouchOnly: true,
                onEnd: function(evt) {
                    var items = [].slice.call(grid.children);
                    updateOrder('portfolio_categories', items);
                }
            });
        }

        function setupSortableForWorks() {
            var grid = document.getElementById('worksGrid');
            if (!grid || !window.isAdmin) return;
            if (sortableInstances.works) sortableInstances.works.destroy();
            sortableInstances.works = new Sortable(grid, {
                animation: 150,
                delay: 200,
                delayOnTouchOnly: true,
                onEnd: function(evt) {
                    var fromIndex = evt.oldIndex;
                    var toIndex = evt.newIndex;
                    updateWorksOrder(fromIndex, toIndex);
                }
            });
        }

        function updateWorksOrder(fromIndex, toIndex) {
            supabase.from('portfolio_categories').select('items').eq('id', currentCategoryId).single()
                .then(function(res) {
                    if (res.error) return;
                    var items = res.data.items || [];
                    var moved = items.splice(fromIndex, 1)[0];
                    items.splice(toIndex, 0, moved);
                    supabase.from('portfolio_categories').update({ items: items }).eq('id', currentCategoryId);
                });

        function previewWorkImage(event) {

        function saveWork() {

                .then(function(compressedDataUrl) {

        function openOrderConstructor(serviceId) {
            var service = servicesData.find(function(s) { return s.id == serviceId; });
            if (!service) return;

            var options = serviceOptionsData.filter(function(o) { return o.service_id == serviceId; });

            var modal = document.getElementById('modalOverlay');
            var content = document.getElementById('modalContent');

            currentOrderService = service;
            currentOrderOptions = options;
            currentOrderQuantities = {};
            currentOrderFiles = [];
            currentOrderDescription = '';

            var html = `
                <div style="max-height:75vh; overflow-y:auto;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                        <h3>${service.emoji} ${service.name}</h3>
                        <button class="btn" onclick="closeModal()" style="margin:0;">×</button>
                    </div>
                    <p style="color:var(--text-muted); font-size:14px; margin-bottom:15px;">${service.description || ''}</p>
                    <div id="orderOptionsContainer">
            `;

            if (options.length === 0) {
                html += '<p style="color:var(--text-muted)">Для этой услуги пока нет опций. Свяжитесь с дизайнером для уточнения.</p>';
            } else {
                options.forEach(function(opt, idx) {
                    var qty = currentOrderQuantities[opt.id] || 1;
                    html += `
                        <div class="option-group" data-opt-id="${opt.id}">
                            <label>
                                <input type="checkbox" onchange="toggleOption(${opt.id}, this.checked)">
                                <div class="option-info">
                                    <div class="option-name">${opt.name}</div>
                                    <div class="option-price">${opt.price} ₽ ${opt.description ? '· ' + opt.description : ''}</div>
                                </div>
                            </label>
                            <div class="quantity-control" id="qtyControl_${opt.id}" style="display:none;">
                                <button onclick="changeQuantity(${opt.id}, -1)">−</button>
                                <span id="qtyDisplay_${opt.id}">${qty}</span>
                                <button onclick="changeQuantity(${opt.id}, 1)">+</button>
                                <span style="font-size:12px; color:var(--text-muted); margin-left:8px;" id="priceDisplay_${opt.id}">${opt.price} ₽</span>
                            </div>
                        </div>
                    `;
                });
            }

            html += `
                    </div>
                    <div class="order-total">
                        Итого: <span id="orderTotalPrice">0</span> ₽
                    </div>
                    <div style="margin-top:15px;">
                        <textarea id="orderDescription" placeholder="Опишите ваше ТЗ (что нужно сделать, стиль, цвета, примеры...)" style="min-height:80px;"></textarea>
                    </div>
                    <div class="reference-upload">
                        <p style="color:var(--text-muted); font-size:13px; margin-bottom:8px;">📎 Прикрепить референсы (до 3 изображений)</p>
                        <input type="file" id="refInput" accept="image/*" multiple onchange="handleRefFiles(event)">
                        <div id="refPreview" style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;"></div>
                    </div>
                    <button class="btn" onclick="submitOrderWithOptions()" style="width:100%; margin-top:15px;">✅ Отправить заявку</button>
                </div>
            `;

            content.innerHTML = html;
            modal.style.display = 'flex';

            // Если есть опции, выбираем первую по умолчанию
            if (options.length > 0) {
                var firstCheckbox = content.querySelector('.option-group input[type="checkbox"]');
                if (firstCheckbox) {
                    firstCheckbox.checked = true;
                    toggleOption(options[0].id, true);
                }
            }

            // Обновляем цену
            updateOrderTotal();
        }

        function toggleOption(optId, checked) {
            var qtyControl = document.getElementById('qtyControl_' + optId);
            if (qtyControl) {
                qtyControl.style.display = checked ? 'flex' : 'none';
            }
            if (!checked) {
                currentOrderQuantities[optId] = 0;
            } else {
                if (!currentOrderQuantities[optId] || currentOrderQuantities[optId] === 0) {
                    currentOrderQuantities[optId] = 1;
                }
            }
            updateOrderTotal();
            updateQuantityDisplay(optId);
        }

        function changeQuantity(optId, delta) {
            var current = currentOrderQuantities[optId] || 0;
            var newQty = Math.max(0, current + delta);
            if (newQty === 0) {
                // Снимаем галочку
                var container = document.querySelector('.option-group[data-opt-id="' + optId + '"]');
                if (container) {
                    var checkbox = container.querySelector('input[type="checkbox"]');
                    if (checkbox) {
                        checkbox.checked = false;
                        toggleOption(optId, false);
                        return;
                    }
                }
            }
            currentOrderQuantities[optId] = newQty;
            updateQuantityDisplay(optId);
            updateOrderTotal();
        }

        function updateQuantityDisplay(optId) {
            var display = document.getElementById('qtyDisplay_' + optId);
            var priceDisplay = document.getElementById('priceDisplay_' + optId);
            if (display) {
                display.textContent = currentOrderQuantities[optId] || 0;
            }
            var opt = currentOrderOptions.find(function(o) { return o.id == optId; });
            if (opt && priceDisplay) {
                var qty = currentOrderQuantities[optId] || 0;
                var total = opt.price * qty;
                // Применяем скидки при количестве
                if (opt.name === 'Баннер' && qty >= 2) {
                    var discountPrice = qty >= 4 ? 300 : 350;
                    total = discountPrice * qty;
                    priceDisplay.textContent = discountPrice + ' ₽ × ' + qty + ' = ' + total + ' ₽ (скидка)';
                } else if (opt.name === 'Карточка товара' && qty >= 3) {
                    var discountPrice = qty >= 5 ? 600 : 700;
                    total = discountPrice * qty;
                    priceDisplay.textContent = discountPrice + ' ₽ × ' + qty + ' = ' + total + ' ₽ (скидка)';
                } else {
                    priceDisplay.textContent = opt.price + ' ₽ × ' + qty + ' = ' + total + ' ₽';
                }
            }
        }

        function updateOrderTotal() {
            var total = 0;
            currentOrderOptions.forEach(function(opt) {
                var qty = currentOrderQuantities[opt.id] || 0;
                if (qty > 0) {
                    var price = opt.price;
                    // Скидки
                    if (opt.name === 'Баннер') {
                        if (qty >= 4) price = 300;
                        else if (qty >= 2) price = 350;
                    } else if (opt.name === 'Карточка товара') {
                        if (qty >= 5) price = 600;
                        else if (qty >= 3) price = 700;
                    }
                    total += price * qty;
                }
            });
            var totalEl = document.getElementById('orderTotalPrice');
            if (totalEl) {
                totalEl.textContent = total;
            }
        }

        function handleRefFiles(event) {
            var files = event.target.files;
            if (!files || files.length === 0) return;
            if (files.length + currentOrderFiles.length > 3) {
                alert('Можно прикрепить не более 3 референсов');
                return;
            }
            for (var i = 0; i < files.length; i++) {
                if (currentOrderFiles.length >= 3) break;
                currentOrderFiles.push(files[i]);
                var reader = new FileReader();
                reader.onload = function(e) {
                    var preview = document.getElementById('refPreview');
                    var thumb = document.createElement('div');
                    thumb.className = 'preview-thumb';
                    thumb.innerHTML = '<img src="' + e.target.result + '" alt="референс"><button class="remove-btn" onclick="removeRef(' + (currentOrderFiles.indexOf(files[i])) + ')">×</button>';
                    preview.appendChild(thumb);
                };
                reader.readAsDataURL(files[i]);
            }
            event.target.value = '';
        }

        function removeRef(index) {
            currentOrderFiles.splice(index, 1);
            var preview = document.getElementById('refPreview');
            preview.innerHTML = '';
            currentOrderFiles.forEach(function(file, idx) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    var thumb = document.createElement('div');
                    thumb.className = 'preview-thumb';
                    thumb.innerHTML = '<img src="' + e.target.result + '" alt="референс"><button class="remove-btn" onclick="removeRef(' + idx + ')">×</button>';
                    preview.appendChild(thumb);
                };
                reader.readAsDataURL(file);
            });
        }

        function submitOrderWithOptions() {
            // Собираем выбранные опции
            var selectedOptions = [];
            currentOrderOptions.forEach(function(opt) {
                var qty = currentOrderQuantities[opt.id] || 0;
                if (qty > 0) {
                    var price = opt.price;
                    if (opt.name === 'Баннер') {
                        if (qty >= 4) price = 300;
                        else if (qty >= 2) price = 350;
                    } else if (opt.name === 'Карточка товара') {
                        if (qty >= 5) price = 600;
                        else if (qty >= 3) price = 700;
                    }
                    selectedOptions.push({
                        name: opt.name,
                        price: price,
                        quantity: qty,
                        total: price * qty
                    });
                }
            });

            if (selectedOptions.length === 0) {
                alert('Выберите хотя бы одну опцию');
                return;
            }

            var description = document.getElementById('orderDescription').value.trim();

            var total = selectedOptions.reduce(function(sum, opt) { return sum + opt.total; }, 0);

            // Формируем текст заказа
            var orderText = '📋 **Заказ на услугу:** ' + currentOrderService.emoji + ' ' + currentOrderService.name + '\n\n';
            orderText += '**Выбранные опции:**\n';
            selectedOptions.forEach(function(opt) {
                orderText += '• ' + opt.name + ' — ' + opt.quantity + ' шт. × ' + opt.price + ' ₽ = ' + opt.total + ' ₽\n';
            });
            orderText += '\n**Итого:** ' + total + ' ₽\n\n';

                orderText += '**ТЗ:**\n' + description + '\n\n';
            }
            orderText += 'Жду счёт для оплаты.';

            // Сохраняем заказ в БД
            var user = window.currentUser;
            var userName = user?.first_name || user?.username || 'Пользователь';
            var userUsername = user?.username || null;

            var order = {
                service: currentOrderService.name,
                user_name: userName,
                user_username: userUsername,
                time: new Date().toLocaleString(),
                timestamp: new Date().toISOString(),
                options: JSON.stringify(selectedOptions),
                total: total,
                description: description,
                status: 'pending'
            };

            supabase.from('orders').insert([order])
                .then(function() {
                    // Загружаем референсы, если есть

                        return uploadFileToSupabase(file, 'references/' + user?.id || 'anonymous');

                .then(function(urls) {
                    // Отправляем сообщение дизайнеру
                    var chatText = encodeURIComponent(orderText + (urls.length > 0 ? '\n\n📎 Референсы загружены.' : ''));
                    if (window.telegramAvailable && window.tg) {
                        window.tg.openTelegramLink('https://t.me/Mark1zDesign_bot?text=' + chatText);
                    } else {
                        window.open('https://t.me/Mark1zDesign_bot?text=' + chatText, '_blank');
                    }
                    closeModal();
                    alert('Заявка отправлена! Я свяжусь с вами для уточнения деталей.');
                })
                .catch(function(err) {
                    alert('Ошибка: ' + err.message);
                });
        }

        function saveNewService() {
            var emoji = document.getElementById('serviceEmoji').value.trim() || '✨';
            var name = document.getElementById('serviceName').value.trim();
            var description = document.getElementById('serviceDescription').value.trim();
            if (!name) { alert('Введите название услуги'); return; }

                emoji: emoji, name: name, description: description, price: 0, order: nextOrder

                closeModal();
            });
