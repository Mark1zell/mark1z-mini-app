<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mark1z Design</title>

    <!-- Telegram WebApp JS -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- SortableJS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

    <style>
        /* ===== ПОЛНЫЙ CSS ===== */
        :root {
            --bg-start: #0a050d;
            --bg-mid: #100820;
            --bg-end: #0a0012;
            --primary: #7c3aed;
            --secondary: #be185d;
            --accent: #9d174d;
            --text: #f5f3ff;
            --text-muted: rgba(245, 243, 255, 0.5);
            --card-bg: rgba(18, 8, 30, 0.8);
            --card-border: rgba(124, 58, 237, 0.3);
            --shadow: 0 6px 20px rgba(0,0,0,0.5);
            --radius: 20px;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, var(--bg-start), var(--bg-mid), var(--bg-end));
            color: var(--text);
            min-height: 100vh;
            padding: 16px 16px 80px;
            overflow-x: hidden;
            letter-spacing: 0.02em;
            -webkit-user-select: none;
            user-select: none;
        }
        img {
            -webkit-touch-callout: none !important;
            -webkit-user-drag: none !important;
            user-drag: none !important;
            pointer-events: auto;
        }
        .stars-container { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
        .star { position:absolute; background:rgba(255,255,255,0.7); border-radius:50%; opacity:0; animation: twinkle var(--duration) ease-in-out infinite; animation-delay: var(--delay); }
        @keyframes twinkle { 0%,100%{opacity:0; transform:scale(0.3)} 50%{opacity:0.3; transform:scale(1)} }
        .asteroid-container { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:hidden; }
        .asteroid { position:absolute; background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 70%); border-radius:50%; width:4px; height:4px; opacity:0; animation: flyAsteroid linear infinite; }
        @keyframes flyAsteroid { 0% { transform: translate(0,0) scale(0.5); opacity:0; } 10% { opacity:0.6; } 90% { opacity:0.6; } 100% { transform: translate(var(--tx), var(--ty)) scale(1.5); opacity:0; } }
        .app-container { position:relative; z-index:1; max-width:600px; margin:0 auto; }
        .header { text-align:center; padding:30px 0 20px; position: relative; }
        .header .faq-button { position:absolute; top:20px; right:20px; background: rgba(124,58,237,0.3); border:1px solid var(--card-border); color:#fff; width:40px; height:40px; border-radius:50%; font-size:20px; cursor:pointer; transition:all 0.3s; }
        .header .faq-button:hover { background: rgba(124,58,237,0.6); }
        .header .wheel-button { position:absolute; top:20px; left:20px; background: rgba(124,58,237,0.3); border:1px solid var(--card-border); color:#fff; width:40px; height:40px; border-radius:50%; font-size:20px; cursor:pointer; transition:all 0.3s; }
        .header .wheel-button:hover { background: rgba(124,58,237,0.6); }
        .header .promo-button { position:absolute; top:70px; left:20px; background: rgba(124,58,237,0.3); border:1px solid var(--card-border); color:#fff; width:40px; height:40px; border-radius:50%; font-size:20px; cursor:pointer; transition:all 0.3s; }
        .header .promo-button:hover { background: rgba(124,58,237,0.6); }
        .logo { width:100px; height:100px; margin:0 auto 16px; border-radius:28px; overflow:hidden; box-shadow:0 4px 15px rgba(124,58,237,0.3); position:relative; }
        .logo img { width:100%; height:100%; object-fit:cover; }
        .brand-name { font-size:30px; font-weight:800; background:linear-gradient(to right, #a78bfa, #c084fc, #a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation: brandGlow 6s ease-in-out infinite; }
        @keyframes brandGlow { 0%,100%{filter:drop-shadow(0 0 4px rgba(124,58,237,0.3))} 50%{filter:drop-shadow(0 0 8px rgba(124,58,237,0.5))} }
        .tagline { color:var(--text-muted); font-size:13px; letter-spacing:2px; text-transform:uppercase; }
        .tabs { display:flex; background:rgba(10,5,18,0.8); backdrop-filter:blur(20px); border:1px solid var(--card-border); border-radius:40px; padding:6px; margin:25px 0; }
        .tab-btn { flex:1; padding:12px 6px; background:transparent; border:none; color:var(--text-muted); font-weight:600; border-radius:32px; cursor:pointer; transition:all 0.3s; }
        .tab-btn.active { background:linear-gradient(135deg, rgba(124,58,237,0.7), rgba(190,24,93,0.7)); color:#fff; }
        .section { display:none; animation: fadeIn 0.4s; }
        .section.active { display:block; }
        @keyframes fadeIn { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none} }
        .card { background:var(--card-bg); backdrop-filter:blur(10px); border:1px solid var(--card-border); border-radius:var(--radius); padding:24px; margin-bottom:16px; box-shadow:var(--shadow); }
        .card h3 { font-size:21px; font-weight:700; margin-bottom:12px; color:#e9d5ff; }
        .btn { background: linear-gradient(135deg, var(--primary), var(--secondary)); color:#fff; border:none; padding:10px 20px; border-radius:20px; font-weight:600; cursor:pointer; transition: transform 0.2s, box-shadow 0.2s; display:inline-block; margin:5px; text-decoration:none; font-size:14px; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(124,58,237,0.5); }
        .btn:active { transform: scale(0.96); }
        .btn:disabled { opacity:0.5; pointer-events:none; }
        .categories-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
        .category-card { background: rgba(15,7,25,0.8); border:1px solid var(--card-border); border-radius:var(--radius); padding:20px; text-align:center; cursor:pointer; transition: transform 0.3s, border-color 0.3s; position:relative; overflow:hidden; }
        .category-card:hover { transform: scale(1.02); border-color: var(--primary); }
        .category-card .folder-icon { font-size:48px; margin-bottom:10px; position:relative; z-index:1; }
        .category-card .category-name { font-weight:600; margin-bottom:8px; position:relative; z-index:1; }
        .category-card .work-count { color:var(--text-muted); font-size:12px; position:relative; z-index:1; }
        .category-card .cover-bg { position:absolute; top:0; left:0; width:100%; height:100%; background-size:cover; background-position:center; opacity:0.15; pointer-events:none; z-index:0; }
        .category-card .admin-actions { position:absolute; top:5px; right:5px; display:none; gap:3px; z-index:2; }
        .admin-mode .category-card .admin-actions { display:flex; }
        .works-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:15px; }
        .work-item { background: rgba(15,7,25,0.9); border:1px solid var(--card-border); border-radius:var(--radius); overflow:hidden; position:relative; display:flex; flex-direction:column; }
        .work-image-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 100%;
            height: 0;
            overflow: hidden;
            background: #0a050d;
        }
        .work-image-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }
        .work-item .work-info {
            padding: 8px;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            flex-shrink: 0;
        }
        .work-item .work-actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 5px;
            z-index: 2;
        }
        .work-actions button {
            background: rgba(0,0,0,0.6);
            border: none;
            color: white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .add-work-btn { display:flex; align-items:center; justify-content:center; aspect-ratio:1/1; background: rgba(124,58,237,0.2); border:2px dashed var(--primary); border-radius:var(--radius); cursor:pointer; font-size:32px; color:var(--primary); transition: background 0.3s; }
        .add-work-btn:hover { background: rgba(124,58,237,0.3); }
        .modal-overlay { position:fixed; inset:0; background: rgba(0,0,0,0.7); display:none; align-items:center; justify-content:center; z-index:1000; }
        .modal { background:#1a0b2e; border:1px solid var(--card-border); border-radius:var(--radius); padding:24px; width:90%; max-width:400px; max-height:80vh; overflow-y:auto; position:relative; }
        .modal input, .modal textarea { width:100%; padding:10px; margin-bottom:10px; background:rgba(255,255,255,0.05); border:1px solid var(--card-border); border-radius:10px; color:#fff; }
        .modal button { margin-right:10px; }
        .modal img.preview { max-width:100%; max-height:200px; object-fit:contain; margin-bottom:10px; border-radius:10px; display:none; }
        .admin-only { display:none; }
        .admin-mode .admin-only { display:inline-block; }
        .resume-highlight { font-size:16px; font-weight:600; font-style:italic; color:#e9d5ff; margin:12px 0; padding:14px 16px; background: rgba(124,58,237,0.15); border-left:3px solid var(--primary); border-radius:12px; }
        .skills-list { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
        .skill-badge { background: rgba(124,58,237,0.2); border:1px solid rgba(124,58,237,0.3); padding:8px 14px; border-radius:20px; font-size:13px; font-weight:500; color:#ddd6fe; }
        .experience-badge { display:inline-block; background:linear-gradient(135deg, var(--primary), var(--secondary)); padding:6px 14px; border-radius:20px; font-weight:700; color:#fff; font-size:14px; margin-left:8px; }
        .review-card { padding:20px; }
        .review-author { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
        .review-avatar { width:40px; height:40px; border-radius:50%; background: linear-gradient(135deg, #7c3aed, #be185d); display:flex; align-items:center; justify-content:center; font-weight:700; color:white; overflow:hidden; }
        .review-avatar img { width:100%; height:100%; object-fit:cover; }
        .review-text { color:var(--text-muted); font-size:14px; line-height:1.6; }
        .review-images { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
        .review-images img { width:60px; height:60px; object-fit:cover; border-radius:8px; cursor:pointer; border:1px solid var(--card-border); }
        .review-images img.single { width:100%; height:auto; max-height:300px; object-fit:contain; }
        .stars { color:#fbbf24; letter-spacing:2px; }
        .order-list { display:flex; flex-direction:column; gap:12px; }
        .order-item { display:flex; align-items:center; justify-content:space-between; padding:16px 18px; background: rgba(15,7,25,0.8); border:1px solid var(--card-border); border-radius:16px; cursor: grab; }
        .order-info h4 { font-size:16px; font-weight:600; }
        .order-info p { font-size:12px; color:var(--text-muted); margin-top:4px; }
        .order-info a { color:var(--accent); text-decoration:none; }
        .price-old { text-decoration: line-through; color: var(--text-muted); margin-right: 5px; }
        .price-new { color: var(--accent); font-weight: 700; }
        .footer { text-align:center; margin-top:30px; padding:10px; color:var(--text-muted); font-size:12px; opacity:0.7; position:relative; }
        .footer a { color: var(--accent); text-decoration: none; }
        .footer .version {
            position: absolute;
            bottom: 5px;
            right: 10px;
            font-size: 10px;
            opacity: 0.5;
            color: var(--text-muted);
            pointer-events: none;
        }
        #imageViewer { position:fixed; inset:0; background:rgba(0,0,0,0.9); display:none; align-items:center; justify-content:center; z-index:2000; flex-direction:column; overflow:hidden; touch-action:none; }
        #imageViewer img { max-width:95%; max-height:85%; object-fit:contain; transition: transform 0.2s; transform-origin:center; position:relative; }
        #imageViewer .save-btn { margin-top:15px; }
        #imageViewerClose { position:absolute; top:20px; right:20px; background:rgba(0,0,0,0.6); border:none; color:white; font-size:28px; width:40px; height:40px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:2001; }
        #loadingScreen { position:fixed; top:0; left:0; width:100%; height:100%; background: radial-gradient(ellipse at center, #1a0b2e 0%, #0a0012 100%); display:flex; align-items:center; justify-content:center; z-index:9999; transition: opacity 0.5s ease, visibility 0.5s ease; overflow:hidden; }
        #loadingScreen.hidden { opacity:0; visibility:hidden; pointer-events:none; }
        .loader { width:80px; height:80px; border-radius:50%; border:4px solid rgba(124,58,237,0.2); border-top-color: var(--primary); animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-logo { font-size:48px; margin-bottom:20px; animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); } }
        .loading-stars { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
        .loading-star { position:absolute; background:white; border-radius:50%; opacity:0; animation: loadingTwinkle 2s ease-in-out infinite; }
        @keyframes loadingTwinkle { 0%,100% { opacity:0; transform:scale(0.3); } 50% { opacity:0.8; transform:scale(1); } }
        @media (max-width: 400px) { .categories-grid { grid-template-columns:repeat(2,1fr); } .brand-name { font-size:24px; } .tab-btn { font-size:11px; padding:10px 4px; } .card { padding:18px; } }
        .preview-thumb { position: relative; display: inline-block; margin: 5px; }
        .preview-thumb img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; border: 1px solid var(--card-border); }
        .preview-thumb .remove-btn { position: absolute; top: -8px; left: -8px; background: rgba(255, 0, 0, 0.8); color: white; border: none; width: 20px; height: 20px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; padding: 0; }

        .case-container { position: relative; width: 100%; max-width: 400px; margin: 20px auto; overflow: hidden; }
        .case-strip { display: flex; transition: transform 0.1s linear; }
        .case-item { min-width: 120px; height: 100px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; color: #fff; background: linear-gradient(145deg, #2a1a3e, #1a0b2e); border: 2px solid var(--card-border); border-radius: 16px; margin: 0 5px; }
        .case-arrow { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 40px; color: #fff; pointer-events: none; z-index: 2; filter: drop-shadow(0 0 10px rgba(255,255,255,0.8)); }
        .case-modal { text-align: center; }
        .case-modal .close-btn { position: absolute; top: 10px; right: 10px; background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
        .case-timer { margin: 10px 0; font-size: 14px; color: #fbbf24; }

        .post-modal { text-align: center; }
        .post-modal .close-btn { position: absolute; top: 10px; right: 10px; background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
        .post-content { margin: 15px 0; line-height: 1.5; }
        .post-link { color: #a855f7; text-decoration: underline; }
        .post-image { max-width: 100%; border-radius: 10px; margin: 10px 0; }
        .post-checkbox { display: flex; align-items: center; gap: 5px; margin: 10px 0; }
        .post-checkbox input { width: auto; }
        .admin-post-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; border: 1px solid var(--card-border); border-radius: 10px; margin-bottom: 10px; }
        .admin-post-item button { background: none; border: none; color: #f87171; cursor: pointer; font-size: 18px; }
        img {
            -webkit-touch-callout: none !important;
            -webkit-user-drag: none !important;
            user-drag: none !important;
        }
    </style>
</head>

    <!-- ===== ЗАГРУЗОЧНЫЙ ЭКРАН ===== -->
    <div id="loadingScreen">
        <div class="loading-stars" id="loadingStars"></div>
        <div style="text-align: center; position: relative; z-index: 1;">

    <div class="stars-container" id="starsContainer"></div>
    <div class="asteroid-container" id="asteroidContainer"></div>

            <button class="tab-btn" data-tab="orders">Заказы</button>

        <section id="resume" class="section active">
            <div class="card">

                <div id="aboutHighlight" class="resume-highlight"></div>
                <p id="aboutText1"></p>
                <p id="aboutText2"></p>
                <div class="skills-list" id="skillsList"></div>

                    <button class="btn" onclick="editAbout()">Редактировать</button>
                </div>
            </div>
        </section>

        <section id="portfolio" class="section">
            <div id="portfolioCategories"></div>
            <div id="portfolioWorks" style="display:none;"></div>

        <section id="reviews" class="section">
            <div id="reviewsContainer"></div>
            <div style="margin-top:10px">
                <button class="btn" onclick="openReviewModal()">Добавить отзыв</button>
            </div>
        </section>

        <section id="orders" class="section">
            <div id="ordersContent"></div>
        </section>

        <div class="footer">
            <div>© Mark1z Design · Дмитрий Маркизов</div>
            <a href="#" onclick="openPrivacyPolicy()">Политика конфиденциальности</a>
            <span class="version">V.1.0.1</span>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent"></div>
    </div>

    <!-- ===== ПРОСМОТР ИЗОБРАЖЕНИЙ ===== -->

        <img id="imageViewerImg" src="" alt="Просмотр">
        <button class="btn save-btn" id="imageViewerSaveBtn">Сохранить</button>

            var tg = window.Telegram?.WebApp;
            if (tg) {
                window.telegramAvailable = true;
                window.tg = tg;
                tg.ready();
                tg.expand();

        function dataURLToBlob(dataUrl) {
            var parts = dataUrl.split(',');
            var mime = parts[0].match(/:(.*?);/)[1];
            var bstr = atob(parts[1]);
            var n = bstr.length;
            var u8arr = new Uint8Array(n);
            while (n--) { u8arr[n] = bstr.charCodeAt(n); }
            return new Blob([u8arr], { type: mime });
        }

        function compressImage(file, maxSize, quality) {
            maxSize = maxSize || 800;
            quality = quality || 0.7;
            return new Promise(function(resolve) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    var img = new Image();
                    img.onload = function() {
                        var canvas = document.createElement('canvas');
                        var width = img.width;
                        var height = img.height;
                        if (width > height && width > maxSize) {
                            height = height * maxSize / width;
                            width = maxSize;
                        } else if (height > maxSize) {
                            width = width * maxSize / height;
                            height = maxSize;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        var ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = function() { resolve(null); };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function uploadFileToSupabase(file, folder) {
            var cleanName = file.name.replace(/[^\w\d\-_.]/g, '_');
            var timestamp = Date.now();
            var fileName = timestamp + '_' + cleanName;
            var path = folder + '/' + fileName;
            return window._supabaseClient.storage.from('public').upload(path, file, { cacheControl: '3600', upsert: false })
                .then(function(res) {
                    if (res.error) throw res.error;
                    var publicUrl = window._supabaseClient.storage.from('public').getPublicUrl(path);
                    return publicUrl.data.publicUrl;
                });
        }

        function downloadImage(url, filename) {
            fetch(url)
                .then(function(response) { return response.blob(); })
                .then(function(blob) {
                    var link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = filename || 'image.jpg';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    setTimeout(function() { URL.revokeObjectURL(link.href); }, 1000);
                })
                .catch(function(err) {
                    alert('Не удалось скачать изображение: ' + err.message);
                });
        }

        function spinCase() {
            var spinBtn = document.getElementById('caseSpinBtn');
            if (spinBtn.disabled) return;
            spinBtn.disabled = true;
            var strip = document.getElementById('caseStrip');
            var items = strip.children;
            var itemWidth = items[0].offsetWidth + 10;
            var totalItems = items.length;

            var totalProb = caseProbabilities.reduce(function(a,b){ return a+b; }, 0);
            var r = Math.random() * totalProb;
            var chosenIndex = 0;
            for (var i = 0; i < caseProbabilities.length; i++) {
                r -= caseProbabilities[i];
                if (r <= 0) { chosenIndex = i; break; }
            }

            var repetitions = totalItems / caseItems.length;
            var targetItemIndex = (repetitions - 1) * caseItems.length + chosenIndex;

            var containerWidth = document.getElementById('caseContainer').clientWidth;
            var targetX = -(targetItemIndex * itemWidth) + (containerWidth - itemWidth) / 2;
            var startX = strip.getBoundingClientRect().left - document.getElementById('caseContainer').getBoundingClientRect().left;
            var duration = Math.random() * (5000 - 3000) + 3000;
            var startTime = performance.now();

            function animate(now) {
                var elapsed = now - startTime;
                var progress = Math.min(elapsed / duration, 1);
                var ease = 1 - Math.pow(1 - progress, 3);
                var x = startX + (targetX - startX) * ease;
                strip.style.transform = 'translateX(' + x + 'px)';
                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    var discount = parseInt(caseItems[chosenIndex]);
                    if (!window.isAdmin) {
                        applyDiscount(discount);
                        localStorage.setItem('lastSpinTime', Date.now());
                        localStorage.setItem('lastSpinDiscount', discount);
                        lastSpinTime = Date.now();
                        lastSpinDiscount = discount;
                        alert('Поздравляем! Ваша скидка: ' + discount + '%');
                    } else {
                        alert('Вы админ, скидка не применена (тестовый режим). Выпало: ' + discount + '%');
                    }
                    canSpinNow = false;
                    spinBtn.disabled = false;
                    closeModal();
                    renderOrdersSection();
                }
            }
            requestAnimationFrame(animate);
        }

            var supabase = window._supabaseClient;
            if (tempPostFile) {
                compressImage(tempPostFile, 800, 0.7)
                    .then(function(compressedDataUrl) {
                        var blob = dataURLToBlob(compressedDataUrl);
                        var file = new File([blob], tempPostFile.name, { type: 'image/jpeg' });
                        return uploadFileToSupabase(file, 'posts');
                    })
                    .then(function(url) {
                        postData.image = url;
                        tempPostFile = null;
                        return supabase.from('posts').insert([postData]);
                    })
                    .then(function(res) {
                        if (res.error) { alert('Ошибка сохранения: ' + res.error.message); return; }
                        alert('Пост опубликован!');
                        openPostManager();
                    })
                    .catch(function(err) {
                        alert('Ошибка загрузки изображения: ' + err.message);
                    });
            } else {
                supabase.from('posts').insert([postData])
                    .then(function(res) {
                        if (res.error) { alert('Ошибка сохранения: ' + res.error.message); return; }
                        alert('Пост опубликован!');

                    });

        function loadActivePosts() {
            var supabase = window._supabaseClient;
            supabase.from('posts').select('*').eq('active', true)
                .then(function(res) {
                    if (res.error) throw res.error;
                    activePosts = [];
                    res.data.forEach(function(post) {
                        if (post.active_until && new Date(post.active_until) < new Date()) {
                            supabase.from('posts').update({ active: false }).eq('id', post.id);
                            return;
                        }
                        activePosts.push(post);
                    });
                    if (activePosts.length > 0) {
                        showPost(activePosts[0]);
                    }
                })
                .catch(function(err) {
                    console.error('Ошибка загрузки постов:', err);
                });
        }

        function showPost(post) {
            if (viewedPosts.indexOf(post.id.toString()) !== -1) return;
            currentPostId = post.id;
            var modal = document.getElementById('modalOverlay');
            var content = document.getElementById('modalContent');
            content.innerHTML = `
                <div class="post-modal">
                    <button class="close-btn" onclick="askClosePost()">×</button>
                    <h3>${post.title || 'Объявление'}</h3>
                    ${post.image ? '<img src="' + post.image + '" class="post-image">' : ''}
                    <div class="post-content">${post.content}</div>
                    ${post.conditions ? '<p><strong>Условия:</strong> ' + post.conditions + '</p>' : ''}
                    ${post.link ? '<a class="post-link" href="' + post.link + '" target="_blank">Перейти к боту</a>' : ''}
                </div>
            `;
            modal.style.display = 'flex';
        }

        function askClosePost() {
            var modal = document.getElementById('modalOverlay');
            var content = document.getElementById('modalContent');
            content.innerHTML = `
                <div class="post-modal">
                    <button class="close-btn" onclick="closeModal()">×</button>
                    <h3>Не показывать этот пост?</h3>
                    <label class="post-checkbox">
                        <input type="checkbox" id="dontShowAgain"> Больше не показывать этот пост
                    </label>
                    <button class="btn" onclick="confirmClosePost()">Подтвердить</button>
                    <button class="btn" onclick="closeModal()">Отмена</button>
                </div>
            `;
            modal.style.display = 'flex';
        }

        function confirmClosePost() {
            var dontShow = document.getElementById('dontShowAgain').checked;
            if (dontShow && currentPostId) {
                if (viewedPosts.indexOf(currentPostId.toString()) === -1) {
                    viewedPosts.push(currentPostId.toString());
                    localStorage.setItem('viewedPosts', JSON.stringify(viewedPosts));
                }
            }
            closeModal();
            var nextPost = null;
            for (var i = 0; i < activePosts.length; i++) {
                if (viewedPosts.indexOf(activePosts[i].id.toString()) === -1) {
                    nextPost = activePosts[i];
                    break;
                }
            }
            if (nextPost) {
                showPost(nextPost);
            }
        }

        function renderServicesForUser() {
            if (servicesData.length === 0) return '<p style="color:var(--text-muted)">Услуги пока не добавлены</p>';
            var html = '<div class="order-list" style="display:flex; flex-direction:column; gap:12px;">';
            servicesData.forEach(function(s) {
                var basePrice = s.price || 0;
                var basePriceTo = s.price_to || basePrice;
                var priceText = '';
                var discountApplied = false;
                if (currentDiscount > 0 && !(s.name === 'Telegram Mini Apps' && (currentDiscount === 50 || currentDiscount === 100))) {
                    discountApplied = true;
                    var newFrom = Math.round(basePrice * (1 - currentDiscount / 100));
                    var newTo = Math.round(basePriceTo * (1 - currentDiscount / 100));
                    priceText = `
                        <span class="price-old">${basePrice}${basePriceTo && basePriceTo !== basePrice ? ' - ' + basePriceTo : ''}</span>
                        <span class="price-new">${newFrom}${newTo && newTo !== newFrom ? ' - ' + newTo : ''} ₽</span>
                    `;
                } else {
                    priceText = basePriceTo ? 'от ' + basePrice + ' до ' + basePriceTo + ' ₽' : (basePrice ? basePrice + ' ₽' : 'Цена не указана');
                }
                html += `
                    <div class="order-item" style="cursor:pointer;" onclick="placeOrder('${s.name}', ${discountApplied})">
                        <div class="order-info">
                            <h4>${s.emoji} ${s.name}</h4>
                            <p>${s.description}</p>

        function submitReview() {
            var text = document.getElementById('reviewText').value.trim();
            if (!text) { alert('Введите текст отзыва'); return; }
            if (!selectedRating) { alert('Поставьте оценку'); return; }

                alert('Не удалось определить пользователя');

            var supabase = window._supabaseClient;
            supabase.from('user_last_review').select('timestamp').eq('user_id', user.id.toString()).single()
                .then(function(res) {
                    if (!res.error && res.data) {
                        var lastTimestamp = new Date(res.data.timestamp).getTime();
                        var now = Date.now();
                        if (now - lastTimestamp < 3600000) {
                            alert('Вы сможете оставить новый отзыв через 1 час после предыдущего.');
                            return;
                        }
                    }
                    var imageUrls = [];
                    var uploadPromises = tempReviewFiles.map(function(file) {
                        return compressImage(file, 600, 0.6)
                            .then(function(compressedDataUrl) {
                                var blob = dataURLToBlob(compressedDataUrl);
                                var uploadFile = new File([blob], file.name, { type: 'image/jpeg' });
                                return uploadFileToSupabase(uploadFile, 'reviews/' + user.id);
                            });
                    });
                    return Promise.all(uploadPromises);
                })
                .then(function(urls) {
                    var authorName = user.first_name || user.username || 'Пользователь';
                    var authorUsername = user.username || null;
                    var photoUrl = user.photo_url || null;
                    var authorId = user.id;
                    var reviewData = {
                        author_name: authorName,
                        author_username: authorUsername,
                        author_id: authorId.toString(),
                        photo_url: photoUrl,
                        stars: selectedRating,
                        text: text,
                        images: urls || [],
                        timestamp: new Date().toISOString()
                    };
                    return supabase.from('reviews').insert([reviewData]);
                })
                .then(function() {
                    return supabase.from('user_last_review').upsert({
                        user_id: user.id.toString(),
                        timestamp: new Date().toISOString()
                    });
                })
                .then(function() {
                    closeModal();
                    tempReviewFiles = [];
                    loadReviews(); // сразу обновляем список

                .catch(function(err) {
                    alert('Ошибка: ' + err.message);

                    imagesHtml = '<div class="review-images">';

                                ${authorUsername ? '<div style="font-size:12px; color:var(--text-muted);">@' + authorUsername + '</div>' : ''}

        // Обработчики зума
        document.addEventListener('DOMContentLoaded', function() {
            var imageViewer = document.getElementById('imageViewer');
            var img = document.getElementById('imageViewerImg');
            var panX = 0, panY = 0;
            var startPanX = 0, startPanY = 0;
            var isPanning = false;

            imageViewer.addEventListener('touchstart', function(e) {
                if (e.touches.length === 2) {
                    startDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                    startScale = scale;
                } else if (e.touches.length === 1 && scale > 1) {
                    isPanning = true;
                    startPanX = e.touches[0].clientX - panX;
                    startPanY = e.touches[0].clientY - panY;
                }
            });
            imageViewer.addEventListener('touchmove', function(e) {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    var currentDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                    scale = Math.min(Math.max(startScale * currentDistance / startDistance, 1), 3);
                    img.style.transform = 'scale(' + scale + ')';
                    if (scale === 1) {
                        panX = 0; panY = 0;
                        img.style.left = '0px';
                        img.style.top = '0px';
                    } else {
                        var maxX = (img.offsetWidth * scale - img.offsetWidth) / 2;
                        var maxY = (img.offsetHeight * scale - img.offsetHeight) / 2;
                        panX = Math.max(-maxX, Math.min(maxX, panX));
                        panY = Math.max(-maxY, Math.min(maxY, panY));
                        img.style.left = panX + 'px';
                        img.style.top = panY + 'px';
                    }
                } else if (e.touches.length === 1 && isPanning) {
                    e.preventDefault();
                    panX = e.touches[0].clientX - startPanX;
                    panY = e.touches[0].clientY - startPanY;
                    var maxX = (img.offsetWidth * scale - img.offsetWidth) / 2;
                    var maxY = (img.offsetHeight * scale - img.offsetHeight) / 2;
                    panX = Math.max(-maxX, Math.min(maxX, panX));
                    panY = Math.max(-maxY, Math.min(maxY, panY));
                    img.style.left = panX + 'px';
                    img.style.top = panY + 'px';
                }
            });
            imageViewer.addEventListener('touchend', function() { isPanning = false; });
            imageViewer.addEventListener('dblclick', function() {
                scale = scale === 1 ? 2 : 1;
                img.style.transform = 'scale(' + scale + ')';
                if (scale === 1) {
                    panX = 0; panY = 0;
                    img.style.left = '0px';
                    img.style.top = '0px';
                }
            });
        });

        document.getElementById('imageViewerSaveBtn').addEventListener('click', saveCurrentImage);
        document.getElementById('imageViewerClose').addEventListener('click', closeImageViewer);

        // ================================================================
        // ВКЛАДКИ
        // ================================================================
        function setupTabs() {
            var tabs = document.querySelectorAll('.tab-btn');
            var sections = document.querySelectorAll('.section');
            tabs.forEach(function(tab) {
                tab.addEventListener('click', function() {
                    var target = tab.dataset.tab;
                    tabs.forEach(function(t) { t.classList.remove('active'); });
                    tab.classList.add('active');
                    sections.forEach(function(s) { s.classList.remove('active'); });
                    document.getElementById(target).classList.add('active');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    if (target === 'orders') renderOrdersSection();
                    if (window.telegramAvailable && window.tg) {
                        if (target === 'orders' && !window.isAdmin) window.tg.MainButton.show();
                        else window.tg.MainButton.hide();
                    }
                });
            });
        }

        // ================================================================
        // ЗВЁЗДЫ И АСТЕРОИДЫ
        // ================================================================
        function createStars() {
            var container = document.getElementById('starsContainer');
            for (var i = 0; i < 45; i++) {
                var star = document.createElement('div');
                star.classList.add('star');
                var size = Math.random() * 2 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                var duration = Math.random() * 4 + 3;
                var delay = Math.random() * 6;
                star.style.setProperty('--duration', duration + 's');
                star.style.setProperty('--delay', delay + 's');
                container.appendChild(star);
            }
        }

        function createAsteroids() {
            var container = document.getElementById('asteroidContainer');
            var count = 7;
            for (var i = 0; i < count; i++) {
                var asteroid = document.createElement('div');
                asteroid.classList.add('asteroid');
                var size = Math.random() * 3 + 2;
                asteroid.style.width = size + 'px';
                asteroid.style.height = size + 'px';
                asteroid.style.left = Math.random() * 100 + '%';
                asteroid.style.top = Math.random() * 100 + '%';
                var tx = (Math.random() - 0.5) * 200;
                var ty = (Math.random() - 0.5) * 200;
                asteroid.style.setProperty('--tx', tx + 'px');
                asteroid.style.setProperty('--ty', ty + 'px');
                var duration = Math.random() * 10 + 5;
                asteroid.style.animationDuration = duration + 's';
                var delay = Math.random() * 15;
                asteroid.style.animationDelay = delay + 's';
                container.appendChild(asteroid);
            }
        }

        function createLoadingStars() {
            var container = document.getElementById('loadingStars');
            for (var i = 0; i < 20; i++) {
                var star = document.createElement('div');
                star.classList.add('loading-star');
                var size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDuration = (Math.random() * 2 + 1) + 's';
                star.style.animationDelay = (Math.random() * 3) + 's';
                container.appendChild(star);
            }
        }

        // ================================================================
        // ЗАПУСК
        // ================================================================
        function init() {
            createStars();
            createAsteroids();
            createLoadingStars();
            setupTabs();
            initDefaultServices();
            setupRealTimeListeners();
            initTelegram();
            renderOrdersSection();
            if (lastSpinDiscount > 0) applyDiscount(lastSpinDiscount);
            loadActivePosts();
            setTimeout(function() {
                document.getElementById('loadingScreen').classList.add('hidden');
            }, 800);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
