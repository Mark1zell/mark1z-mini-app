<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mark1z Design</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg-start: #0a050d;
            --bg-mid: #100820;
            --bg-end: #0a0012;
            --primary: #7c3aed;
            --secondary: #be185d;
            --accent: #9d174d;
            --text: #f5f3ff;
            --text-muted: rgba(245,243,255,0.5);
            --card-bg: rgba(18,8,30,0.8);
            --card-border: rgba(124,58,237,0.3);
            --shadow: 0 6px 20px rgba(0,0,0,0.5);
            --radius: 20px;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, var(--bg-start), var(--bg-mid), var(--bg-end));
            color: var(--text);
            min-height: 100vh;
            padding: 16px 16px 80px;
            overflow-x: hidden;
            letter-spacing: 0.02em;
            -webkit-user-select: none;
            user-select: none;
        }
        input, textarea, select {
            -webkit-user-select: text !important;
            user-select: text !important;
            -webkit-touch-callout: default !important;
        }
        img { -webkit-touch-callout:none!important; -webkit-user-drag:none!important; user-drag:none!important; pointer-events:auto; }
        .stars-container { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
        .star { position:absolute; background:rgba(255,255,255,0.7); border-radius:50%; opacity:0; animation:twinkle var(--duration) ease-in-out infinite; animation-delay:var(--delay); }
        @keyframes twinkle { 0%,100%{opacity:0; transform:scale(0.3)} 50%{opacity:0.3; transform:scale(1)} }
        .asteroid-container { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:hidden; }
        .asteroid { position:absolute; background:radial-gradient(circle, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 70%); border-radius:50%; width:4px; height:4px; opacity:0; animation:flyAsteroid linear infinite; }
        @keyframes flyAsteroid { 0%{transform:translate(0,0) scale(0.5); opacity:0} 10%{opacity:0.6} 90%{opacity:0.6} 100%{transform:translate(var(--tx), var(--ty)) scale(1.5); opacity:0} }
        .app-container { position:relative; z-index:1; max-width:600px; margin:0 auto; }
        .header { text-align:center; padding:30px 0 20px; position:relative; }
        .header .faq-button { position:absolute; top:20px; right:20px; background:rgba(124,58,237,0.3); border:1px solid var(--card-border); color:#fff; width:40px; height:40px; border-radius:50%; font-size:20px; cursor:pointer; transition:all 0.3s; }
        .header .faq-button:hover { background:rgba(124,58,237,0.6); }
        .header .wheel-button { position:absolute; top:20px; left:20px; background:rgba(124,58,237,0.3); border:1px solid var(--card-border); color:#fff; width:40px; height:40px; border-radius:50%; font-size:20px; cursor:pointer; transition:all 0.3s; }
        .header .wheel-button:hover { background:rgba(124,58,237,0.6); }
        .header .promo-button { position:absolute; top:70px; left:20px; background:rgba(124,58,237,0.3); border:1px solid var(--card-border); color:#fff; width:40px; height:40px; border-radius:50%; font-size:20px; cursor:pointer; transition:all 0.3s; }
        .header .promo-button:hover { background:rgba(124,58,237,0.6); }
        .logo { width:100px; height:100px; margin:0 auto 16px; border-radius:28px; overflow:hidden; box-shadow:0 4px 15px rgba(124,58,237,0.3); position:relative; }
        .logo img { width:100%; height:100%; object-fit:cover; }
        .brand-name { font-size:30px; font-weight:800; background:linear-gradient(to right, #a78bfa, #c084fc, #a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation:brandGlow 6s ease-in-out infinite; }
        @keyframes brandGlow { 0%,100%{filter:drop-shadow(0 0 4px rgba(124,58,237,0.3))} 50%{filter:drop-shadow(0 0 8px rgba(124,58,237,0.5))} }
        .tagline { color:var(--text-muted); font-size:13px; letter-spacing:2px; text-transform:uppercase; }
        .tabs { display:flex; background:rgba(10,5,18,0.8); backdrop-filter:blur(20px); border:1px solid var(--card-border); border-radius:40px; padding:6px; margin:25px 0; }
        .tab-btn { flex:1; padding:12px 6px; background:transparent; border:none; color:var(--text-muted); font-weight:600; border-radius:32px; cursor:pointer; transition:all 0.3s; font-size:13px; }
        .tab-btn.active { background:linear-gradient(135deg, rgba(124,58,237,0.7), rgba(190,24,93,0.7)); color:#fff; }
        .section { display:none; animation:fadeIn 0.4s; }
        .section.active { display:block; }
        @keyframes fadeIn { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none} }
        .card { background:var(--card-bg); backdrop-filter:blur(10px); border:1px solid var(--card-border); border-radius:var(--radius); padding:24px; margin-bottom:16px; box-shadow:var(--shadow); }
        .card h3 { font-size:21px; font-weight:700; margin-bottom:12px; color:#e9d5ff; }
        .btn { background:linear-gradient(135deg, var(--primary), var(--secondary)); color:#fff; border:none; padding:10px 20px; border-radius:20px; font-weight:600; cursor:pointer; transition:transform 0.2s, box-shadow 0.2s; display:inline-block; margin:5px; text-decoration:none; font-size:14px; }
        .btn:hover { transform:translateY(-2px); box-shadow:0 4px 12px rgba(124,58,237,0.5); }
        .btn:active { transform:scale(0.96); }
        .btn:disabled { opacity:0.5; pointer-events:none; }
        .btn-sm { padding:6px 12px; font-size:12px; }
        .categories-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
        .category-card { background:rgba(15,7,25,0.8); border:1px solid var(--card-border); border-radius:var(--radius); padding:20px; text-align:center; cursor:pointer; transition:transform 0.3s, border-color 0.3s; position:relative; overflow:hidden; }
        .category-card:hover { transform:scale(1.02); border-color:var(--primary); }
        .category-card .folder-icon { font-size:48px; margin-bottom:10px; position:relative; z-index:1; }
        .category-card .category-name { font-weight:600; margin-bottom:8px; position:relative; z-index:1; }
        .category-card .work-count { color:var(--text-muted); font-size:12px; position:relative; z-index:1; }
        .category-card .cover-bg { position:absolute; top:0; left:0; width:100%; height:100%; background-size:cover; background-position:center; opacity:0.15; pointer-events:none; z-index:0; }
        .category-card .admin-actions { position:absolute; top:5px; right:5px; display:none; gap:3px; z-index:2; }
        .admin-mode .category-card .admin-actions { display:flex; }
        .works-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:15px; }
        .work-item { background:rgba(15,7,25,0.9); border:1px solid var(--card-border); border-radius:var(--radius); overflow:hidden; position:relative; display:flex; flex-direction:column; }
        .work-image-wrapper { position:relative; width:100%; padding-bottom:100%; height:0; overflow:hidden; background:#0a050d; }
        .work-image-wrapper img { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; display:block; cursor:pointer; }
        .work-item .work-info { padding:8px; font-size:12px; color:var(--text-muted); text-align:center; flex-shrink:0; }
        .work-item .work-actions { position:absolute; top:8px; right:8px; display:flex; gap:5px; z-index:2; }
        .work-actions button { background:rgba(0,0,0,0.6); border:none; color:#fff; border-radius:50%; width:30px; height:30px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; }
        .add-work-btn { display:flex; align-items:center; justify-content:center; aspect-ratio:1/1; background:rgba(124,58,237,0.2); border:2px dashed var(--primary); border-radius:var(--radius); cursor:pointer; font-size:32px; color:var(--primary); }
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); display:none; align-items:center; justify-content:center; z-index:1000; padding:16px; }
        .modal { background:#1a0b2e; border:1px solid var(--card-border); border-radius:var(--radius); padding:24px; width:100%; max-width:500px; max-height:90vh; overflow-y:auto; position:relative; -webkit-user-select:text; user-select:text; pointer-events:auto; }
        .modal input, .modal textarea, .modal select { width:100%; padding:12px; margin-bottom:10px; background:rgba(255,255,255,0.08); border:1px solid var(--card-border); border-radius:10px; color:#fff; font-size:14px; -webkit-user-select:text!important; user-select:text!important; pointer-events:auto!important; cursor:text!important; }
        .modal input:focus, .modal textarea:focus, .modal select:focus { outline:none; border-color:var(--primary); background:rgba(255,255,255,0.12); box-shadow:0 0 10px rgba(124,58,237,0.3); }
        .modal textarea { min-height:80px; resize:vertical; }
        .modal button { margin-right:10px; }
        .modal img.preview { max-width:100%; max-height:200px; object-fit:contain; margin-bottom:10px; border-radius:10px; display:none; }
        .admin-only { display:none; }
        .admin-mode .admin-only { display:inline-block; }
        .resume-highlight { font-size:16px; font-weight:600; font-style:italic; color:#e9d5ff; margin:12px 0; padding:14px 16px; background:rgba(124,58,237,0.15); border-left:3px solid var(--primary); border-radius:12px; }
        .skills-list { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
        .skill-badge { background:rgba(124,58,237,0.2); border:1px solid rgba(124,58,237,0.3); padding:8px 14px; border-radius:20px; font-size:13px; font-weight:500; color:#ddd6fe; }
        .experience-badge { display:inline-block; background:linear-gradient(135deg, var(--primary), var(--secondary)); padding:6px 14px; border-radius:20px; font-weight:700; color:#fff; font-size:14px; margin-left:8px; }
        
        /* ===== ОТЗЫВЫ ===== */
        .review-card { padding:20px; position:relative; }
        .review-author { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
        .review-avatar { width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg, #7c3aed, #be185d); display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; overflow:hidden; flex-shrink:0; }
        .review-avatar img { width:100%; height:100%; object-fit:cover; }
        .review-text { color:var(--text-muted); font-size:14px; line-height:1.6; }
        .review-images { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
        .review-images img { width:60px; height:60px; object-fit:cover; border-radius:8px; cursor:pointer; border:1px solid var(--card-border); }
        .review-images img.single { width:100%; height:auto; max-height:300px; object-fit:contain; }
        .stars { color:#fbbf24; letter-spacing:2px; }
        .review-footer { display:flex; align-items:center; gap:8px; margin-top:12px; flex-wrap:wrap; }
        
        /* ===== КНОПКИ РЕАКЦИЙ ===== */
        .like-btn { 
            background:rgba(255,255,255,0.06); 
            border:1px solid rgba(255,255,255,0.08); 
            border-radius:30px; 
            padding:8px 16px; 
            font-size:14px; 
            color:var(--text-muted); 
            cursor:pointer; 
            display:inline-flex; 
            align-items:center; 
            gap:6px; 
            transition:all 0.3s ease; 
        }
        .like-btn:hover {
            background:rgba(124,58,237,0.15);
            border-color:rgba(124,58,237,0.3);
        }
        .like-btn:active { transform:scale(0.95); }
        .like-btn .emoji { font-size:16px; transition:transform 0.3s ease; }
        .like-btn .count { font-size:13px; font-weight:600; min-width:12px; }
        
        /* АКТИВНАЯ КНОПКА ЛАЙКА - ПЛАВНАЯ */
        .like-btn.active {
            background: linear-gradient(135deg, #7c3aed, #be185d) !important;
            border-color: #7c3aed !important;
            color: #fff !important;
            box-shadow: 0 0 15px rgba(124,58,237,0.4);
        }
        .like-btn.active .emoji {
            transform: scale(1.2);
        }
        .like-btn.active .count {
            color: #fff;
        }
        
        .review-actions { display:flex; gap:5px; margin-left:auto; }
        .review-actions button { background:rgba(255,255,255,0.05); border:none; color:var(--text-muted); padding:6px 10px; border-radius:12px; font-size:12px; cursor:pointer; transition:background 0.2s; }
        .review-actions button:hover { background:rgba(255,255,255,0.1); }
        
        /* Кнопка деталей заказа в отзыве */
        .order-details-toggle {
            background:rgba(124,58,237,0.15);
            border:1px solid rgba(124,58,237,0.25);
            color:#c084fc;
            padding:6px 12px;
            border-radius:20px;
            font-size:11px;
            cursor:pointer;
            transition:all 0.3s;
        }
        .order-details-toggle:hover {
            background:rgba(124,58,237,0.25);
        }
        .order-details-content {
            margin-top:8px;
            padding:10px 12px;
            background:rgba(124,58,237,0.05);
            border:1px solid rgba(124,58,237,0.15);
            border-radius:8px;
            font-size:11px;
            color:var(--text-muted);
            line-height:1.5;
        }
        
        .admin-reply { margin-top:10px; padding:10px 14px; background:rgba(124,58,237,0.08); border-left:2px solid var(--primary); border-radius:8px; font-size:13px; color:var(--text-muted); }
        .admin-reply strong { color:#a78bfa; font-weight:600; }
        .admin-reply-input { margin-top:10px; display:flex; gap:8px; }
        .admin-reply-input textarea { flex:1; padding:8px; border:1px solid var(--card-border); border-radius:8px; background:rgba(0,0,0,0.3); color:var(--text); font-size:13px; resize:vertical; min-height:40px; }
        
        .order-list { display:flex; flex-direction:column; gap:12px; }
        .order-item { display:flex; align-items:center; justify-content:space-between; padding:16px 18px; background:rgba(15,7,25,0.8); border:1px solid var(--card-border); border-radius:16px; cursor:pointer; transition:border-color 0.2s; }
        .order-item:hover { border-color:var(--primary); }
        .order-info h4 { font-size:16px; font-weight:600; }
        .order-info p { font-size:12px; color:var(--text-muted); margin-top:4px; }
        .order-info a { color:var(--accent); text-decoration:none; }
        .order-item.admin-grab { cursor:grab; }
        .order-item.admin-grab:active { cursor:grabbing; }
        .required-badge { background:rgba(255,0,0,0.3); color:#ff6b6b; padding:2px 8px; border-radius:8px; font-size:10px; margin-left:5px; }
        
        .option-group { margin-bottom:12px; padding:14px; background:rgba(255,255,255,0.03); border-radius:12px; border:1px solid rgba(255,255,255,0.06); transition:border-color 0.2s; }
        .option-group:hover { border-color:rgba(124,58,237,0.3); }
        .option-group .option-header { display:flex; align-items:center; gap:12px; cursor:pointer; }
        .option-checkbox { width:26px; height:26px; border-radius:8px; border:2px solid rgba(255,255,255,0.2); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.25s ease; flex-shrink:0; }
        .option-checkbox.active { background:linear-gradient(135deg, #7c3aed, #be185d); border-color:#7c3aed; box-shadow:0 0 20px rgba(124,58,237,0.3); }
        .option-checkbox .checkmark { font-size:16px; color:#fff; opacity:0; transition:opacity 0.2s ease; font-weight:700; }
        .option-checkbox.active .checkmark { opacity:1; }
        .option-info { flex:1; }
        .option-name { font-size:15px; font-weight:500; }
        .option-price { font-size:13px; color:var(--text-muted); }
        .option-quantity { display:flex; align-items:center; gap:12px; margin-top:10px; margin-left:38px; flex-wrap:wrap; }
        .option-quantity .qty-btn { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); border-radius:8px; color:#fff; width:32px; height:32px; cursor:pointer; font-size:18px; transition:background 0.2s; display:flex; align-items:center; justify-content:center; }
        .option-quantity .qty-btn:hover { background:rgba(255,255,255,0.12); }
        .option-quantity .qty-display { min-width:30px; text-align:center; font-weight:500; font-size:16px; }
        .option-quantity .price-detail { font-size:14px; color:var(--text-muted); }
        .option-quantity .discount-badge { font-size:12px; color:#fbbf24; background:rgba(251,191,36,0.1); padding:2px 10px; border-radius:12px; }
        .order-total { margin-top:20px; padding-top:16px; border-top:1px solid var(--card-border); text-align:right; font-size:20px; font-weight:700; color:#e9d5ff; }
        .order-total span { color:#c084fc; }
        .reference-upload { margin-top:12px; }
        .reference-upload .preview-thumb { position:relative; display:inline-block; margin:4px; }
        .reference-upload .preview-thumb img { width:60px; height:60px; object-fit:cover; border-radius:8px; border:1px solid var(--card-border); }
        .reference-upload .preview-thumb .remove-btn { position:absolute; top:-6px; right:-6px; background:rgba(255,0,0,0.8); color:#fff; border:none; border-radius:50%; width:18px; height:18px; cursor:pointer; font-size:10px; display:flex; align-items:center; justify-content:center; }
        
        .footer { text-align:center; margin-top:30px; padding:10px; color:var(--text-muted); font-size:12px; opacity:0.7; position:relative; }
        .footer a { color:var(--accent); text-decoration:none; }
        .footer .designer-link { color:#ec4899; text-decoration:none; font-weight:600; }
        .footer .version { position:absolute; bottom:5px; right:10px; font-size:10px; opacity:0.5; color:var(--text-muted); pointer-events:none; }
        
        #imageViewer { position:fixed; inset:0; background:rgba(0,0,0,0.9); display:none; align-items:center; justify-content:center; z-index:2000; flex-direction:column; overflow:hidden; touch-action:none; }
        #imageViewer img { max-width:95%; max-height:85%; object-fit:contain; transition:transform 0.2s; transform-origin:center; position:relative; }
        #imageViewer .save-btn { margin-top:15px; }
        #imageViewerClose { position:absolute; top:20px; right:20px; background:rgba(0,0,0,0.6); border:none; color:#fff; font-size:28px; width:40px; height:40px; border-radius:50%; cursor:pointer; z-index:2001; }
        
        #loadingScreen { position:fixed; top:0; left:0; width:100%; height:100%; background:radial-gradient(ellipse at center, #1a0b2e 0%, #0a0012 100%); display:flex; align-items:center; justify-content:center; z-index:9999; transition:opacity 0.5s ease, visibility 0.5s ease; overflow:hidden; }
        #loadingScreen.hidden { opacity:0; visibility:hidden; pointer-events:none; }
        .loader { width:80px; height:80px; border-radius:50%; border:4px solid rgba(124,58,237,0.2); border-top-color:var(--primary); animation:spin 1s linear infinite; }
        @keyframes spin { to{transform:rotate(360deg)} }
        .loading-logo { font-size:48px; margin-bottom:20px; animation:pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }
        .loading-stars { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
        .loading-star { position:absolute; background:#fff; border-radius:50%; opacity:0; animation:loadingTwinkle 2s ease-in-out infinite; }
        @keyframes loadingTwinkle { 0%,100%{opacity:0; transform:scale(0.3)} 50%{opacity:0.8; transform:scale(1)} }
        
        @media (max-width:400px){ 
            .categories-grid{grid-template-columns:repeat(2,1fr)} 
            .brand-name{font-size:24px} 
            .tab-btn{font-size:11px; padding:10px 4px} 
            .card{padding:18px} 
        }
        
        .preview-thumb { position:relative; display:inline-block; margin:5px; }
        .preview-thumb img { width:60px; height:60px; object-fit:cover; border-radius:8px; border:1px solid var(--card-border); }
        .preview-thumb .remove-btn { position:absolute; top:-8px; left:-8px; background:rgba(255,0,0,0.8); color:#fff; border:none; width:20px; height:20px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:12px; padding:0; }
        
        .case-container { position:relative; width:100%; max-width:400px; margin:20px auto; overflow:hidden; }
        .case-strip { display:flex; transition:transform 0.1s linear; }
        .case-item { min-width:120px; height:100px; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:800; color:#fff; background:linear-gradient(145deg, #2a1a3e, #1a0b2e); border:2px solid var(--card-border); border-radius:16px; margin:0 5px; }
        .case-arrow { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:40px; color:#fff; pointer-events:none; z-index:2; }
        .case-modal { text-align:center; }
        .case-modal .close-btn { position:absolute; top:10px; right:10px; background:none; border:none; color:#fff; font-size:24px; cursor:pointer; }
        .case-timer { margin:10px 0; font-size:14px; color:#fbbf24; }
        
        .post-modal { text-align:center; }
        .post-modal .close-btn { position:absolute; top:10px; right:10px; background:none; border:none; color:#fff; font-size:24px; cursor:pointer; }
        .post-content { margin:15px 0; line-height:1.5; }
        .post-link { color:#a855f7; text-decoration:underline; }
        .post-image { max-width:100%; border-radius:10px; margin:10px 0; }
        .post-checkbox { display:flex; align-items:center; gap:5px; margin:10px 0; }
        .post-checkbox input { width:auto; }
        .admin-post-item { display:flex; align-items:center; justify-content:space-between; padding:10px; border:1px solid var(--card-border); border-radius:10px; margin-bottom:10px; }

        function dataURLToBlob(dataUrl) {
            var parts = dataUrl.split(',');
            var mime = parts[0].match(/:(.*?);/)[1];
            var bstr = atob(parts[1]);
            var n = bstr.length;
            var u8arr = new Uint8Array(n);
            while (n--) { u8arr[n] = bstr.charCodeAt(n); }
            return new Blob([u8arr], { type: mime });
        }

function compressImage(file, maxSize, quality) {
    maxSize = maxSize || 800;
    quality = quality || 0.85;
    return new Promise(function(resolve) {
        var reader = new FileReader();
        reader.onload = function(e) {
            var img = new Image();
            img.onload = function() {
                var canvas = document.createElement('canvas');
                var ctx = canvas.getContext('2d');
                var width = img.width;
                var height = img.height;
                
                if (width > height && width > maxSize) {
                    height = height * maxSize / width;
                    width = maxSize;
                } else if (height > maxSize) {
                    width = width * maxSize / height;
                    height = maxSize;
                }
                canvas.width = width;
                canvas.height = height;
                
                // Заливаем белым фоном вместо черного
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.drawImage(img, 0, 0, width, height);
                
                var mimeType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
                resolve(canvas.toDataURL(mimeType, quality));
            };
            img.onerror = function() { resolve(null); };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    });
}

        function uploadFileToSupabase(file, folder) {
            var cleanName = file.name.replace(/[^\w\d\-_.]/g, '_');
            var timestamp = Date.now();
            var fileName = timestamp + '_' + cleanName;
            var path = folder + '/' + fileName;
            return supabase.storage.from('public').upload(path, file, { cacheControl: '3600', upsert: false })
                .then(function(res) {
                    if (res.error) throw res.error;
                    var publicUrl = supabase.storage.from('public').getPublicUrl(path);
                    if (!publicUrl.data || !publicUrl.data.publicUrl) {
                        throw new Error('Не удалось получить URL загруженного файла');
                    }
                    return publicUrl.data.publicUrl;
                });
        }

        function downloadImage(url, filename) {
            if (!url) {
                alert('Ошибка: URL изображения не указан');
                return;
            }
            fetch(url)
                .then(function(response) { return response.blob(); })
                .then(function(blob) {
                    var link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = filename || 'image.jpg';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    setTimeout(function() { URL.revokeObjectURL(link.href); }, 1000);
                })
                .catch(function(err) {
                    alert('Не удалось скачать изображение: ' + err.message);
                });
        }

        function updateOrder(tableName, items) {
            var promises = [];
            items.forEach(function(item, index) {
                var id = item.dataset.id;
                promises.push(supabase.from(tableName).update({ order: index }).eq('id', id));
            });
            return Promise.all(promises);
        }

        function updateCaseTimer() {
            var timerEl = document.getElementById('caseTimer');
            if (!timerEl) return;
            if (window.isAdmin) {
                timerEl.textContent = 'Вы админ, можете крутить без ограничений';
                return;
            }
            if (canSpinNow) {
                timerEl.textContent = 'Промокод активирован! Крутите сейчас';
                var btn = document.getElementById('caseSpinBtn');
                if (btn) btn.disabled = false;
                return;
            }
            var oneWeek = 7 * 24 * 60 * 60 * 1000;
            var remaining = lastSpinTime ? oneWeek - (Date.now() - lastSpinTime) : 0;
            if (remaining <= 0) {
                timerEl.textContent = 'Доступно для прокрута!';
                var btn = document.getElementById('caseSpinBtn');
                if (btn) btn.disabled = false;
                return;
            }
            var days = Math.floor(remaining / (24*60*60*1000));
            var hours = Math.floor((remaining % (24*60*60*1000)) / (60*60*1000));
            var minutes = Math.floor((remaining % (60*60*1000)) / (60*1000));
            var seconds = Math.floor((remaining % (60*1000)) / 1000);
            timerEl.textContent = 'До следующего прокрута: ' + days + 'д ' + hours + 'ч ' + minutes + 'м ' + seconds + 'с';
            setTimeout(updateCaseTimer, 1000);
        }

        function initCaseStrip() {
            var strip = document.getElementById('caseStrip');
            strip.innerHTML = '';
            for (var i = 0; i < 20; i++) {
                var item = document.createElement('div');
                item.className = 'case-item';
                item.textContent = caseItems[i % caseItems.length];
                strip.appendChild(item);
            }

function spinCase() {
    var spinBtn = document.getElementById('caseSpinBtn');
    if (spinBtn.disabled) return;
    spinBtn.disabled = true;
    var strip = document.getElementById('caseStrip');
    var items = strip.children;
    var itemWidth = items[0].offsetWidth + 10;
    var totalItems = items.length;

    var totalProb = caseProbabilities.reduce(function(a,b){ return a+b; }, 0);
    var r = Math.random() * totalProb;
    var chosenIndex = 0;
    for (var i = 0; i < caseProbabilities.length; i++) {
        r -= caseProbabilities[i];
        if (r <= 0) { chosenIndex = i; break; }
    }

    var repetitions = totalItems / caseItems.length;
    var targetItemIndex = (repetitions - 1) * caseItems.length + chosenIndex;

    var containerWidth = document.getElementById('caseContainer').clientWidth;
    var targetX = -(targetItemIndex * itemWidth) + (containerWidth - itemWidth) / 2;
    var startX = strip.getBoundingClientRect().left - document.getElementById('caseContainer').getBoundingClientRect().left;
    var duration = Math.random() * (5000 - 3000) + 3000;
    var startTime = performance.now();

    function animate(now) {
        var elapsed = now - startTime;
        var progress = Math.min(elapsed / duration, 1);
        var ease = 1 - Math.pow(1 - progress, 3);
        var x = startX + (targetX - startX) * ease;
        strip.style.transform = 'translateX(' + x + 'px)';
        
        if (progress < 1) {
            requestAnimationFrame(animate);
        } else {
            var discount = parseInt(caseItems[chosenIndex]);
            if (!window.isAdmin) {
                applyDiscount(discount);
                localStorage.setItem('lastSpinTime', Date.now());
                localStorage.setItem('lastSpinDiscount', discount);
                localStorage.removeItem('discountUsed');
                lastSpinTime = Date.now();
                lastSpinDiscount = discount;
                alert('🎉 Поздравляем! Ваша скидка: ' + discount + '%');
            } else {
                alert('👑 Вы админ, скидка не применена. Выпало: ' + discount + '%');
            }
            
            canSpinNow = false;
            spinBtn.disabled = false;
            closeModal();
            renderOrdersSection();
        }
    }
    requestAnimationFrame(animate);
}

function canSpin() {
    var oneWeek = 7 * 24 * 60 * 60 * 1000;
    if (!lastSpinTime) return true; // Если никогда не крутил — можно
    return (Date.now() - lastSpinTime) >= oneWeek; // Можно только через неделю
}

function applyDiscount(percent) {
    currentDiscount = percent;
    localStorage.setItem('lastSpinDiscount', percent);
    localStorage.removeItem('discountUsed');
    lastSpinDiscount = percent;
}

function calcPromoDiscount(cartItems, baseTotal) {
    if (!currentPromo) return 0;
    var appliesTo = currentPromo.applies_to || [];

    if (appliesTo.length === 0) {
        return currentPromo.free ? baseTotal
            : Math.round(baseTotal * currentPromo.discount_percent / 100);
    }

    var eligibleSum = 0;
    cartItems.forEach(function(item) {
        var match = appliesTo.some(function(t) {
            return t.type === item.type && t.id === item.id;
        });
        if (match) eligibleSum += item.price * item.qty;
    });

    return currentPromo.free ? eligibleSum
        : Math.round(eligibleSum * currentPromo.discount_percent / 100);
}

        function saveOptionImproved(serviceId) {
            var name = document.getElementById('optName').value.trim();

            var minQty = document.getElementById('optMinQty')?.value.trim() || '1';

            var discountMin = document.getElementById('optDiscountMin')?.value.trim() || null;
            var discountPrice = document.getElementById('optDiscountPrice')?.value.trim() || null;
            var isRequired = document.getElementById('optRequired')?.checked || false;
            
            if (!name) { alert('Введите название опции'); return; }
            if (!price) { alert('Введите цену'); return; }
            
            var finalMaxQty = parseInt(maxQty) || 1;
            if (finalMaxQty < 1) finalMaxQty = 1;
            
            var finalMinQty = parseInt(minQty) || 1;
            if (finalMinQty < 1) finalMinQty = 1;
            if (finalMinQty > finalMaxQty) finalMinQty = finalMaxQty;
            
            supabase.from('service_options')
                .select('order')
                .eq('service_id', serviceId)
                .order('order', { ascending: false })
                .limit(1)
                .then(function(res) {
                    var nextOrder = 0;
                    if (res.data && res.data.length > 0 && res.data[0].order !== null && res.data[0].order !== undefined) {
                        nextOrder = res.data[0].order + 1;
                    }
                    
                    return supabase.from('service_options').insert([{
                        service_id: serviceId,
                        name: name,
                        price: parseInt(price),
                        description: description || '',
                        option_type: 'checkbox',
                        min_quantity: finalMinQty,
                        max_quantity: finalMaxQty,
                        discount_min_quantity: discountMin ? parseInt(discountMin) : null,
                        discount_price: discountPrice ? parseInt(discountPrice) : null,
                        is_required: isRequired,
                        order: nextOrder
                    }]);
                })
                .then(function(res) {
                    if (res.error) {
                        alert('Ошибка при сохранении: ' + res.error.message);
                        return;
                    }
                    
                    alert('✅ Опция успешно добавлена!');
                    loadServiceOptionsForManager(serviceId);
                    loadServiceOptions();
                })
                .catch(function(err) {
                    alert('Ошибка: ' + err.message);
                });
        }

            content.innerHTML = `

        function previewPostImage(event) {
            var file = event.target.files[0];
            if (!file) return;
            tempPostFile = file;
            var reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('postImagePreview').src = e.target.result;
                document.getElementById('postImagePreview').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        function savePost() {
            var title = document.getElementById('postTitle').value.trim();
            var content = document.getElementById('postContent').value.trim();
            var conditions = document.getElementById('postConditions').value.trim();
            var link = document.getElementById('postLink').value.trim();
            var activeUntil = document.getElementById('postActiveUntil').value.trim();
            if (!title || !content) { alert('Заполните заголовок и текст'); return; }
            var activeUntilDate = null;
            if (activeUntil !== '0' && activeUntil) {
                activeUntilDate = new Date(activeUntil);
                if (isNaN(activeUntilDate.getTime())) {
                    alert('Неверный формат даты');
                    return;
                }
            }
            var postData = {
                title: title,
                content: content,
                conditions: conditions,
                link: link,
                active: true,
                active_until: activeUntilDate ? activeUntilDate.toISOString() : null
            };
            if (tempPostFile) {
                compressImage(tempPostFile, 800, 0.7)
                    .then(function(compressedDataUrl) {
                        var blob = dataURLToBlob(compressedDataUrl);
                        var file = new File([blob], tempPostFile.name, { type: 'image/jpeg' });
                        return uploadFileToSupabase(file, 'posts');
                    })
                    .then(function(url) {
                        postData.image = url;
                        tempPostFile = null;
                        return supabase.from('posts').insert([postData]);
                    })
                    .then(function(res) {
                        if (res.error) { alert('Ошибка: ' + res.error.message); return; }
                        alert('Пост опубликован!');
                        openPostManager();
                    })
                    .catch(function(err) {
                        alert('Ошибка: ' + err.message);
                    });
            } else {
                supabase.from('posts').insert([postData])
                    .then(function(res) {
                        if (res.error) { alert('Ошибка: ' + res.error.message); return; }
                        alert('Пост опубликован!');
                        openPostManager();
                    });
            }
        }

        function loadActivePosts() {
            supabase.from('posts').select('*').eq('active', true)
                .then(function(res) {
                    if (res.error) throw res.error;
                    activePosts = [];
                    res.data.forEach(function(post) {
                        if (post.active_until && new Date(post.active_until) < new Date()) {
                            supabase.from('posts').update({ active: false }).eq('id', post.id);
                            return;
                        }
                        activePosts.push(post);
                    });
                    if (activePosts.length > 0) {
                        showPost(activePosts[0]);
                    }
                })
                .catch(function(err) {
                    console.error('Ошибка загрузки постов:', err);
                });
        }

        function showPost(post) {
            if (viewedPosts.indexOf(post.id.toString()) !== -1) return;
            currentPostId = post.id;
            var modal = document.getElementById('modalOverlay');
            var content = document.getElementById('modalContent');
            content.innerHTML = `
                <div class="post-modal">
                    <button class="close-btn" onclick="askClosePost()">×</button>
                    <h3>${post.title || 'Объявление'}</h3>
                    ${post.image ? '<img src="' + post.image + '" class="post-image">' : ''}
                    <div class="post-content">${post.content}</div>
                    ${post.conditions ? '<p><strong>Условия:</strong> ' + post.conditions + '</p>' : ''}
                    ${post.link ? '<a class="post-link" href="' + post.link + '" target="_blank">Перейти к боту</a>' : ''}
                </div>
            `;
            modal.style.display = 'flex';
        }

        function askClosePost() {
            var modal = document.getElementById('modalOverlay');
            var content = document.getElementById('modalContent');
            content.innerHTML = `
                <div class="post-modal">
                    <button class="close-btn" onclick="closeModal()">×</button>
                    <h3>Не показывать этот пост?</h3>
                    <label class="post-checkbox">
                        <input type="checkbox" id="dontShowAgain"> Больше не показывать
                    </label>
                    <button class="btn" onclick="confirmClosePost()">Подтвердить</button>
                    <button class="btn" onclick="closeModal()">Отмена</button>
                </div>
            `;
            modal.style.display = 'flex';
        }

        function confirmClosePost() {
            var dontShow = document.getElementById('dontShowAgain').checked;
            if (dontShow && currentPostId) {
                if (viewedPosts.indexOf(currentPostId.toString()) === -1) {
                    viewedPosts.push(currentPostId.toString());
                    localStorage.setItem('viewedPosts', JSON.stringify(viewedPosts));
                }
            }
            closeModal();
            var nextPost = null;
            for (var i = 0; i < activePosts.length; i++) {
                if (viewedPosts.indexOf(activePosts[i].id.toString()) === -1) {
                    nextPost = activePosts[i];
                    break;
                }
            }
            if (nextPost) showPost(nextPost);
        }

function setupRealTimeListeners() {
    console.log('📡 Настройка realtime listeners...');

    try {
        // ================================================================
        // ЗАКАЗЫ — UPDATE
        // ================================================================
        supabase.channel('orders_realtime')
            .on('postgres_changes', {
                event: 'UPDATE',
                schema: 'public',
                table: 'orders'
            }, function(payload) {
                console.log('🔄 Realtime UPDATE заказа:', payload.new);

                // Обновляем интерфейс
                if (window.isAdmin) {
                    if (adminOrdersMode === 'orders') {
                        loadAdminOrders();
                    } else if (adminOrdersMode === 'admin') {
                        loadPendingOrders();
                    }
                } else {
                    if (userOrdersMode === 'orders') {
                        loadUserOrders();
                    }
                }

                // Заказ стал "ready" — уведомление о готовности
                if (payload.new.status === 'ready') {
                    var user = window.currentUser;
                    if (user) {
                        var userIdentifier = user.username || user.first_name || user.id.toString();
                        var orderUserIdentifier = payload.new.user_username || payload.new.user_name;

                        if (orderUserIdentifier === userIdentifier) {
                            console.log('🎉 Показываем уведомление о готовности');
                            showReadyNotification(payload.new);
                        }
                    }
                }

                // Заказ стал "paid_card" — уведомление об оплате
                if (payload.new.status === 'paid_card') {
                    var user2 = window.currentUser;
                    if (user2) {
                        var userIdentifier2 = user2.username || user2.first_name || user2.id.toString();
                        var orderUserIdentifier2 = payload.new.user_username || payload.new.user_name;

                        if (orderUserIdentifier2 === userIdentifier2) {
                            resetDiscountAfterPayment();
                            showPaymentSuccessNotification(payload.new.id);
                        }
                    }
                }
            })
            .subscribe();

        // ================================================================
        // ЗАКАЗЫ — INSERT
        // ================================================================
        supabase.channel('orders_insert')
            .on('postgres_changes', {
                event: 'INSERT',
                schema: 'public',
                table: 'orders'
            }, function(payload) {
                console.log('🔄 Новый заказ:', payload.new);

                if (window.isAdmin) {
                    if (adminOrdersMode === 'orders') {
                        loadAdminOrders();
                    }
                }
            })
            .subscribe();

        // ================================================================
        // ЗАКАЗЫ — DELETE
        // ================================================================
        supabase.channel('orders_delete')
            .on('postgres_changes', {
                event: 'DELETE',
                schema: 'public',
                table: 'orders'
            }, function(payload) {
                console.log('🔄 Заказ удален:', payload.old);

                if (window.isAdmin) {
                    if (adminOrdersMode === 'orders') {
                        loadAdminOrders();
                    }
                } else {
                    if (userOrdersMode === 'orders') {
                        loadUserOrders();
                    }
                }
            })
            .subscribe();

        // ================================================================
        // УВЕДОМЛЕНИЯ
        // ================================================================
        supabase.channel('notifications_realtime')
            .on('postgres_changes', {
                event: 'INSERT',
                schema: 'public',
                table: 'notifications'
            }, function(payload) {
                console.log('🔔 Новое уведомление:', payload.new);

                var user = window.currentUser;
                if (user) {
                    var userIdentifier = user.username || user.first_name || user.id.toString();

                    if (payload.new.user_username === userIdentifier || payload.new.user_name === userIdentifier) {
                        if (payload.new.type === 'order_ready') {
                            supabase.from('orders')
                                .select('*')
                                .eq('id', payload.new.order_id)
                                .single()
                                .then(function(res) {
                                    if (res.data) {
                                        showReadyNotification(res.data);
                                    }
                                });
                        }
                    }
                }
            })
            .subscribe();

        // ================================================================
        // ТОВАРЫ (вынесено наружу — было багом)
        // ================================================================
        supabase.channel('products_changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, function() {
                loadProducts();
            })
            .subscribe();

        // ================================================================
        // ОСТАЛЬНЫЕ СЛУШАТЕЛИ
        // ================================================================
        supabase.channel('portfolio_categories_changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'portfolio_categories' }, function() {
                loadPortfolioCategories();
            })
            .subscribe();

        supabase.channel('services_changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'services' }, function() {
                loadServices();
            })
            .subscribe();

        supabase.channel('service_options_changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'service_options' }, function() {
                loadServiceOptions();
            })
            .subscribe();

        supabase.channel('reviews_changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'reviews' }, function() {
                loadReviews();
            })
            .subscribe();

        supabase.channel('posts_changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, function() {
                loadActivePosts();
            })
            .subscribe();

        // ================================================================
        // НАЧАЛЬНАЯ ЗАГРУЗКА ДАННЫХ
        // ================================================================
        loadAbout();
        loadPortfolioCategories();
        loadServices();
        loadServiceOptions();
        loadReviews();
        loadLogo();

        console.log('✅ Realtime listeners настроены');
    } catch (err) {
        console.error('❌ Ошибка настройки realtime:', err);
    }
}

        function renderPortfolioCategories(cats) {
            var container = document.getElementById('portfolioCategories');
            if (!container) return;
            container.style.display = 'block';
            var html = '<div class="card"><h3>Портфолио</h3><div class="categories-grid" id="categoriesGrid">';
            cats.forEach(function(cat, idx) {
                var coverStyle = cat.cover_image ? 'style="background-image:url(\'' + cat.cover_image + '\');"' : '';
                var items = cat.items || [];
                html += `
                    <div class="category-card" data-id="${cat.id}" data-index="${idx}" onclick="openCategory(${cat.id})">
                        <div class="cover-bg" ${coverStyle}></div>
                        <div class="folder-icon">${cat.icon || '📁'}</div>
                        <div class="category-name">${cat.name}</div>
                        <div class="work-count">${items.length} работ(ы)</div>
                        <div class="admin-actions">
                            <button class="btn btn-sm" onclick="event.stopPropagation(); changeCover(${cat.id})">🖼️</button>
                            <button class="btn btn-sm" onclick="event.stopPropagation(); deleteCategory(${cat.id})">🗑️</button>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            if (window.isAdmin) {
                html += '<div style="margin-top:15px;"><button class="btn" onclick="addCategory()">➕ Добавить категорию</button></div>';
            }
            html += '</div>';
            container.innerHTML = html;
            if (window.isAdmin) {
                setupSortableForCategories();
            }
        }

        function setupSortableForCategories() {
            var grid = document.getElementById('categoriesGrid');
            if (!grid || !window.isAdmin) return;
            if (sortableInstances.categories) sortableInstances.categories.destroy();
            sortableInstances.categories = new Sortable(grid, {
                animation: 150,
                delay: 200,
                delayOnTouchOnly: true,
                onEnd: function(evt) {
                    var items = [].slice.call(grid.children);
                    updateOrder('portfolio_categories', items);
                }
            });
        }

        function setupSortableForWorks() {
            var grid = document.getElementById('worksGrid');
            if (!grid || !window.isAdmin) return;
            if (sortableInstances.works) sortableInstances.works.destroy();
            sortableInstances.works = new Sortable(grid, {
                animation: 150,
                delay: 200,
                delayOnTouchOnly: true,
                onEnd: function(evt) {
                    var fromIndex = evt.oldIndex;
                    var toIndex = evt.newIndex;
                    updateWorksOrder(fromIndex, toIndex);
                }
            });
        }

        function updateWorksOrder(fromIndex, toIndex) {
            supabase.from('portfolio_categories').select('items').eq('id', currentCategoryId).single()
                .then(function(res) {
                    if (res.error) return;
                    var items = res.data.items || [];
                    var moved = items.splice(fromIndex, 1)[0];
                    items.splice(toIndex, 0, moved);
                    supabase.from('portfolio_categories').update({ items: items }).eq('id', currentCategoryId);
                });
        }

        function changeCover(categoryId) {
            var modal = document.getElementById('modalOverlay');
            var content = document.getElementById('modalContent');
            content.innerHTML = `
                <h3>Изменить обложку</h3>
                <input type="file" id="coverImageInput" accept="image/*" onchange="previewCoverImage(event)">
                <img id="coverPreview" class="preview" src="" alt="Предпросмотр">
                <button class="btn" onclick="saveCover(${categoryId})">Сохранить</button>
                <button class="btn" onclick="closeModal()">Отмена</button>
            `;
            modal.style.display = 'flex';
            window.tempCoverFile = null;
        }

        function previewCoverImage(event) {
            var file = event.target.files[0];
            if (!file) return;
            window.tempCoverFile = file;
            var reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('coverPreview').src = e.target.result;
                document.getElementById('coverPreview').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        function saveCover(categoryId) {
            if (!window.tempCoverFile) { alert('Загрузите изображение'); return; }
            compressImage(window.tempCoverFile, 600, 0.6)
                .then(function(compressedDataUrl) {
                    var blob = dataURLToBlob(compressedDataUrl);
                    var file = new File([blob], window.tempCoverFile.name, { type: 'image/jpeg' });
                    return uploadFileToSupabase(file, 'covers');
                })
                .then(function(url) {
                    return supabase.from('portfolio_categories').update({ cover_image: url }).eq('id', categoryId);
                })
                .then(function() {
                    window.tempCoverFile = null;
                    closeModal();
                })
                .catch(function(err) {
                    alert('Ошибка загрузки: ' + err.message);
                });
        }

                supabase.from('portfolio_categories').delete().eq('id', categoryId);

        function openCategory(categoryId) {
            currentCategoryId = categoryId;
            supabase.from('portfolio_categories').select('*').eq('id', categoryId).single()
                .then(function(res) {
                    if (res.error || !res.data) return;
                    var cat = res.data;
                    document.getElementById('portfolioCategories').style.display = 'none';
                    var worksContainer = document.getElementById('portfolioWorks');
                    worksContainer.style.display = 'block';
                    var html = `
                        <div class="card">
                            <button class="btn" onclick="showPortfolioCategories()" style="margin-bottom:15px;">← Назад</button>
                            <h3>${cat.icon} ${cat.name}</h3>
                            <div class="works-grid" id="worksGrid">
                    `;
                    var items = cat.items || [];
                    if (items.length === 0) {
                        html += '<p style="color:var(--text-muted)">Нет работ</p>';
                    } else {
                        items.forEach(function(item, idx) {
                            html += `
                                <div class="work-item" data-index="${idx}">
                                    <div class="work-image-wrapper">
                                        <img src="${item.image}" alt="${item.title}" onclick="viewImage('${item.image}', '${item.title}', true)" loading="lazy">
                                    </div>
                                    <div class="work-info">${item.title}</div>
                                    <div class="work-actions" style="left:8px; right:auto;">
                                        <button onclick="event.stopPropagation(); downloadWork('${item.image}', '${item.title}')" title="Скачать">⬇️</button>
                                    </div>
                                    ${window.isAdmin ? `
                                    <div class="work-actions" style="right:8px; left:auto;">
                                        <button onclick="editWork(${idx})">✏️</button>
                                        <button onclick="deleteWork(${idx})">🗑️</button>
                                    </div>` : ''}
                                </div>
                            `;
                        });
                    }
                    if (window.isAdmin) {
                        html += `<div class="add-work-btn" onclick="addWork()">+</div>`;
                    }
                    html += '</div></div>';
                    worksContainer.innerHTML = html;
                    if (window.isAdmin) setupSortableForWorks();

                    if (categorySubscription) {
                        categorySubscription.unsubscribe();
                    }
                    categorySubscription = supabase.channel('category_' + categoryId)
                        .on('postgres_changes', {
                            event: 'UPDATE',
                            schema: 'public',
                            table: 'portfolio_categories',
                            filter: 'id=eq.' + categoryId
                        }, function() {
                            openCategory(categoryId);
                        })
                        .subscribe();
                });
        }

        function showPortfolioCategories() {

                categorySubscription = null;

        function editWork(index) {
            if (!currentCategoryId) return;
            
            supabase.from('portfolio_categories').select('items').eq('id', currentCategoryId).single()
                .then(function(res) {
                    if (res.error || !res.data) return;
                    var items = res.data.items || [];
                    var work = items[index];

function toggleOptionUI(optId) {
    var checkbox = document.getElementById('checkbox_' + optId);
    var checkmark = document.getElementById('checkmark_' + optId);
    var qtyControl = document.getElementById('qtyControl_' + optId);
    
    if (!checkbox) return;
    
    var opt = currentOrderOptions.find(function(o) { return o.id == optId; });
    if (!opt) return;
    
    // Если опция обязательная - не даем снять галочку
    if (opt.is_required) {
        return;
    }
    
    var maxQty = opt.max_quantity || 1;
    var isSingle = maxQty <= 1;
    
    var isActive = checkbox.classList.contains('active');
    
    if (isActive) {
        checkbox.classList.remove('active');
        checkbox.style.background = 'transparent';
        checkbox.style.borderColor = 'rgba(255,255,255,0.2)';
        checkmark.style.opacity = '0';
        if (qtyControl) qtyControl.style.display = 'none';
        currentOrderQuantities[optId] = 0;
    } else {
        checkbox.classList.add('active');
        checkbox.style.background = 'linear-gradient(135deg, #7c3aed, #be185d)';
        checkbox.style.borderColor = '#7c3aed';
        checkmark.style.opacity = '1';
        
        if (isSingle) {
            currentOrderQuantities[optId] = 1;
        } else {
            if (qtyControl) qtyControl.style.display = 'flex';
            currentOrderQuantities[optId] = opt.min_quantity || 1;
        }
    }
    updateOrderTotal();
    updateQuantityDisplay(optId);
}

function changeQuantity(optId, delta) {
    var current = currentOrderQuantities[optId] || 0;
    var opt = currentOrderOptions.find(function(o) { return o.id == optId; });
    if (!opt) return;
    
    var maxQty = opt.max_quantity || 1;
    var isSingle = maxQty <= 1;
    
    if (isSingle) return;
    
    var newQty = current + delta;
    
    // Для обязательных опций минимум = min_quantity
    var minAllowed = opt.is_required ? (opt.min_quantity || 1) : 1;
    
    if (newQty < minAllowed) {
        if (opt.is_required) {
            alert('Это обязательная опция. Минимальное количество: ' + minAllowed);
            return;
        }
        if (newQty <= 0) {
            toggleOptionUI(optId);
            return;
        }
    }
    
    if (opt.max_quantity && newQty > opt.max_quantity) {
        alert('Максимум ' + opt.max_quantity + ' шт.');
        return;
    }
    
    currentOrderQuantities[optId] = newQty;
    updateQuantityDisplay(optId);
    updateOrderTotal();
}

        function updateQuantityDisplay(optId) {
    var display = document.getElementById('qtyDisplay_' + optId);
    var priceDisplay = document.getElementById('priceDisplay_' + optId);
    
    var opt = currentOrderOptions.find(function(o) { return o.id == optId; });
    if (!opt) return;
    
    var qty = currentOrderQuantities[optId] || 0;
    var maxQty = opt.max_quantity || 1;
    var isSingle = maxQty <= 1;
    
    if (isSingle) {
        if (display) display.textContent = qty > 0 ? '1' : '0';
        if (priceDisplay) {
            priceDisplay.textContent = qty > 0 ? opt.price + ' ₽' : '0 ₽';
        }
    } else {
        if (display) display.textContent = qty;
        
        var price = opt.price;
        var total = price * qty;
        var discountText = '';
        
        if (opt.discount_min_quantity && qty >= opt.discount_min_quantity && opt.discount_price) {
            price = opt.discount_price;
            total = price * qty;
            discountText = ' <span style="color:#fbbf24;font-size:12px;">(скидка ' + opt.discount_price + ' ₽/шт.)</span>';
        }
        
        if (priceDisplay) {
            if (discountText) {
                priceDisplay.innerHTML = opt.discount_price + ' × ' + qty + ' = ' + total + ' ₽' + discountText;
            } else {
                priceDisplay.textContent = price + ' × ' + qty + ' = ' + total + ' ₽';
            }
        }
    }
}

function updateOrderTotal() {
    var total = 0;
    var optionsWithQty = [];
    
    currentOrderOptions.forEach(function(opt) {
        var qty = currentOrderQuantities[opt.id] || 0;
        if (qty > 0) {
            var price = opt.price;
            if (opt.discount_min_quantity && qty >= opt.discount_min_quantity && opt.discount_price) {
                price = opt.discount_price;
            }
            var optTotal = price * qty;
            total += optTotal;
            optionsWithQty.push({ id: opt.id, name: opt.name, price: price, qty: qty, total: optTotal });
        }
    });
    
    var finalTotal = total;
    var discountApplied = false;
    
    // Проверяем, исключена ли услуга из скидок
    var excludedServices = ['Telegram Mini Apps', 'Дизайн сайтов', 'Дизайн мобильных приложений'];
    var isExcluded = excludedServices.indexOf(currentOrderService.name) !== -1;
    
    if (!isExcluded && currentDiscount > 0 && currentDiscount <= 100 && optionsWithQty.length > 0) {
        if (currentDiscount === 100) {
            // БЕСПЛАТНО — только на ОДНУ опцию (самую дешёвую)
            var cheapestOption = optionsWithQty[0];
            optionsWithQty.forEach(function(opt) {
                if (opt.total < cheapestOption.total) {
                    cheapestOption = opt;
                }
            });
            
            // Вычитаем стоимость самой дешёвой опции
            finalTotal = total - cheapestOption.total;
            if (finalTotal < 0) finalTotal = 0;
            discountApplied = true;
            
            // Сохраняем информацию о бесплатной опции
            window.freeOptionName = cheapestOption.name;
        } else {
            // Обычная скидка в процентах
            var discountAmount = Math.round(total * currentDiscount / 100);
            finalTotal = total - discountAmount;
            discountApplied = true;
            window.freeOptionName = null;
        }
    }
    
    var totalEl = document.getElementById('orderTotalPrice');
    if (totalEl) {
        if (currentDiscount === 100 && !isExcluded && optionsWithQty.length > 0) {
            totalEl.innerHTML = '<span style="text-decoration:line-through;color:var(--text-muted);font-size:14px;">' + total + ' ₽</span> <span style="color:#10b981;font-weight:700;">' + finalTotal + ' ₽</span> <span style="color:#10b981;font-size:12px;">(Бесплатно: ' + window.freeOptionName + ')</span>';
        } else if (discountApplied && finalTotal !== total) {
            totalEl.innerHTML = '<span style="text-decoration:line-through;color:var(--text-muted);font-size:14px;">' + total + ' ₽</span> <span style="color:#c084fc;font-weight:700;">' + finalTotal + ' ₽</span> <span style="color:#fbbf24;font-size:14px;">(-' + currentDiscount + '%)</span>';
        } else {
            totalEl.textContent = total + ' ₽';
        }
    }
    
    window.currentOrderFinalTotal = finalTotal;
    window.currentOrderOriginalTotal = total;
}

        function handleRefFiles(event) {
            var files = event.target.files;
            if (!files || files.length === 0) return;
            
            if (files.length + currentOrderFiles.length > 3) {
                alert('Можно прикрепить не более 3 референсов');
                return;
            }
            
            for (var i = 0; i < files.length; i++) {
                if (currentOrderFiles.length >= 3) break;
                
                var file = files[i];
                currentOrderFiles.push(file);
                
                (function(fileObj, index) {
                    var reader = new FileReader();
                    reader.onload = function(e) {
                        var preview = document.getElementById('refPreview');
                        if (!preview) return;
                        
                        var thumb = document.createElement('div');
                        thumb.className = 'preview-thumb';
                        thumb.innerHTML = `
                            <img src="${e.target.result}" alt="референс">
                            <button class="remove-btn" onclick="removeRef(${index})">×</button>
                        `;
                        preview.appendChild(thumb);
                    };
                    reader.readAsDataURL(fileObj);
                })(file, currentOrderFiles.length - 1);
            }
            
            event.target.value = '';
        }

        function removeRef(index) {
            if (index < 0 || index >= currentOrderFiles.length) return;
            
            currentOrderFiles.splice(index, 1);
            
            var preview = document.getElementById('refPreview');
            if (!preview) return;
            
            preview.innerHTML = '';
            
            currentOrderFiles.forEach(function(file, idx) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    var thumb = document.createElement('div');
                    thumb.className = 'preview-thumb';
                    thumb.innerHTML = `
                        <img src="${e.target.result}" alt="референс">
                        <button class="remove-btn" onclick="removeRef(${idx})">×</button>
                    `;
                    preview.appendChild(thumb);
                };
                reader.readAsDataURL(file);
            });
        }

    function submitOrderWithOptions() {
        console.warn('submitOrderWithOptions устарела, использую openCheckoutOverlay');
    if (typeof openCheckoutOverlay === 'function') {
        return openCheckoutOverlay();
    }
    return;
    var discountUsed = localStorage.getItem('discountUsed');
    if (discountUsed === 'true') {
        currentDiscount = 0;
        lastSpinDiscount = 0;
    }
    var selectedOptions = [];
    var missingRequired = [];
    
    currentOrderOptions.forEach(function(opt) {
        var qty = currentOrderQuantities[opt.id] || 0;
        if (qty > 0) {
            var price = opt.price;
            if (opt.discount_min_quantity && qty >= opt.discount_min_quantity && opt.discount_price) {
                price = opt.discount_price;
            }
            selectedOptions.push({
                name: opt.name,
                price: price,
                quantity: qty,
                total: price * qty,
                option_type: opt.option_type || 'checkbox'
            });
        } else if (opt.is_required) {
            missingRequired.push(opt.name);
        }
    });

    if (missingRequired.length > 0) {
        alert('Выберите обязательные опции:\n' + missingRequired.join('\n'));
        return;
    }

    if (selectedOptions.length === 0) {
        alert('Выберите хотя бы одну опцию');
        return;
    }

    var description = document.getElementById('orderDescription').value.trim();
    
    var total = window.currentOrderFinalTotal !== undefined && window.currentOrderFinalTotal !== null 
        ? window.currentOrderFinalTotal 
        : selectedOptions.reduce(function(sum, opt) { return sum + opt.total; }, 0);

    var user = window.currentUser;
    var userName = user?.first_name || user?.username || 'Пользователь';
    var userUsername = user?.username || null;
    var userId = user?.id ? String(user.id) : null;   // ← ДОБАВЬТЕ ЭТУ СТРОКУ

    var uploadPromises = currentOrderFiles.map(function(file) {
        return uploadFileToSupabase(file, 'references/' + (user?.id || 'anonymous'));
    });
    
    Promise.all(uploadPromises)
        .then(function(referenceUrls) {
            var order = {
                service: currentOrderService.name,
                user_name: userName,
                user_username: userUsername,
                user_id: userId,   // ← ДОБАВЬТЕ ЭТУ СТРОКУ
                time: new Date().toLocaleString('ru-RU'),
                timestamp: new Date().toISOString(),
                options: JSON.stringify(selectedOptions),
                total: total,
                description: description,
                reference_urls: referenceUrls,
                status: 'pending_payment'
            };
            
            return supabase.from('orders').insert([order]).select();
        })
        .then(function(res) {
            if (res.error) {
                alert('❌ Ошибка при сохранении: ' + res.error.message);
                console.error('Ошибка сохранения:', res.error);
                return;
            }
            
            if (res.data && res.data.length > 0) {
                var orderId = res.data[0].id;
                closeModal();
                showPaymentOptions(orderId, total, selectedOptions);
            } else {
                var tempOrderId = 'order_' + Date.now();
                closeModal();
                showPaymentOptions(tempOrderId, total, selectedOptions);
            }
        })
        .catch(function(err) {
            alert('❌ Ошибка: ' + err.message);
            console.error('Error:', err);
        });
}

function handleCheckoutRefs(event) {
    var files = event.target.files;
    if (!files || files.length === 0) return;
    if (files.length + checkoutRefFiles.length > 5) {
        alert('Максимум 5 референсов');
        return;
    }
    for (var i = 0; i < files.length; i++) {
        if (checkoutRefFiles.length >= 5) break;
        checkoutRefFiles.push(files[i]);
        (function(file, index) {
            var reader = new FileReader();
            reader.onload = function(e) {
                var preview = document.getElementById('checkoutRefsPreview');
                var thumb = document.createElement('div');
                thumb.className = 'preview-thumb';
                thumb.innerHTML = '<img src="' + e.target.result + '"><button class="remove-btn" onclick="removeCheckoutRef(' + index + ')">×</button>';
                preview.appendChild(thumb);
            };
            reader.readAsDataURL(file);
        })(files[i], checkoutRefFiles.length - 1);
    }
    event.target.value = '';
}

function removeCheckoutRef(index) {
    checkoutRefFiles.splice(index, 1);
    var preview = document.getElementById('checkoutRefsPreview');
    preview.innerHTML = '';
    checkoutRefFiles.forEach(function(file, idx) {
        var reader = new FileReader();
        reader.onload = function(e) {
            var thumb = document.createElement('div');
            thumb.className = 'preview-thumb';
            thumb.innerHTML = '<img src="' + e.target.result + '"><button class="remove-btn" onclick="removeCheckoutRef(' + idx + ')">×</button>';
            preview.appendChild(thumb);
        };
        reader.readAsDataURL(file);
    });
}

function renderCheckoutTotal(selected) {
    var baseTotal = selected.reduce(function(sum, o) { return sum + o.price * o.qty; }, 0);
    var discountSum = 0;

    if (currentPromo) {
        // Скидка от промокода (только на выбранные позиции)
        var appliesTo = currentPromo.applies_to || [];
        var eligibleSum = 0;
        selected.forEach(function(item) {
            var match = appliesTo.length === 0 || appliesTo.some(function(t) {
                return t.type === item.type && t.id === item.id;
            });
            if (match) eligibleSum += item.price * item.qty;
        });

        if (currentPromo.free) {
            discountSum = eligibleSum;
        } else {
            discountSum = Math.round(eligibleSum * currentPromo.discount_percent / 100);
        }
    } else if (currentDiscount > 0) {
        // Старая логика со скидкой от кейса
        var excludedServices = ['Telegram Mini Apps', 'Дизайн сайтов', 'Дизайн мобильных приложений'];
        var isExcluded = excludedServices.indexOf(currentOrderService.name) !== -1;
        if (!isExcluded) {
            if (currentDiscount === 100) {
                // Бесплатная — самая дешёвая опция
                var cheapest = selected[0];
                selected.forEach(function(o) {
                    if (o.price * o.qty < cheapest.price * cheapest.qty) cheapest = o;
                });
                discountSum = cheapest.price * cheapest.qty;
            } else {
                discountSum = Math.round(baseTotal * currentDiscount / 100);
            }
        }
    }

    var finalTotal = Math.max(0, baseTotal - discountSum);
    var totalEl = document.getElementById('checkoutTotal');
    if (totalEl) {
        totalEl.innerHTML = `
            ${discountSum > 0 ? '<div style="font-size:13px;color:#6ee7b7;">Скидка: −' + discountSum + '₽</div>' : ''}
            Итого: <span style="color:#c084fc;">${finalTotal}₽</span>
        `;
    }
    window.checkoutFinalTotal = finalTotal;
    window.checkoutBaseTotal = baseTotal;
}

function submitCheckout() {
    var desc = document.getElementById('checkoutDesc').value.trim();
    if (!desc) { alert('Опишите ТЗ, пожалуйста'); return; }

    var selected = [];
    currentOrderOptions.forEach(function(opt) {
        var qty = currentOrderQuantities[opt.id] || 0;
        if (qty > 0) {
            var price = opt.price;
            if (opt.discount_min_quantity && qty >= opt.discount_min_quantity && opt.discount_price) {
                price = opt.discount_price;
            }
            selected.push({
                name: opt.name,
                price: price,
                quantity: qty,
                total: price * qty,
                option_type: opt.option_type || 'checkbox'
            });
        }
    });

    var user = window.currentUser;
    var userName = user?.first_name || user?.username || 'Пользователь';
    var userUsername = user?.username || null;
    var userId = user?.id ? String(user.id) : null;

    // Загружаем референсы
    var uploadPromises = checkoutRefFiles.map(function(file) {
        return uploadFileToSupabase(file, 'references/' + (user?.id || 'anonymous'));
    });

    Promise.all(uploadPromises)
        .then(function(refUrls) {
            var order = {
                service: currentOrderService.name,
                user_name: userName,
                user_username: userUsername,
                user_id: userId,
                time: new Date().toLocaleString('ru-RU'),
                timestamp: new Date().toISOString(),
                options: JSON.stringify(selected),
                total: window.checkoutFinalTotal || 0,
                description: desc,
                reference_urls: refUrls,
                promo_code: currentPromo ? currentPromo.code : null,
                status: 'pending_payment'
            };
            return supabase.from('orders').insert([order]).select();
        })
        .then(function(res) {
            if (res.error) {
                alert('❌ Ошибка: ' + res.error.message);
                return;
            }
            if (res.data && res.data.length > 0) {
                var orderId = res.data[0].id;
                closeModal();
                showPaymentOptions(orderId, window.checkoutFinalTotal, selected);
            }
        })
        .catch(function(err) {
            alert('❌ Ошибка: ' + err.message);
            console.error(err);
        });
}

// Отмена заказа
function cancelOrder(orderId) {
    if (!confirm('Вы уверены, что хотите отменить заказ?')) return;
    
    // Получаем информацию о заказе перед удалением
    supabase.from('orders').select('*').eq('id', orderId).single()
        .then(function(res) {
            if (res.error || !res.data) {
                alert('Заказ не найден');
                return;
            }
            
            var order = res.data;
            
            // Удаляем референсы из хранилища если есть
            var deletePromises = [];
            if (order.reference_urls && order.reference_urls.length > 0) {
                order.reference_urls.forEach(function(url) {
                    var path = url.split('/public/')[1];
                    if (path) {
                        deletePromises.push(supabase.storage.from('public').remove([path]));
                    }
                });
            }
            
            // Удаляем файлы и сам заказ
            return Promise.all(deletePromises).catch(function() {}).then(function() {
                return supabase.from('orders').delete().eq('id', orderId);
            });
        })
        .then(function(deleteRes) {
            if (deleteRes && deleteRes.error) {
                alert('Ошибка при удалении: ' + deleteRes.error.message);
                return;
            }
            
            alert('✅ Заказ отменен и удален');
            
            // Обновляем список заказов
            if (window.isAdmin) {
                loadAdminOrders();
            } else {
                loadUserOrders();
            }
            
            // Обновляем весь раздел
            renderOrdersSection();
        })
        .catch(function(err) {
            console.error('Ошибка:', err);
            alert('Ошибка: ' + err.message);
        });
}
