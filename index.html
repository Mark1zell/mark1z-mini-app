// Обновление таймера в заказах
function updateOrderTimers() {
    var orderCards = document.querySelectorAll('[data-order-id]');
    orderCards.forEach(function(card) {
        var orderId = card.dataset.orderId;
        var timestamp = card.dataset.timestamp;
        
        if (timestamp && orderId) {
            var orderTime = new Date(timestamp).getTime();
            var now = Date.now();
            var remaining = 10 * 60 * 1000 - (now - orderTime);
            
            if (remaining <= 0) {
                // Заказ просрочен
                var timerEl = card.querySelector('.order-timer');
                if (timerEl) {
                    timerEl.textContent = 'Заказ просрочен';
                    timerEl.style.color = '#ff6b6b';
                }
                
                var cancelBtn = card.querySelector('.cancel-order-btn');
                if (cancelBtn) cancelBtn.style.display = 'inline-block';
            } else {
                var minutes = Math.floor(remaining / 60000);
                var seconds = Math.floor((remaining % 60000) / 1000);
                
                var timerEl = card.querySelector('.order-timer');
                if (timerEl) {
                    timerEl.textContent = 'Осталось: ' + minutes + ':' + (seconds < 10 ? '0' : '') + seconds;
                    timerEl.style.color = '#ffc107';
                }
            }
        }
    });
}

        // Функция для автоматической проверки неоплаченных заказов
function autoCheckPendingPayments() {
    console.log('🔄 Автоматическая проверка неоплаченных заказов...');
    
    var user = window.currentUser;
    if (!user) {
        console.log('Пользователь не определен');
        return;
    }
    
    var userIdentifier = user.username || user.first_name || user.id.toString();
    
    // Находим ВСЕ заказы пользователя со статусом pending_payment
    supabase.from('orders')
        .select('*')
        .eq('status', 'pending_payment')
        .or('user_username.eq.' + userIdentifier + ',user_name.eq.' + userIdentifier)
        .then(function(res) {
            if (res.error) {
                console.error('Ошибка загрузки pending заказов:', res.error);
                return;
            }
            
            if (!res.data || res.data.length === 0) {
                console.log('Нет неоплаченных заказов');
                return;
            }
            
            console.log('Найдено неоплаченных заказов:', res.data.length);
            
            // Проверяем каждый заказ
                        res.data.forEach(function(order) {
                if (order.payment_id) {
                    // Если payment_id начинается с "charge_" или содержит цифры — это звёзды
                    // Иначе — ЮKassa
                    if (String(order.payment_id).startsWith('charge_') || /^\d+$/.test(order.payment_id)) {
                        // Звёзды — статус уже обновляется ботом через handle_successful_payment
                        // Просто проверяем ещё раз через 10 минут
                        var orderTime = new Date(order.timestamp).getTime();
                        if (Date.now() - orderTime > 10 * 60 * 1000) {
                            cancelExpiredOrder(order.id);
                        }
                    } else {
                        checkPaymentStatusSilent(order.payment_id, order.id);
                    }
                } else {
                    // Если нет payment_id, но заказ старый - отменяем
                    var orderTime = new Date(order.timestamp).getTime();
                    var now = Date.now();
                    var tenMinutes = 10 * 60 * 1000;
                    
                    if (now - orderTime > tenMinutes) {
                        cancelExpiredOrder(order.id);
                    }
                }
            });
        })
        .catch(function(err) {
            console.error('Ошибка:', err);
        });
}

// Тихая проверка статуса платежа (без модального окна)
function checkPaymentStatusSilent(paymentId, orderId) {
    console.log('🔍 Автоматическая проверка платежа:', paymentId, 'для заказа:', orderId);
    
    var functionUrl = 'https://lcgbpwowppwwpjjlphod.supabase.co/functions/v1/check-payment';
    var supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjZ2Jwd293cHB3d3BqamxwaG9kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NDAwNTMsImV4cCI6MjEwNDIxNjA1M30.95VPot7saWmlgv1IzBop3E4x-ZxSc8HepqKdDLJa7JI';
    
    // Устанавливаем таймаут для fetch
    var controller = new AbortController();
    var timeoutId = setTimeout(function() {
        controller.abort();
    }, 8000); // 8 секунд максимум
    
    fetch(functionUrl, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + supabaseKey,
            'apikey': supabaseKey
        },
        body: JSON.stringify({
            paymentId: paymentId,
            orderId: orderId
        }),
        signal: controller.signal
    })
    .then(res => res.json())
    .then(data => {
        clearTimeout(timeoutId);
        console.log('Статус платежа:', data.status);
        
        if (data.status === 'succeeded') {
            console.log('✅ Платеж выполнен, обновляем заказ #' + orderId);
            
            supabase.from('orders')
                .update({ 
                    status: 'paid_card',
                    paid_at: new Date().toISOString()
                })
                .eq('id', orderId)
                .then(function() {
                    console.log('✅ Заказ обновлен как оплаченный');
                    
                    // Сбрасываем скидку
                    resetDiscountAfterPayment();
                    
                    // Показываем уведомление
                    showPaymentSuccessNotification(orderId);
                    
                    // Обновляем интерфейс
                    if (window.isAdmin) {
                        loadAdminOrders();
                    } else {
                        loadUserOrders();
                    }
                    renderOrdersSection();
                });
        } else if (data.status === 'pending') {
            console.log('⏳ Платеж еще обрабатывается, проверим позже');
        } else if (data.status === 'canceled') {
            console.log('❌ Платеж отменен');
            // Можно отменить заказ
            cancelExpiredOrder(orderId);
        }
    })
    .catch(function(err) {
        clearTimeout(timeoutId);
        if (err.name === 'AbortError') {
            console.log('⏱ Проверка прервана по таймауту');
        } else {
            console.error('Ошибка тихой проверки:', err);
        }
    });
}

    } else {

            // Убираем дубликаты
            var uniqueOrders = [];
            var seenIds = {};
            orders.forEach(function(order) {
                if (!seenIds[order.id]) {
                    seenIds[order.id] = true;
                    uniqueOrders.push(order);

            });
            
            renderAdminOrdersList(uniqueOrders);
        });

// Функция удаления готовых заказов (только у админа)
function clearReadyOrders() {
    if (!confirm('Удалить все ГОТОВЫЕ заказы у себя? У пользователей они останутся еще на 15 дней.')) return;
    
    supabase.from('orders')
        .select('*')
        .eq('status', 'ready')
        .then(function(res) {
            if (res.error) {
                alert('Ошибка: ' + res.error.message);
                return;
            }
            
            var orders = res.data || [];
            
            if (orders.length === 0) {
                alert('Нет готовых заказов');
                return;
            }
            
            // Удаляем референсы
            var deletePromises = [];
            orders.forEach(function(order) {
                if (order.reference_urls && order.reference_urls.length > 0) {
                    order.reference_urls.forEach(function(url) {
                        var path = url.split('/public/')[1];
                        if (path) {
                            deletePromises.push(supabase.storage.from('public').remove([path]));
                        }
                    });
                }
            });
            
            return Promise.all(deletePromises).catch(function() {}).then(function() {
                // Помечаем как скрытые для админа (или удаляем)
                return supabase.from('orders')
                    .delete()
                    .eq('status', 'ready');
            });
        })
        .then(function(deleteRes) {
            if (deleteRes && deleteRes.error) {
                alert('Ошибка удаления: ' + deleteRes.error.message);
                return;
            }
            
            alert('✅ Готовые заказы удалены у админа!');
            loadAdminOrders();
        })
        .catch(function(err) {
            console.error('Ошибка:', err);
            alert('Ошибка: ' + err.message);
        });
}

// Загрузка заказов для пользователя
function loadUserOrders() {
    var container = document.getElementById('userOrdersList');
    if (!container) return;
    
    var user = window.currentUser;
    if (!user) {
        container.innerHTML = '<p style="color:var(--text-muted);">Войдите через Telegram</p>';
        return;
    }
    
    var userIdentifier = user.username || user.first_name || user.id.toString();
    
    // Используем кэширование
    var cacheKey = 'user_orders_' + userIdentifier;
    var cachedOrders = sessionStorage.getItem(cacheKey);
    
    if (cachedOrders) {
        try {
            var parsed = JSON.parse(cachedOrders);
            if (parsed.timestamp && (Date.now() - parsed.timestamp < 30000)) {
                renderUserOrdersList(parsed.data);
                return;
            }
        } catch(e) {}
    }
    
    supabase.from('orders')
        .select('*')
        .or('user_username.eq.' + userIdentifier + ',user_name.eq.' + userIdentifier)
        .neq('status', 'cancelled')
        .order('timestamp', { ascending: false })
        .then(function(res) {
            if (res.error) {
                console.error('Ошибка загрузки заказов:', res.error);
                container.innerHTML = '<p style="color:var(--text-muted);">Ошибка загрузки</p>';
                return;
            }
            
            var orders = res.data || [];
            
            // Кэшируем
            sessionStorage.setItem(cacheKey, JSON.stringify({
                data: orders,
                timestamp: Date.now()
            }));
            
            renderUserOrdersList(orders);
        })
        .catch(function(err) {
            console.error('Ошибка:', err);
            container.innerHTML = '<p style="color:var(--text-muted);">Ошибка загрузки</p>';
        });
}

// Функция анимации статусов
// Функция анимации статусов (только 1 раз)
function animatePaidStatuses() {
    var paidStatuses = document.querySelectorAll('.status-transition');
    
    paidStatuses.forEach(function(el) {
        var orderId = el.dataset.orderId;

        // Проверяем, не показывали ли уже анимацию для этого заказа
        var animatedOrders = JSON.parse(localStorage.getItem('animatedPaidOrders') || '[]');
        if (animatedOrders.indexOf(String(orderId)) !== -1) {
            // Анимация уже была — сразу показываем "Ещё не приступили", без таймера
            el.style.background = 'rgba(255,0,0,0.2)';
            el.style.color = '#ff6b6b';
            el.textContent = '🔴 Ещё не приступили';
            return;
        }

        setTimeout(function() {
            el.style.transition = 'all 0.6s ease';
            el.style.background = 'rgba(255,0,0,0.2)';
            el.style.color = '#ff6b6b';
            el.textContent = '🔴 Ещё не приступили';

            // Запоминаем, что для этого заказа анимация проиграна
            var list = JSON.parse(localStorage.getItem('animatedPaidOrders') || '[]');
            if (list.indexOf(String(orderId)) === -1) {
                list.push(String(orderId));
                localStorage.setItem('animatedPaidOrders', JSON.stringify(list));
            }

            // Обновляем статус в БД только если он всё ещё "paid_card"/"paid_stars"
            supabase.from('orders')
                .select('status')
                .eq('id', orderId)
                .single()
                .then(function(res) {
                    if (res.data && (res.data.status === 'paid_card' || res.data.status === 'paid_stars')) {
                        return supabase.from('orders')
                            .update({ status: 'not_started' })
                            .eq('id', orderId)
                            .then(function() {
                                console.log('✅ Статус заказа #' + orderId + ' → not_started');
                            });
                    }
                });
        }, 3000);
    });
}

            || (p.description || '').toLowerCase().indexOf(query) !== -1
            || (p.tags || []).some(function(t) { return t.toLowerCase().indexOf(query) !== -1; });
    });

    // Корзина
    if (cart.length > 0) {
        var cartTotal = cart.reduce(function(s, i) { return s + i.price * i.qty; }, 0);

                                <div style="display:flex;align-items:center;gap:8px;">
                                    <span>${item.name}</span>
                                    <div style="display:flex;align-items:center;gap:6px;">
                                        <button class="btn btn-sm" onclick="changeCartQty(${idx}, -1)"

                                        <span style="font-weight:600;min-width:20px;text-align:center;">${item.qty}</span>
                                        <button class="btn btn-sm" onclick="changeCartQty(${idx}, 1)"
                                                style="padding:2px 8px;font-size:14px;line-height:1;">+</button>
                                    </div>
                                </div>
                                <div style="display:flex;align-items:center;gap:8px;">
                                    <span style="color:#c084fc;">${item.price * item.qty} ₽</span>
                                    <button class="btn btn-sm" onclick="removeFromCart(${idx})"
                                            style="background:rgba(255,0,0,0.4);padding:2px 8px;">×</button>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
                <button class="btn" onclick="openCartCheckout()" style="width:100%;">
                    💳 Оформить заказ из корзины
                </button>
            </div>
        `;
    }

    // Список товаров
    if (filtered.length === 0) {
        html += `<div style="text-align:center;padding:30px;color:var(--text-muted);">
            ${query ? 'Ничего не найдено по запросу «' + productsSearch + '»' : 'Товаров пока нет'}
        </div>`;
    } else {
        html += '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;">';
                filtered.forEach(function(p) {
            var inCart = cart.find(function(i) { return i.id === p.id; });
            var underPromo = currentPromo && (
                (currentPromo.applies_to || []).length === 0
                || (currentPromo.applies_to || []).some(function(t) { return t.type === 'product' && t.id === p.id; })
            );
            var borderColor = inCart ? 'rgba(16,185,129,0.5)' 
                : (underPromo ? 'rgba(251,191,36,0.5)' : 'var(--card-border)');
            html += `
                <div style="background:rgba(15,7,25,0.9);border:1px solid ${borderColor};

                    ${p.image ? '<img src="' + p.image + '" style="width:100%;height:100px;object-fit:cover;border-radius:10px;margin-bottom:8px;">' : ''}
                                        <div style="font-weight:600;font-size:14px;margin-bottom:4px;">
                        ${p.name}
                        ${underPromo && !inCart ? '<span style="background:rgba(251,191,36,0.2);color:#fbbf24;padding:2px 6px;border-radius:6px;font-size:10px;margin-left:4px;">🎁</span>' : ''}
                    </div>
                    ${p.description ? '<div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;">' + p.description + '</div>' : ''}
                    <div style="margin-top:auto;display:flex;justify-content:space-between;align-items:center;">
                        <span style="color:#c084fc;font-weight:700;">${p.price} ₽</span>
                        ${inCart 
                            ? '<span style="font-size:11px;color:#6ee7b7;">✓ в корзине</span>'
                            : '<button class="btn btn-sm" onclick="addToCart(' + p.id + ')" style="padding:4px 10px;font-size:12px;">+ В корзину</button>'}
                    </div>
                </div>
            `;
        });
        html += '</div>';
    }

    // Админ-кнопка
    if (window.isAdmin) {
        html += `
            <div style="margin-top:15px;">
                <button class="btn" onclick="openProductManager()" style="width:100%;background:rgba(16,185,129,0.3);">
                    ⚙️ Управление товарами

    }

    return html;
}

function onProductSearch(val) {
    productsSearch = val;
    // Debounce — перерисовка через 200мс
    clearTimeout(window._productSearchTimer);
    window._productSearchTimer = setTimeout(function() {
        var content = document.getElementById('userOrdersContent');
        if (content && userOrdersMode === 'products') {
            content.innerHTML = renderProductsForUser();
            // Возвращаем фокус в поле поиска
            var input = document.getElementById('productSearch');
            if (input) {
                input.focus();
                input.setSelectionRange(input.value.length, input.value.length);
            }
        }
    }, 200);
}

function addToCart(productId) {
    var product = productsData.find(function(p) { return p.id === productId; });
    if (!product) return;
    var existing = cart.find(function(i) { return i.id === productId; });
    if (existing) {
        existing.qty += 1;
    } else {
        cart.push({ id: product.id, name: product.name, price: product.price, qty: 1 });
    }
    saveCart();
    refreshProductsUI();
}

function removeFromCart(index) {
    cart.splice(index, 1);
    saveCart();
    refreshProductsUI();
}

function changeCartQty(index, delta) {
    if (!cart[index]) return;
    cart[index].qty += delta;
    if (cart[index].qty <= 0) {
        cart.splice(index, 1);
    }
    saveCart();
    refreshProductsUI();
}

function saveCart() {
    localStorage.setItem('cart', JSON.stringify(cart));
    // Обновляем счётчик в шапке
    var content = document.getElementById('userOrdersContent');
    if (content && userOrdersMode === 'products') {
        content.innerHTML = renderProductsForUser();
    } else {
        // Перерисуем табы, чтобы обновить счётчик
        renderOrdersSection();
    }
}

function refreshProductsUI() {
    var content = document.getElementById('userOrdersContent');
    if (content && userOrdersMode === 'products') {
        content.innerHTML = renderProductsForUser();
    } else {
        renderOrdersSection();
    }
}

        function openCartCheckout() {
    if (cart.length === 0) { alert('Корзина пуста'); return; }

    var total = cart.reduce(function(s, i) { return s + i.price * i.qty; }, 0);

    // Скидка от промокода
    var discountSum = 0;
    if (currentPromo) {
        var appliesTo = currentPromo.applies_to || [];
        var eligibleSum = 0;
        cart.forEach(function(item) {
            var match = appliesTo.length === 0 
                || appliesTo.some(function(t) { return t.type === 'product' && t.id === item.id; });
            if (match) eligibleSum += item.price * item.qty;
        });
        discountSum = currentPromo.free ? eligibleSum 
            : Math.round(eligibleSum * currentPromo.discount_percent / 100);
    }

    var finalTotal = Math.max(0, total - discountSum);

    var modal = document.getElementById('modalOverlay');
    var content = document.getElementById('modalContent');

    content.innerHTML = `
        <div style="max-height:80vh;overflow-y:auto;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
                <h3>🛒 Оформление заказа</h3>
                <button class="btn" onclick="closeModal()" style="margin:0;">×</button>
            </div>

            <div style="background:rgba(255,255,255,0.05);border-radius:12px;padding:14px;margin-bottom:15px;">
                ${cart.map(function(item) {
                    return '<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;">'
                        + '<span>' + item.name + ' × ' + item.qty + '</span>'
                        + '<span>' + item.price * item.qty + ' ₽</span></div>';
                }).join('')}
                <div style="border-top:1px solid var(--card-border);margin-top:10px;padding-top:10px;
                            display:flex;justify-content:space-between;font-weight:700;">
                    <span>Итого:</span>
                    <span style="color:#c084fc;">${finalTotal} ₽</span>
                </div>
                ${discountSum > 0 ? '<div style="font-size:12px;color:#6ee7b7;text-align:right;margin-top:4px;">Скидка: −' + discountSum + ' ₽</div>' : ''}
            </div>

            <label style="display:block;font-size:13px;color:var(--text-muted);margin-bottom:6px;">
                📝 Техническое задание *
            </label>
            <textarea id="cartCheckoutDesc" placeholder="Опишите, что нужно сделать..."
                      style="width:100%;min-height:100px;margin-bottom:15px;"></textarea>

            <label style="display:block;font-size:13px;color:var(--text-muted);margin-bottom:6px;">
                📎 Референсы (до 5 изображений)
            </label>
            <input type="file" id="cartRefs" accept="image/*" multiple onchange="handleCartRefs(event)" style="width:100%;">
            <div id="cartRefsPreview" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;margin-bottom:15px;"></div>

            <button class="btn" style="width:100%;" onclick="submitCartOrder(${finalTotal})">
                ✅ Подтвердить и перейти к оплате
            </button>
        </div>
    `;
    modal.style.display = 'flex';

    checkoutRefFiles = [];
    setTimeout(function() {
        var el = document.getElementById('cartCheckoutDesc');
        if (el) { el.focus(); el.click(); }
    }, 150);
}

function handleCartRefs(event) {
    var files = event.target.files;
    if (!files || files.length === 0) return;
    if (files.length + checkoutRefFiles.length > 5) {
        alert('Максимум 5 референсов');
        return;
    }
    for (var i = 0; i < files.length; i++) {
        if (checkoutRefFiles.length >= 5) break;
        checkoutRefFiles.push(files[i]);
        (function(file, index) {
            var reader = new FileReader();
            reader.onload = function(e) {
                var preview = document.getElementById('cartRefsPreview');
                var thumb = document.createElement('div');
                thumb.className = 'preview-thumb';
                thumb.innerHTML = '<img src="' + e.target.result + '"><button class="remove-btn" onclick="removeCartRef(' + index + ')">×</button>';
                preview.appendChild(thumb);
            };
            reader.readAsDataURL(file);
        })(files[i], checkoutRefFiles.length - 1);
    }
    event.target.value = '';
}

function removeCartRef(index) {
    checkoutRefFiles.splice(index, 1);
    var preview = document.getElementById('cartRefsPreview');
    preview.innerHTML = '';
    checkoutRefFiles.forEach(function(file, idx) {
        var reader = new FileReader();
        reader.onload = function(e) {
            var thumb = document.createElement('div');
            thumb.className = 'preview-thumb';
            thumb.innerHTML = '<img src="' + e.target.result + '"><button class="remove-btn" onclick="removeCartRef(' + idx + ')">×</button>';
            preview.appendChild(thumb);
        };
        reader.readAsDataURL(file);
    });
}

function submitCartOrder(finalTotal) {
    var desc = document.getElementById('cartCheckoutDesc').value.trim();
    if (!desc) { alert('Опишите ТЗ'); return; }

    var user = window.currentUser;
    var userName = user?.first_name || user?.username || 'Пользователь';
    var userUsername = user?.username || null;
    var userId = user?.id ? String(user.id) : null;

    var uploadPromises = checkoutRefFiles.map(function(file) {
        return uploadFileToSupabase(file, 'references/' + (user?.id || 'anonymous'));
    });

    Promise.all(uploadPromises)
        .then(function(refUrls) {
            var options = cart.map(function(item) {
                return {
                    name: item.name,
                    price: item.price,
                    quantity: item.qty,
                    total: item.price * item.qty,
                    option_type: 'product'
                };
            });

            var order = {
                service: 'Товары из корзины',
                user_name: userName,
                user_username: userUsername,
                user_id: userId,
                time: new Date().toLocaleString('ru-RU'),
                timestamp: new Date().toISOString(),
                options: JSON.stringify(options),
                total: finalTotal,
                description: desc,
                reference_urls: refUrls,
                promo_code: currentPromo ? currentPromo.code : null,
                status: 'pending_payment'
            };
            return supabase.from('orders').insert([order]).select();
        })
        .then(function(res) {
            if (res.error) {
                alert('❌ Ошибка: ' + res.error.message);
                return;
            }
            if (res.data && res.data.length > 0) {
                var orderId = res.data[0].id;
                cart = [];
                saveCart();
                closeModal();
                showPaymentOptions(orderId, finalTotal, []);
            }
        })
        .catch(function(err) {
            alert('❌ Ошибка: ' + err.message);
            console.error(err);
        });
}

    var tags = document.getElementById('prodTags').value.split(',').map(function(t) { return t.trim(); }).filter(Boolean);

    supabase.from('products').insert([{
        name: name,
        price: price,
        description: desc,
        tags: tags,

        active: true
    }]).then(function(res) {

function updateProduct(id) {

// Функция очистки неоплаченных заказов
function clearPendingOrders() {
    if (!confirm('Удалить ВСЕ неоплаченные заказы? Это действие нельзя отменить!')) return;
    
    // Получаем все неоплаченные заказы
    supabase.from('orders')
        .select('*')
        .eq('status', 'pending_payment')
        .then(function(res) {
            if (res.error) {
                alert('Ошибка: ' + res.error.message);
                return;
            }
            
            var orders = res.data || [];
            
            if (orders.length === 0) {
                alert('Нет неоплаченных заказов');
                return;
            }
            
            // Удаляем референсы из хранилища
            var deletePromises = [];
            orders.forEach(function(order) {
                if (order.reference_urls && order.reference_urls.length > 0) {
                    order.reference_urls.forEach(function(url) {
                        var path = url.split('/public/')[1];
                        if (path) {
                            deletePromises.push(supabase.storage.from('public').remove([path]));
                        }
                    });
                }
            });
            
            return Promise.all(deletePromises).catch(function() {}).then(function() {
                // Удаляем все неоплаченные заказы
                return supabase.from('orders')
                    .delete()

function allowReview(orderId) {
    console.log('📝 Разрешение отзыва для заказа #' + orderId);
    
    supabase.from('orders').select('*').eq('id', orderId).single()
        .then(function(res) {
            if (res.error || !res.data) {
                console.error('Ошибка загрузки заказа:', res.error);
                return;
            }
            
            var order = res.data;
            var userIdentifier = order.user_username || order.user_name || order.user_id;
            
            console.log('User identifier:', userIdentifier);
            console.log('Order data:', order);
            
            if (!userIdentifier) {
                console.error('Не найден идентификатор пользователя');
                return;
            }
            
            var options = [];
            try {
                options = JSON.parse(order.options || '[]');
            } catch(e) {
                options = [];
            }
            
            var orderInfo = {
                service: order.service,
                total: order.total,
                options: options,
                time: order.time,
                order_id: orderId
            };
            
            console.log('Новая информация о заказе:', orderInfo);
            
            // СНАЧАЛА пробуем обновить
            supabase.from('user_last_review')
                .update({
                    can_review: true,
                    order_info: orderInfo,
                    timestamp: new Date().toISOString()
                })
                .eq('user_id', userIdentifier)
                .then(function(updateRes) {
                    console.log('Результат обновления:', updateRes);
                    
                    if (updateRes.error) {
                        console.error('Ошибка обновления:', updateRes.error);
                        return;
                    }
                    
                    // Если обновление не затронуло строк (пользователь не найден)
                    if (!updateRes.data || updateRes.data.length === 0) {
                        console.log('Пользователь не найден, создаем новую запись');
                        return supabase.from('user_last_review')
                            .insert({
                                user_id: userIdentifier,
                                can_review: true,
                                order_info: orderInfo,
                                timestamp: new Date().toISOString()
                            });
                    }
                    
                    console.log('✅ Отзыв разрешен для:', userIdentifier);
                    return updateRes;
                })
                .then(function(insertRes) {
                    if (insertRes && insertRes.error) {
                        console.error('Ошибка создания:', insertRes.error);
                    } else if (insertRes) {
                        console.log('✅ Новая запись создана для:', userIdentifier);
                    }
                })
                .catch(function(err) {
                    console.error('Ошибка:', err);
                });
        });
}

            reader.readAsDataURL(file);

        function applyViewerTransform() {
            var img = document.getElementById('imageViewerImg');
            if (!img) return;
            
            if (viewerScale <= 1) {
                viewerScale = 1;
                viewerPanX = 0;
                viewerPanY = 0;
                img.style.transform = 'scale(1)';
                img.style.left = '0px';
                img.style.top = '0px';
                return;
            }
            
            var maxX = (img.offsetWidth * viewerScale - img.offsetWidth) / 2;
            var maxY = (img.offsetHeight * viewerScale - img.offsetHeight) / 2;
            
            viewerPanX = Math.max(-maxX, Math.min(maxX, viewerPanX));
            viewerPanY = Math.max(-maxY, Math.min(maxY, viewerPanY));
            
            img.style.transform = 'scale(' + viewerScale + ')';
            img.style.left = viewerPanX + 'px';
            img.style.top = viewerPanY + 'px';
        }

        function initImageViewerZoom() {
            var imageViewer = document.getElementById('imageViewer');
            var img = document.getElementById('imageViewerImg');
            
            imageViewer.addEventListener('touchstart', function(e) {
                if (e.touches.length === 2) {
                    viewerStartDistance = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    viewerStartScale = viewerScale;
                } else if (e.touches.length === 1 && viewerScale > 1) {
                    viewerIsPanning = true;
                    viewerStartPanX = e.touches[0].clientX - viewerPanX;
                    viewerStartPanY = e.touches[0].clientY - viewerPanY;
                }
            }, { passive: true });
            
            imageViewer.addEventListener('touchmove', function(e) {
                if (e.touches.length === 2 && viewerStartDistance > 0) {
                    e.preventDefault();
                    var currentDistance = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    viewerScale = Math.min(Math.max(viewerStartScale * currentDistance / viewerStartDistance, 1), 4);
                    applyViewerTransform();
                } else if (e.touches.length === 1 && viewerIsPanning) {
                    e.preventDefault();
                    viewerPanX = e.touches[0].clientX - viewerStartPanX;
                    viewerPanY = e.touches[0].clientY - viewerStartPanY;
                    applyViewerTransform();
                }
            }, { passive: false });
            
            imageViewer.addEventListener('touchend', function() {
                viewerIsPanning = false;
                viewerStartDistance = 0;
            });
            
            // Двойной тап для зума
            var lastTap = 0;
            imageViewer.addEventListener('click', function(e) {
                var now = Date.now();
                if (now - lastTap < 300) {
                    // Двойной тап
                    e.preventDefault();
                    if (viewerScale > 1) {
                        viewerScale = 1;
                        viewerPanX = 0;
                        viewerPanY = 0;
                    } else {
                        viewerScale = 2;
                    }
                    applyViewerTransform();
                    lastTap = 0;
                } else {
                    lastTap = now;
                }
            });
        }

function submitReview() {
    var text = document.getElementById('reviewText').value.trim();
    if (!text) { alert('Введите текст'); return; }
    if (!selectedRating) { alert('Поставьте оценку'); return; }
    var user = window.currentUser;
    if (!user || !user.id) { alert('Не удалось определить пользователя'); return; }
    
    var userIdentifier = user.username || user.first_name || user.id.toString();
    
    console.log('Проверка разрешения отзыва для:', userIdentifier);
    
    supabase.from('user_last_review')
        .select('*')
        .eq('user_id', userIdentifier)
        .maybeSingle()
        .then(function(res) {
            console.log('Результат проверки:', res);
            
            if (res.error || !res.data || !res.data.can_review) {
                alert('Вы можете оставить отзыв только после выполнения вашего заказа.');
                return Promise.reject('no_permission');
            }
            
            var orderInfo = res.data.order_info;
            
            var uploadPromises = tempReviewFiles.map(function(file) {
                return compressImage(file, 600, 0.85).then(function(dataUrl) {
                    var blob = dataURLToBlob(dataUrl);
                    var f = new File([blob], file.name, { type: file.type || 'image/jpeg' });
                    return uploadFileToSupabase(f, 'reviews/' + user.id);
                });
            });
            
            return Promise.all(uploadPromises).then(function(urls) {
                return { urls: urls, orderInfo: orderInfo };
            });
        })
        .then(function(data) {
            return supabase.from('reviews').insert([{
                author_name: user.first_name || user.username || 'Пользователь',
                author_username: user.username || null,
                author_id: user.id.toString(),
                photo_url: user.photo_url || null,
                stars: selectedRating,
                text: text,
                images: data.urls,
                order_info: data.orderInfo,
                likes_heart: 0, likes_fire: 0, likes_plus: 0,
                admin_reply: '',
                timestamp: new Date().toISOString()
            }]);
        })
        .then(function() {
            // Сбрасываем can_review после публикации отзыва
            return supabase.from('user_last_review').update({
                can_review: false
            }).eq('user_id', userIdentifier);
        })
        .then(function() {
            closeModal();
            tempReviewFiles = [];
            loadReviews();
            alert('✅ Отзыв опубликован!');
        })
        .catch(function(err) {
            if (err !== 'no_permission') alert('Ошибка: ' + err.message);
        });
}

function toggleReaction(reviewId, type) {
    var user = window.currentUser;
    if (!user || !user.id) { alert('Не удалось определить пользователя'); return; }
    
    var userIdentifier = user.username || user.first_name || user.id.toString();
    var fieldMap = { 'heart': 'likes_heart', 'fire': 'likes_fire', 'plus': 'likes_plus' };
    var field = fieldMap[type];
    
    var btn = document.querySelector('.like-btn[data-review="' + reviewId + '"][data-type="' + type + '"]');
    
    supabase.from('review_likes').select('id').eq('review_id', reviewId).eq('user_id', userIdentifier).eq('reaction_type', type).single()
        .then(function(res) {
            if (!res.error && res.data) {
                // Лайк уже есть — убираем
                return supabase.from('review_likes').delete().eq('id', res.data.id)
                    .then(function() {
                        return supabase.from('reviews').select(field).eq('id', reviewId).single()
                            .then(function(r2) {
                                var current = r2.data[field] || 0;
                                return supabase.from('reviews').update({ [field]: Math.max(0, current - 1) }).eq('id', reviewId);
                            });
                    })
                    .then(function() {
                        if (btn) btn.classList.remove('active');
                        loadReviews();
                    });
            } else {
                // Лайка нет — добавляем
                return supabase.from('review_likes').insert([{
                    review_id: reviewId,
                    user_id: userIdentifier,
                    reaction_type: type
                }])
                .then(function() {
                    return supabase.from('reviews').select(field).eq('id', reviewId).single()
                        .then(function(r2) {
                            var current = r2.data[field] || 0;
                            return supabase.from('reviews').update({ [field]: current + 1 }).eq('id', reviewId);
                        });
                })
                .then(function() {
                    if (btn) btn.classList.add('active');
                    loadReviews();
                });
            }
        })
        .catch(function(err) { console.error('Ошибка:', err); });
}

function renderReviews(reviews) {
    var container = document.getElementById('reviewsContainer');
    if (!container) return;
    
    var user = window.currentUser;
    var userIdentifier = user ? (user.username || user.first_name || user.id.toString()) : null;
    
    if (userIdentifier) {
        supabase.from('user_last_review').select('can_review').eq('user_id', userIdentifier).single()
            .then(function(res) {
                var canReview = false;
                if (!res.error && res.data && res.data.can_review) canReview = true;
                updateReviewButton(canReview);
            });
    } else {
        updateReviewButton(false);
    }
    
    var html = '<h3>Отзывы (' + reviews.length + ')</h3>';
    html += '<div id="reviewListContainer">';
    
    reviews.forEach(function(review) {
        var isAuthor = user && String(user.id) === String(review.author_id);
        var avatar = review.photo_url ? '<img src="' + review.photo_url + '">' : (review.author_name || '👤').charAt(0);
        
        // Изображения отзыва — СРАЗУ ПОСЛЕ ТЕКСТА
        var imagesHtml = '';
        if (review.images && review.images.length > 0) {
            imagesHtml = '<div class="review-images">' + review.images.map(function(img) {
                return '<img src="' + img + '" onclick="viewImage(\'' + img + '\', \'Отзыв\', false)">';
            }).join('') + '</div>';
        }
        
        // Детали заказа — скрыты, показываются по кнопке
        var orderInfoHtml = '';
        if (review.order_info) {
            var oi = review.order_info;
            var opts = '';
            if (oi.options && oi.options.length > 0) {
                opts = oi.options.map(function(o) { return o.name + ' ×' + o.quantity; }).join(' • ');
            }
            orderInfoHtml = `
                <div style="margin-top:8px;">
                    <button class="btn btn-sm" onclick="toggleOrderDetails(${review.id})" style="background:rgba(124,58,237,0.15);font-size:11px;padding:6px 12px;">
                        🛒 Показать детали заказа
                    </button>
                    <div id="orderDetails_${review.id}" style="display:none;margin-top:8px;padding:10px 12px;background:rgba(124,58,237,0.05);border:1px solid rgba(124,58,237,0.15);border-radius:8px;font-size:11px;color:var(--text-muted);">
                        <div><strong>${oi.service || 'Заказ'}</strong></div>
${opts ? '<div style="margin-top:4px;">' + opts + '</div>' : ''}
${oi.total ? '<div style="margin-top:4px;color:#c084fc;font-weight:600;">' + oi.total + ' ₽</div>' : ''}
${oi.stars_amount ? '<div style="margin-top:4px;color:#fbbf24;font-size:11px;">⭐ ' + oi.stars_amount + ' звёзд</div>' : ''}
${oi.time ? '<div style="margin-top:4px;font-size:10px;">📅 Заказ: ' + oi.time + '</div>' : ''}
${oi.completed_at ? '<div style="font-size:10px;">✅ Выполнен: ' + new Date(oi.completed_at).toLocaleString('ru-RU') + '</div>' : ''}
                    </div>
                </div>
            `;
        }
        
        var actionsHtml = '';
        if (window.isAdmin) {
            actionsHtml = '<div class="review-actions"><button onclick="editReview(' + review.id + ')">✏️</button><button onclick="deleteReview(' + review.id + ')">🗑️</button></div>';
        } else if (isAuthor) {
            actionsHtml = '<div class="review-actions"><button onclick="editReview(' + review.id + ')">✏️</button><button onclick="deleteReview(' + review.id + ')">🗑️</button></div>';
        }
        
        html += '<div class="card review-card" data-review-id="' + review.id + '">';
        html += '<div class="review-author"><div class="review-avatar">' + avatar + '</div><div><strong>' + (review.author_name || 'Пользователь') + '</strong>';
        if (review.author_username) html += '<div style="font-size:12px;color:var(--text-muted);">@' + review.author_username + '</div>';
        html += '<div class="stars">' + '★'.repeat(review.stars) + '☆'.repeat(5 - review.stars) + '</div></div></div>';
        html += '<p class="review-text">' + review.text + '</p>';
        html += imagesHtml; // Изображения сразу после текста
        html += orderInfoHtml; // Кнопка "Показать детали"
        html += '<div class="review-footer">';
        html += '<button class="like-btn" data-review="' + review.id + '" data-type="heart" onclick="toggleReaction(' + review.id + ', \'heart\')">❤️ <span class="count">' + (review.likes_heart || 0) + '</span></button>';
        html += '<button class="like-btn" data-review="' + review.id + '" data-type="fire" onclick="toggleReaction(' + review.id + ', \'fire\')">🔥 <span class="count">' + (review.likes_fire || 0) + '</span></button>';

        }

    html += '</div>';
    container.innerHTML = html;
    
    if (userIdentifier) {

            });
    }

// Обработка загрузки файлов работ
function handleAdminWorkFiles(event) {
    var files = event.target.files;
    if (!files || files.length === 0) return;
    
    if (files.length + adminWorkFiles.length > 10) {
        alert('Максимум 10 изображений');
        return;
    }
    
    for (var i = 0; i < files.length; i++) {
        if (adminWorkFiles.length >= 10) break;
        
        var file = files[i];
        adminWorkFiles.push(file);
        
        (function(fileObj, index) {
            var reader = new FileReader();
            reader.onload = function(e) {
                var preview = document.getElementById('workImagesPreview');
                if (!preview) return;
                
                var thumb = document.createElement('div');
                thumb.className = 'preview-thumb';
                thumb.innerHTML = `
                    <img src="${e.target.result}" alt="работа">
                    <button class="remove-btn" onclick="removeAdminWorkFile(${index})">×</button>
                `;
                preview.appendChild(thumb);
            };
            reader.readAsDataURL(fileObj);
        })(file, adminWorkFiles.length - 1);
    }
    
    event.target.value = '';
}

// Удаление файла работы

    });
}

            if (res.error || !res.data) return;
            
            var order = res.data;
            var userIdentifier = order.user_username || order.user_name || order.user_id;
            
            if (!userIdentifier) return;
            
            var options = [];
            try {
                options = JSON.parse(order.options || '[]');
            } catch(e) {
                options = [];
            }
            
            var orderInfo = {
                service: order.service,
                total: order.total,
                options: options,
                time: order.time
            };
            
            supabase.from('user_last_review')
                .upsert({
                    user_id: userIdentifier,
                    can_review: true,
                    order_info: orderInfo,
                    timestamp: new Date().toISOString()
                })
                .then(function() {
                    console.log('✅ Отзыв разрешен для:', userIdentifier);
                });
        });
}

        // ================================================================
        // ЗАПУСК
        // ================================================================
        function init() {
            console.log('🚀 Начало инициализации...');
            
            try {
                // Создаем фоновые элементы (только если их нет)
                console.log('✨ Создание фоновых элементов...');
                if (!document.querySelector('.star')) {
                    createStars();
                    createAsteroids();
                    createLoadingStars();
                }
                console.log('✅ Фон создан');
                
                // Настраиваем интерфейс
                console.log('🔧 Настройка интерфейса...');
                setupTabs();
                setupModalHandlers();
                preventModalCloseOnInput();
                console.log('✅ Интерфейс настроен');
                
                // Инициализируем Telegram
                console.log('📱 Инициализация Telegram...');
                initTelegram();
                console.log('✅ Telegram инициализирован');
                
                // Скрываем загрузочный экран
                console.log('🙈 Скрытие загрузочного экрана...');
                var loadingScreen = document.getElementById('loadingScreen');
                if (loadingScreen) {
                    loadingScreen.classList.add('hidden');
                    loadingScreen.style.display = 'none';
                }
                console.log('✅ Загрузочный экран скрыт');
                
                // Загружаем данные
                console.log('📦 Загрузка данных...');
                initDefaultServices();
                loadProducts();
                initDefaultServiceOptions();
                setupRealTimeListeners();
                renderOrdersSection();
                console.log('✅ Данные загружены');
                
                // Восстанавливаем скидку
                var discountUsed = localStorage.getItem('discountUsed');
                if (discountUsed === 'true') {
                    currentDiscount = 0;
                    localStorage.removeItem('lastSpinDiscount');
                    lastSpinDiscount = 0;
                } else if (lastSpinDiscount > 0 && lastSpinDiscount <= 100) {
                    currentDiscount = lastSpinDiscount;
                } else {
                    currentDiscount = 0;
                }
                
                // Загружаем активные посты
                loadActivePosts();
                
                // ================================================================
                // АВТОМАТИЧЕСКИЕ ПРОВЕРКИ
                // ================================================================
                
                // Автоматическая проверка просроченных заказов (сразу)
                console.log('🔄 Проверка просроченных заказов...');
                autoCancelExpiredOrders();
                
                // Автоматическое удаление старых готовых заказов (сразу)
                console.log('🗑 Проверка старых готовых заказов...');
                autoDeleteOldReadyOrders();
                
                // Автоматическая проверка платежей (через 2 секунды)
                console.log('💳 Запуск автоматической проверки платежей...');
                setTimeout(function() {
                    autoCheckPendingPayments();
                }, 2000);
                
                // Периодическая проверка платежей каждые 15 секунд
                setInterval(function() {
                    autoCheckPendingPayments();
                }, 15000);
                
                // Проверка просроченных заказов каждую минуту
                setInterval(function() {
                    autoCancelExpiredOrders();
                }, 60000);
                
                // Проверка старых готовых заказов каждый час
                setInterval(function() {
                    autoDeleteOldReadyOrders();
                }, 3600000);
                
                // Обновление таймеров каждую секунду
                setInterval(function() {
                    updateOrderTimers();
                }, 1000);
                
                // Проверка при возвращении в приложение
                document.addEventListener('visibilitychange', function() {
                    if (!document.hidden) {
                        console.log('👁 Приложение снова активно, проверяем платежи...');
                        autoCheckPendingPayments();
                    }
                });
                
                // Проверка при фокусе окна
                window.addEventListener('focus', function() {
                    console.log('🪟 Окно в фокусе, проверяем платежи...');
                    autoCheckPendingPayments();
                });
                
                console.log('✅ Инициализация завершена успешно');
                
            } catch (err) {
                console.error('❌ Ошибка в init():', err);
                console.error('Стек ошибки:', err.stack);
                
                // Скрываем загрузочный экран даже при ошибке
                var loadingScreen = document.getElementById('loadingScreen');
                if (loadingScreen) {
                    loadingScreen.classList.add('hidden');
                    loadingScreen.style.display = 'none';
                }
                
                alert('Ошибка при загрузке: ' + err.message);
            }
        }

        // ================================================================
        // ФУНКЦИЯ DEBOUNCE
        // ================================================================
        function debounce(func, wait) {
            var timeout;
            return function() {
                var context = this;
                var args = arguments;
                clearTimeout(timeout);
                timeout = setTimeout(function() {
                    func.apply(context, args);
                }, wait);
            };
        }

        // ================================================================
        // ЗАПУСК ПРИЛОЖЕНИЯ
        // ================================================================
        console.log('⏳ Ожидание загрузки DOM...');
        
        if (document.readyState === 'loading') {
            console.log('📄 DOM еще загружается, добавляем listener');
            document.addEventListener('DOMContentLoaded', function() {
                console.log('📄 DOM загружен, запускаем init');
                init();
            });
        } else {
            console.log('📄 DOM уже загружен, запускаем init сразу');
            init();
        }
        
        console.log('📜 Скрипт полностью загружен');
    </script>
</body>
</html>
