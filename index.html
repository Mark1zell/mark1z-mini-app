<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mark1z Design</title>

    <!-- Подключаем Telegram WebApp JS -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-start: #0a050d;
            --bg-mid: #100820;
            --bg-end: #0a0012;
            --primary: #7c3aed;
            --secondary: #be185d;
            --accent: #9d174d;
            --text: #f5f3ff;
            --text-muted: rgba(245, 243, 255, 0.5);
            --card-bg: rgba(18, 8, 30, 0.8);
            --card-border: rgba(124, 58, 237, 0.3);
            --shadow: 0 6px 20px rgba(0,0,0,0.5);
            --radius: 20px;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, var(--bg-start), var(--bg-mid), var(--bg-end));
            color: var(--text);
            min-height: 100vh;
            padding: 16px 16px 80px;
            overflow-x: hidden;
            letter-spacing: 0.02em;
        }
        .stars-container { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
        .star { position:absolute; background:rgba(255,255,255,0.7); border-radius:50%; opacity:0; animation: twinkle var(--duration) ease-in-out infinite; animation-delay: var(--delay); }
        @keyframes twinkle { 0%,100%{opacity:0; transform:scale(0.3)} 50%{opacity:0.3; transform:scale(1)} }
        .app-container { position:relative; z-index:1; max-width:600px; margin:0 auto; }
        .header { text-align:center; padding:30px 0 20px; }
        .logo { width:100px; height:100px; margin:0 auto 16px; border-radius:28px; overflow:hidden; box-shadow:0 4px 15px rgba(124,58,237,0.3); }
        .logo img { width:100%; height:100%; object-fit:cover; }
        .brand-name { font-size:30px; font-weight:800; background:linear-gradient(to right, #a78bfa, #c084fc, #a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation: brandGlow 6s ease-in-out infinite; }
        @keyframes brandGlow { 0%,100%{filter:drop-shadow(0 0 4px rgba(124,58,237,0.3))} 50%{filter:drop-shadow(0 0 8px rgba(124,58,237,0.5))} }
        .tagline { color:var(--text-muted); font-size:13px; letter-spacing:2px; text-transform:uppercase; }
        .tabs { display:flex; background:rgba(10,5,18,0.8); backdrop-filter:blur(20px); border:1px solid var(--card-border); border-radius:40px; padding:6px; margin:25px 0; }
        .tab-btn { flex:1; padding:12px 6px; background:transparent; border:none; color:var(--text-muted); font-weight:600; border-radius:32px; cursor:pointer; transition:all 0.3s; }
        .tab-btn.active { background:linear-gradient(135deg, rgba(124,58,237,0.7), rgba(190,24,93,0.7)); color:#fff; }
        .section { display:none; animation: fadeIn 0.4s; }
        .section.active { display:block; }
        @keyframes fadeIn { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none} }
        .card { background:var(--card-bg); backdrop-filter:blur(10px); border:1px solid var(--card-border); border-radius:var(--radius); padding:24px; margin-bottom:16px; box-shadow:var(--shadow); }
        .card h3 { font-size:21px; font-weight:700; margin-bottom:12px; color:#e9d5ff; }
        .btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-block;
            margin: 5px;
            text-decoration: none;
            font-size: 14px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(124,58,237,0.5); }
        .btn:active { transform: scale(0.96); }
        .categories-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .category-card {
            background: rgba(15,7,25,0.8);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s, border-color 0.3s;
        }
        .category-card:hover { transform: scale(1.02); border-color: var(--primary); }
        .category-card .folder-icon { font-size: 48px; margin-bottom: 10px; }
        .category-card .category-name { font-weight: 600; margin-bottom: 8px; }
        .category-card .work-count { color: var(--text-muted); font-size: 12px; }
        .works-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 15px; }
        .work-item {
            background: rgba(15,7,25,0.9);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            overflow: hidden;
            position: relative;
        }
        .work-item img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; cursor: pointer; }
        .work-item .work-info { padding: 8px; font-size: 12px; color: var(--text-muted); text-align: center; }
        .work-item .work-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 5px; }
        .work-actions button {
            background: rgba(0,0,0,0.6);
            border: none;
            color: white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .add-work-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1;
            background: rgba(124,58,237,0.2);
            border: 2px dashed var(--primary);
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 32px;
            color: var(--primary);
            transition: background 0.3s;
        }
        .add-work-btn:hover { background: rgba(124,58,237,0.3); }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal {
            background: #1a0b2e;
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 24px;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal input, .modal textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: #fff;
        }
        .modal button { margin-right: 10px; }
        .modal img.preview { max-width: 100%; max-height: 200px; object-fit: contain; margin-bottom: 10px; border-radius: 10px; display: none; }
        .admin-only { display: none; }
        .admin-mode .admin-only { display: inline-block; }
        .resume-highlight {
            font-size: 16px;
            font-weight: 600;
            font-style: italic;
            color: #e9d5ff;
            margin: 12px 0;
            padding: 14px 16px;
            background: rgba(124,58,237,0.15);
            border-left: 3px solid var(--primary);
            border-radius: 12px;
        }
        .skills-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
        .skill-badge {
            background: rgba(124,58,237,0.2);
            border: 1px solid rgba(124,58,237,0.3);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            color: #ddd6fe;
        }
        .review-card { padding: 20px; }
        .review-author { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .review-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #be185d);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            overflow: hidden;
        }
        .review-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .review-text { color: var(--text-muted); font-size: 14px; line-height: 1.6; }
        .review-images {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .review-images img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid var(--card-border);
        }
        .stars { color: #fbbf24; letter-spacing: 2px; }
        .order-list { display: flex; flex-direction: column; gap: 12px; }
        .order-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 18px;
            background: rgba(15,7,25,0.8);
            border: 1px solid var(--card-border);
            border-radius: 16px;
        }
        .order-info h4 { font-size: 16px; font-weight: 600; }
        .order-info p { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .order-info a { color: var(--accent); text-decoration: none; }
        .footer { text-align:center; margin-top:30px; padding:10px; color:var(--text-muted); font-size:12px; opacity:0.5; }
        #debugInfo {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-size: 10px;
            padding: 5px;
            text-align: center;
            z-index: 9999;
            pointer-events: none;
        }
        #imageViewer {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            flex-direction: column;
            overflow: hidden;
            touch-action: none;
        }
        #imageViewer img {
            max-width: 95%;
            max-height: 85%;
            object-fit: contain;
            transition: transform 0.2s;
            transform-origin: center;
        }
        #imageViewer .save-btn {
            margin-top: 15px;
        }
        #imageViewerClose {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            border: none;
            color: white;
            font-size: 28px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2001;
        }
        @media (max-width: 400px) {
            .categories-grid, .works-grid { grid-template-columns: 1fr; }
            .brand-name { font-size: 24px; }
            .tab-btn { font-size: 11px; padding: 10px 4px; }
            .card { padding: 18px; }
        }
    </style>
</head>
<body>
    <div class="stars-container" id="starsContainer"></div>

    <div class="app-container">
        <div class="header">
            <div class="logo"><img src="https://i.ibb.co/3y8vZHQz/2026-09-02-025009694.png" alt="Avatar"></div>
            <h1 class="brand-name">Mark1z Design</h1>
            <p class="tagline">ДИЗАЙН, КОТОРЫЙ РАБОТАЕТ НА ВАС</p>
        </div>

        <nav class="tabs" id="tabs">
            <button class="tab-btn active" data-tab="resume">Обо мне</button>
            <button class="tab-btn" data-tab="portfolio">Портфолио</button>
            <button class="tab-btn" data-tab="reviews">Отзывы</button>
            <button class="tab-btn" data-tab="orders">Заказы</button>
        </nav>

        <section id="resume" class="section active">
            <div class="card">
                <h3><a href="https://t.me/mark1zell" target="_blank" style="color: inherit; text-decoration: none;">👋 Дмитрий Маркизов</a></h3>
                <p>19 лет · Опыт 6 лет</p>
                <div id="aboutHighlight" class="resume-highlight"></div>
                <p id="aboutText1"></p>
                <p id="aboutText2"></p>
                <div class="skills-list" id="skillsList"></div>
                <div class="admin-only" style="margin-top:10px">
                    <button class="btn" onclick="editAbout()">Редактировать</button>
                </div>
            </div>
        </section>

        <section id="portfolio" class="section">
            <div id="portfolioCategories"></div>
            <div id="portfolioWorks" style="display:none;"></div>
        </section>

        <section id="reviews" class="section">
            <div id="reviewsContainer"></div>
            <div style="margin-top:10px">
                <button class="btn" onclick="openReviewModal()">Добавить отзыв</button>
            </div>
        </section>

        <section id="orders" class="section">
            <div id="ordersContent"></div>
        </section>

        <div class="footer">© Mark1z Design · Дмитрий Маркизов</div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent"></div>
    </div>

    <div id="imageViewer">
        <button id="imageViewerClose" onclick="closeImageViewer()">×</button>
        <img id="imageViewerImg" src="" alt="Просмотр">
        <button class="btn save-btn" id="imageViewerSaveBtn">Сохранить</button>
    </div>

    <div id="debugInfo"></div>

    <script>
        // ================== FIREBASE ==================
        const firebaseConfig = {
            apiKey: "AIzaSyAFFzb5zZ_n1NCcBn7hET3KIA5lxTgr6as",
            authDomain: "mark1z-design.firebaseapp.com",
            projectId: "mark1z-design",
            storageBucket: "mark1z-design.firebasestorage.app",
            messagingSenderId: "975398534199",
            appId: "1:975398534199:web:ad263dd9071e37591453b2",
            measurementId: "G-C8K8SGFY9H"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ================== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==================
        window.tg = null;
        window.currentUser = null;
        window.isAdmin = false;
        window.telegramAvailable = false;
        let currentCategoryId = null;
        let selectedRating = 0;
        let tempReviewImages = [];
        let tempWorkImage = null;
        let currentViewImageSrc = null;
        let currentViewImageBlobUrl = null;
        let scale = 1;
        let startDistance = 0;
        let startScale = 1;
        let servicesData = [];
        let adminOrdersMode = 'services'; // 'services' или 'orders'

        // ================== TELEGRAM INIT ==================
        function initTelegram() {
            const tg = window.Telegram?.WebApp;
            if (tg) {
                window.telegramAvailable = true;
                window.tg = tg;
                tg.ready();
                tg.expand();
                tg.setHeaderColor('#0a050d');
                tg.setBackgroundColor('#0a0012');
                tg.MainButton.setParams({ text: 'НАПИСАТЬ ДИЗАЙНЕРУ', color: '#7c3aed', text_color: '#ffffff' });
                const user = tg.initDataUnsafe?.user;
                window.currentUser = user;
                if (user?.username?.toLowerCase() === 'mark1zell') {
                    window.isAdmin = true;
                    document.body.classList.add('admin-mode');
                }
                tg.MainButton.onClick(() => {
                    tg.sendData('Здравствуйте! Хочу обсудить заказ.');
                    tg.close();
                });
                updateDebugInfo();
                // Подписка на отзывы
                db.collection('reviews').orderBy('timestamp', 'desc').onSnapshot((snapshot) => {
                    renderReviews(snapshot);
                });
            } else {
                setTimeout(initTelegram, 500);
            }
        }

        function updateDebugInfo() {
            let info = `TG: ${window.telegramAvailable ? 'есть' : 'нет'} | User: ${window.currentUser ? (window.currentUser.username || window.currentUser.first_name) : 'нет'} | Admin: ${window.isAdmin}`;
            document.getElementById('debugInfo').textContent = info;
        }

        // ================== ЗАГРУЗКА ДАННЫХ ==================
        function setupRealTimeListeners() {
            db.collection('about').doc('main').onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    document.getElementById('aboutHighlight').textContent = data.highlight || '';
                    document.getElementById('aboutText1').textContent = data.text1 || '';
                    document.getElementById('aboutText2').textContent = data.text2 || '';
                    document.getElementById('skillsList').innerHTML = (data.skills || []).map(s => `<span class="skill-badge">${s}</span>`).join('');
                } else {
                    db.collection('about').doc('main').set({
                        highlight: '«Каждый проект делаю как собственный — поэтому он работает на вас»',
                        text1: 'Специализируюсь на UX/UI, графическом, веб- и киберспортивном дизайне. Создаю продукты, которые не только красивы, но и удобны.',
                        text2: 'В настоящий момент углубляюсь в искусство моушн-дизайна.',
                        skills: ['UX/UI', 'Графический дизайн', 'Веб-дизайн', 'Киберспорт', 'Моушн (изучаю)']
                    });
                }
            });

            db.collection('portfolioCategories').onSnapshot((snapshot) => {
                renderPortfolioCategories(snapshot);
            });

            db.collection('services').onSnapshot((snapshot) => {
                const services = [];
                snapshot.forEach(doc => {
                    services.push({ id: doc.id, ...doc.data() });
                });
                servicesData = services;
                renderOrdersSection();
            });

            db.collection('orders').orderBy('timestamp', 'desc').onSnapshot((snapshot) => {
                renderOrdersList(snapshot);
            });
        }

        function renderPortfolioCategories(snapshot) {
            const container = document.getElementById('portfolioCategories');
            if (!container || container.style.display === 'none') return;
            const cats = [];
            snapshot.forEach(doc => cats.push({ id: doc.id, ...doc.data() }));
            let html = '<div class="card"><h3>📁 Категории портфолио</h3><div class="categories-grid">';
            cats.forEach((cat) => {
                const count = cat.items ? cat.items.length : 0;
                html += `
                    <div class="category-card" onclick="openCategory('${cat.id}')">
                        <div class="folder-icon">${cat.icon}</div>
                        <div class="category-name">${cat.name}</div>
                        <div class="work-count">${count} работ(ы)</div>
                    </div>
                `;
            });
            html += '</div>';
            if (window.isAdmin) {
                html += '<div class="admin-only" style="margin-top:15px"><button class="btn" onclick="addCategory()">➕ Добавить категорию</button></div>';
            }
            html += '</div>';
            container.innerHTML = html;
        }

        async function openCategory(categoryId) {
            currentCategoryId = categoryId;
            const catDoc = await db.collection('portfolioCategories').doc(categoryId).get();
            if (!catDoc.exists) return;
            const cat = catDoc.data();
            document.getElementById('portfolioCategories').style.display = 'none';
            const worksContainer = document.getElementById('portfolioWorks');
            worksContainer.style.display = 'block';
            let html = `
                <div class="card">
                    <button class="btn" onclick="showPortfolioCategories()" style="margin-bottom:15px;">← Назад</button>
                    <h3>${cat.icon} ${cat.name}</h3>
                    <div class="works-grid">
            `;
            const items = cat.items || [];
            if (items.length === 0) {
                html += '<p style="color:var(--text-muted)">Нет работ</p>';
            } else {
                items.forEach((item, idx) => {
                    html += `
                        <div class="work-item">
                            <img src="${item.image}" alt="${item.title}" onclick="viewImage('${item.image}', '${item.title}', true)" loading="lazy">
                            <div class="work-info">${item.title}</div>
                            <div class="work-actions" style="left:8px; right:auto;">
                                <button onclick="event.stopPropagation(); downloadWork('${item.image}', '${item.title}')" title="Скачать">⬇️</button>
                            </div>
                            ${window.isAdmin ? `
                            <div class="work-actions">
                                <button onclick="editWork(${idx})">✏️</button>
                                <button onclick="deleteWork(${idx})">🗑️</button>
                            </div>` : ''}
                        </div>
                    `;
                });
            }
            if (window.isAdmin) {
                html += `<div class="add-work-btn" onclick="addWork()">+</div>`;
            }
            html += '</div></div>';
            worksContainer.innerHTML = html;
        }

        function showPortfolioCategories() {
            document.getElementById('portfolioWorks').style.display = 'none';
            document.getElementById('portfolioCategories').style.display = 'block';
        }

        function renderReviews(snapshot) {
            const container = document.getElementById('reviewsContainer');
            if (!container) return;
            let html = '';
            snapshot.forEach(doc => {
                const review = doc.data();
                const authorName = review.authorName || review.author || 'Пользователь';
                const authorUsername = review.authorUsername || null;
                const isAuthor = window.currentUser && (window.currentUser.id === review.authorId || window.currentUser.username === review.authorUsername);
                let avatarHtml = `<div class="review-avatar">${(review.authorName && review.authorName !== 'Пользователь') ? review.authorName.charAt(0) : '👤'}</div>`;
                if (review.photoUrl) {
                    avatarHtml = `<div class="review-avatar"><img src="${review.photoUrl}" alt="avatar"></div>`;
                }
                let imagesHtml = '';
                if (review.images && review.images.length > 0) {
                    imagesHtml = '<div class="review-images">';
                    review.images.forEach(img => {
                        imagesHtml += `<img src="${img}" alt="отзыв" onclick="viewImage('${img}', 'Отзыв', false)">`;
                    });
                    imagesHtml += '</div>';
                }
                let actionsHtml = '';
                if (window.isAdmin) {
                    actionsHtml += `<button class="btn" onclick="editReview('${doc.id}')">✏️</button>`;
                    actionsHtml += `<button class="btn" onclick="deleteReview('${doc.id}')">🗑️</button>`;
                } else if (isAuthor) {
                    actionsHtml += `<button class="btn" onclick="deleteReview('${doc.id}')">🗑️ Удалить</button>`;
                }
                html += `
                    <div class="card review-card">
                        <div class="review-author">
                            ${avatarHtml}
                            <div>
                                <strong>${authorName}</strong>
                                ${authorUsername ? `<div style="font-size:12px; color:var(--text-muted);">@${authorUsername}</div>` : ''}
                                <div class="stars">${'★'.repeat(review.stars)}${'☆'.repeat(5 - review.stars)}</div>
                            </div>
                        </div>
                        <p class="review-text">${review.text}</p>
                        ${imagesHtml}
                        ${actionsHtml ? `<div style="margin-top:10px">${actionsHtml}</div>` : ''}
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // ================== РАЗДЕЛ "ЗАКАЗЫ" ==================
        function renderOrdersSection() {
            const container = document.getElementById('ordersContent');
            if (!container) return;
            if (window.isAdmin) {
                // Админ: показываем переключатель и соответствующий контент
                let html = `
                    <div style="display:flex; gap:10px; margin-bottom:15px;">

        // ================== ПОЛНОЭКРАННЫЙ ПРОСМОТР ==================
        function viewImage(src, title, allowSave = false) {
            currentViewImageSrc = src;
            const viewer = document.getElementById('imageViewer');
            const img = document.getElementById('imageViewerImg');
            const saveBtn = document.getElementById('imageViewerSaveBtn');
            img.src = src;
            img.alt = title || 'Изображение';
            saveBtn.style.display = 'inline-block';
            viewer.style.display = 'flex';
            scale = 1;
            img.style.transform = 'scale(1)';
        }

        function closeImageViewer() {
            document.getElementById('imageViewer').style.display = 'none';
            currentViewImageSrc = null;
            currentViewImageBlobUrl = null;
            scale = 1;
        }

        function saveCurrentImage() {
            if (!currentViewImageSrc) return;
            if (currentViewImageSrc.startsWith('data:')) {
                const base64 = currentViewImageSrc.split(',')[1];
                const byteChars = atob(base64);
                const byteNumbers = new Array(byteChars.length);
                for (let i = 0; i < byteChars.length; i++) {
                    byteNumbers[i] = byteChars.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray], {type: 'image/jpeg'});
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = 'image.jpg';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
            } else {
                const a = document.createElement('a');
                a.href = currentViewImageSrc;
                a.download = 'image.jpg';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        }

        document.getElementById('imageViewerSaveBtn').addEventListener('click', saveCurrentImage);
        document.getElementById('imageViewerClose').addEventListener('click', closeImageViewer);

        // Зум (pinch)
        const imageViewer = document.getElementById('imageViewer');
        const imageViewerImg = document.getElementById('imageViewerImg');
        imageViewer.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                startDistance = getDistance(e.touches[0], e.touches[1]);
                startScale = scale;
            }
        });
        imageViewer.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();
                const currentDistance = getDistance(e.touches[0], e.touches[1]);
                scale = Math.min(Math.max(startScale * currentDistance / startDistance, 1), 3);
                imageViewerImg.style.transform = `scale(${scale})`;
            }
        });
        imageViewer.addEventListener('dblclick', () => {
            scale = scale === 1 ? 2 : 1;
            imageViewerImg.style.transform = `scale(${scale})`;
        });

        function getDistance(touch1, touch2) {
            const dx = touch1.clientX - touch2.clientX;
            const dy = touch1.clientY - touch2.clientY;
            return Math.sqrt(dx*dx + dy*dy);
        }

                    <button class="btn" onclick="document.getElementById('reviewImagesInput').click()">📎 Прикрепить изображения (до 3)</button>

        function updateStarRating(value) {
            document.querySelectorAll('#starRating span').forEach(star => {
                const starValue = parseInt(star.dataset.value);

        async function handleReviewImages(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;
            if (files.length + tempReviewImages.length > 3) {
                alert('Можно прикрепить не более 3 изображений');
                return;
            }
            for (const file of files) {
                if (tempReviewImages.length >= 3) break;
                const dataUrl = await compressImage(file, 1200, 0.8);
                if (dataUrl) {
                    tempReviewImages.push(dataUrl);
                }
            }
            renderReviewImagesPreview();
        }

        function renderReviewImagesPreview() {
            const preview = document.getElementById('reviewImagesPreview');
            preview.innerHTML = '';
            tempReviewImages.forEach((img, idx) => {
                preview.innerHTML += `<img src="${img}" style="width:60px;height:60px;object-fit:cover;border-radius:8px;cursor:pointer;" onclick="tempReviewImages.splice(${idx},1); renderReviewImagesPreview();">`;
            });
        }

        function compressImage(file, maxSize, quality) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > height && width > maxSize) {
                            height = height * maxSize / width;
                            width = maxSize;
                        } else if (height > maxSize) {
                            width = width * maxSize / height;
                            height = maxSize;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const dataUrl = canvas.toDataURL('image/jpeg', quality);
                        resolve(dataUrl);
                    };
                    img.onerror = () => resolve(null);
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function submitReview() {

                authorName: authorName,

                authorId: authorId,

        function addWork() {
            if (!currentCategoryId) {
                alert('Сначала откройте категорию');
                return;
            }
            const modal = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');
            content.innerHTML = `
                <h3>Добавить работу</h3>
                <input type="file" id="workImageInput" accept="image/*" onchange="previewWorkImage(event)">

        function previewWorkImage(event) {
            const file = event.target.files[0];

            compressImage(file, 1400, 0.8).then(dataUrl => {
                tempWorkImage = dataUrl;
                document.getElementById('workImagePreview').src = dataUrl;
                document.getElementById('workImagePreview').style.display = 'block';
                document.getElementById('debugInfo').textContent = 'Изображение сжато до ' + Math.round(dataUrl.length/1024) + ' КБ';
            });

        async function saveWork() {
            const title = document.getElementById('workTitleInput').value.trim();
            if (!title) { alert('Введите название'); return; }
            if (!tempWorkImage) { alert('Загрузите изображение'); return; }
            if (tempWorkImage.length > 1000000) { alert('Изображение слишком большое'); return; }
            try {
                const catRef = db.collection('portfolioCategories').doc(currentCategoryId);
                const catDoc = await catRef.get();
                if (!catDoc.exists) { alert('Категория не найдена'); return; }
                const items = catDoc.data().items || [];
                items.push({ title, image: tempWorkImage });
                await catRef.update({ items });
                closeModal();
                document.getElementById('debugInfo').textContent = 'Работа добавлена';
            } catch (error) {
                alert('Ошибка: ' + error.message);
                document.getElementById('debugInfo').textContent = 'Ошибка: ' + error.message;
            }
        }

        async function deleteWork(index) {
            const catRef = db.collection('portfolioCategories').doc(currentCategoryId);
            const catDoc = await catRef.get();
            const items = catDoc.data().items || [];
            items.splice(index, 1);
            await catRef.update({ items });

        function createStars() {
            const container = document.getElementById('starsContainer');

                star.classList.add('star');
                const size = Math.random() * 2 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                const duration = Math.random() * 4 + 3;
                const delay = Math.random() * 6;
                star.style.setProperty('--duration', duration + 's');
                star.style.setProperty('--delay', delay + 's');
                container.appendChild(star);
            }
        }

        // ================== ЗАПУСК ==================
        function init() {
            createStars();
            setupTabs();
            setupRealTimeListeners();
            initTelegram();
            renderOrdersSection();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
