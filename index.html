        function openReviewModal() {
            var modal = document.getElementById('modalOverlay');
            var content = document.getElementById('modalContent');
            content.innerHTML = `
                <h3>Оставьте отзыв</h3>
                <div id="starRating" style="font-size: 30px; cursor: pointer;">
                    <span data-value="1">☆</span>
                    <span data-value="2">☆</span>
                    <span data-value="3">☆</span>
                    <span data-value="4">☆</span>
                    <span data-value="5">☆</span>
                </div>
                <textarea id="reviewText" placeholder="Напишите ваш отзыв..." style="height:100px;"></textarea>
                <div style="margin-bottom:10px;">
                    <button class="btn btn-sm" onclick="document.getElementById('reviewImagesInput').click()">📎 Прикрепить изображения (до 3)</button>
                    <input type="file" id="reviewImagesInput" accept="image/*" multiple hidden onchange="handleReviewImages(event)">
                    <div id="reviewImagesPreview" style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;"></div>
                </div>
                <button class="btn" onclick="submitReview()">Опубликовать</button>
                <button class="btn" onclick="closeModal()">Отмена</button>
            `;
            modal.style.display = 'flex';
            tempReviewFiles = [];
            selectedRating = 0;
            document.querySelectorAll('#starRating span').forEach(function(star) {
                star.addEventListener('click', function() {
                    var value = parseInt(star.dataset.value);
                    selectedRating = value;
                    updateStarRating(value);
                });
            });
        }

        function updateStarRating(value) {
            document.querySelectorAll('#starRating span').forEach(function(star) {
                var starValue = parseInt(star.dataset.value);
                star.textContent = starValue <= value ? '★' : '☆';
                star.style.color = starValue <= value ? '#fbbf24' : 'inherit';
            });
        }

        function handleReviewImages(event) {
            var files = event.target.files;
            if (!files || files.length === 0) return;
            if (files.length + tempReviewFiles.length > 3) {
                alert('Можно прикрепить не более 3 изображений');
                return;
            }
            for (var i = 0; i < files.length; i++) {
                if (tempReviewFiles.length >= 3) break;
                tempReviewFiles.push(files[i]);
                var reader = new FileReader();
                reader.onload = function(e) {
                    var preview = document.getElementById('reviewImagesPreview');
                    var thumb = document.createElement('div');
                    thumb.className = 'preview-thumb';
                    thumb.innerHTML = '<img src="' + e.target.result + '" alt="миниатюра"><button class="remove-btn" onclick="removeReviewImage(' + (tempReviewFiles.indexOf(files[i])) + ')">×</button>';
                    preview.appendChild(thumb);
                };
                reader.readAsDataURL(files[i]);
            }
        }

        function removeReviewImage(index) {
            tempReviewFiles.splice(index, 1);
            var preview = document.getElementById('reviewImagesPreview');
            preview.innerHTML = '';
            tempReviewFiles.forEach(function(file, idx) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    var thumb = document.createElement('div');
                    thumb.className = 'preview-thumb';
                    thumb.innerHTML = '<img src="' + e.target.result + '" alt="миниатюра"><button class="remove-btn" onclick="removeReviewImage(' + idx + ')">×</button>';
                    preview.appendChild(thumb);
                };
                reader.readAsDataURL(file);
            });
        }

        function submitReview() {
            var text = document.getElementById('reviewText').value.trim();
            if (!text) { alert('Введите текст отзыва'); return; }
            if (!selectedRating) { alert('Поставьте оценку'); return; }
            var user = window.currentUser;
            if (!user || !user.id) {
                alert('Не удалось определить пользователя');
                return;
            }

            supabase.from('user_last_review').select('timestamp').eq('user_id', user.id.toString()).single()
                .then(function(res) {
                    if (!res.error && res.data) {
                        var lastTimestamp = new Date(res.data.timestamp).getTime();
                        var now = Date.now();
                        if (now - lastTimestamp < 3600000) {
                            alert('Вы сможете оставить новый отзыв через 1 час после предыдущего.');
                            return Promise.reject('timeout');
                        }
                    }
                    var imageUrls = [];
                    var uploadPromises = tempReviewFiles.map(function(file) {
                        return compressImage(file, 600, 0.6)
                            .then(function(compressedDataUrl) {
                                var blob = dataURLToBlob(compressedDataUrl);
                                var uploadFile = new File([blob], file.name, { type: 'image/jpeg' });
                                return uploadFileToSupabase(uploadFile, 'reviews/' + user.id);
                            });
                    });
                    return Promise.all(uploadPromises);
                })
                .then(function(urls) {
                    var authorName = user.first_name || user.username || 'Пользователь';
                    var authorUsername = user.username || null;
                    var photoUrl = user.photo_url || null;
                    var authorId = user.id;
                    var reviewData = {
                        author_name: authorName,
                        author_username: authorUsername,
                        author_id: authorId.toString(),
                        photo_url: photoUrl,
                        stars: selectedRating,
                        text: text,
                        images: urls || [],
                        likes_heart: 0,
                        likes_fire: 0,
                        likes_plus: 0,
                        admin_reply: '',
                        timestamp: new Date().toISOString()
                    };
                    return supabase.from('reviews').insert([reviewData]);
                })
                .then(function() {
                    return supabase.from('user_last_review').upsert({
                        user_id: user.id.toString(),
                        timestamp: new Date().toISOString()
                    });
                })
                .then(function() {
                    closeModal();
                    tempReviewFiles = [];
                    loadReviews();
                })
                .catch(function(err) {
                    if (err === 'timeout') {
                        // ничего не делаем
                    } else {
                        alert('Ошибка: ' + err.message);
                    }
                });
        }

        function reactReview(id, type) {
            var fieldMap = { 'heart': 'likes_heart', 'fire': 'likes_fire', 'plus': 'likes_plus' };
            var field = fieldMap[type];
            if (!field) return;

            supabase.from('reviews').select(field).eq('id', id).single()
                .then(function(res) {
                    if (res.error) throw res.error;
                    var current = res.data[field] || 0;
                    return supabase.from('reviews').update({ [field]: current + 1 }).eq('id', id);
                })
                .then(function() {
                    loadReviews();
                })
                .catch(function(err) {
                    alert('Ошибка: ' + err.message);
                });
        }

        function renderReviews(reviews) {
            var container = document.getElementById('reviewsContainer');
            if (!container) return;
            var html = '<h3 style="margin-bottom:15px;">Отзывы (' + reviews.length + ')</h3>';
            reviews.forEach(function(review) {
                var authorName = review.author_name || 'Пользователь';
                var authorUsername = review.author_username || null;
                var isAuthor = window.currentUser && 
                    (String(window.currentUser.id) === String(review.author_id) || 
                     window.currentUser.username === review.author_username);
                
                var avatarHtml = '';
                if (review.photo_url) {
                    avatarHtml = '<div class="review-avatar"><img src="' + review.photo_url + '" alt="avatar" onerror="this.style.display=\'none\';this.parentElement.textContent=\'' + (authorName.charAt(0) || '👤') + '\'"></div>';
                } else {
                    avatarHtml = '<div class="review-avatar">' + (authorName.charAt(0) || '👤') + '</div>';
                }
                
                var imagesHtml = '';
                if (review.images && review.images.length > 0) {
                    imagesHtml = '<div class="review-images">';
                    review.images.forEach(function(img) {
                        imagesHtml += '<img src="' + img + '" alt="отзыв" class="' + (review.images.length === 1 ? 'single' : '') + '" onclick="viewImage(\'' + img + '\', \'Отзыв\', false)">';
                    });
                    imagesHtml += '</div>';
                }

                var actionsHtml = '';
                if (window.isAdmin) {
                    actionsHtml += '<button class="btn btn-sm" onclick="editReview(' + review.id + ')">✏️</button>';
                    actionsHtml += '<button class="btn btn-sm" onclick="deleteReview(' + review.id + ')">🗑️</button>';
                } else if (isAuthor) {
                    actionsHtml += '<button class="btn btn-sm" onclick="deleteReview(' + review.id + ')">🗑️ Удалить</button>';
                }

                var heartCount = review.likes_heart || 0;
                var fireCount = review.likes_fire || 0;
                var plusCount = review.likes_plus || 0;

                var reactionsHtml = `
                    <button class="like-btn" onclick="reactReview(${review.id}, 'heart')">
                        <span class="emoji">❤️</span> <span class="count">${heartCount}</span>
                    </button>
                    <button class="like-btn" onclick="reactReview(${review.id}, 'fire')">
                        <span class="emoji">🔥</span> <span class="count">${fireCount}</span>
                    </button>
                    <button class="like-btn" onclick="reactReview(${review.id}, 'plus')">
                        <span class="emoji">👍</span> <span class="count">${plusCount}</span>
                    </button>
                `;

                var adminReplyHtml = '';
                if (review.admin_reply) {
                    adminReplyHtml = `
                        <div class="admin-reply" id="replyContainer_${review.id}">
                            <div class="reply-text"><strong>👑 Ответ дизайнера:</strong> ${review.admin_reply}</div>
                            ${window.isAdmin ? `<button class="edit-reply-btn" onclick="editAdminReply(${review.id})">✏️</button>` : ''}
                        </div>
                    `;
                } else if (window.isAdmin) {
                    adminReplyHtml = `
                        <div class="admin-reply-input" style="margin-top:10px; display:flex; gap:8px;">
                            <textarea id="adminReply_${review.id}" placeholder="Ответить на отзыв..." style="flex:1; padding:8px; border:1px solid var(--card-border); border-radius:8px; background:rgba(0,0,0,0.3); color:var(--text); font-size:13px; resize:vertical; min-height:40px;"></textarea>
                            <button class="btn btn-sm" onclick="saveAdminReply(${review.id})" style="padding:8px 12px;">Отправить</button>
                        </div>
                    `;
                }

                html += `
                    <div class="card review-card">
                        <div class="review-author">
                            ${avatarHtml}
                            <div>
                                <strong>${authorName}</strong>
                                ${authorUsername ? '<div style="font-size:12px; color:var(--text-muted);">@' + authorUsername + '</div>' : ''}
                                <div class="stars">${'★'.repeat(review.stars)}${'☆'.repeat(5 - review.stars)}</div>
                            </div>
                        </div>
                        <p class="review-text">${review.text}</p>
                        ${imagesHtml}
                        <div class="review-footer">
                            ${reactionsHtml}
                            ${actionsHtml ? '<div class="review-actions">' + actionsHtml + '</div>' : ''}
                        </div>
                        ${adminReplyHtml}
                    </div>
                `;
            });
            container.innerHTML = html;

            document.querySelectorAll('.like-btn').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    this.classList.add('animating');
                    this.classList.add('active');
                    setTimeout(function() {
                        btn.classList.remove('animating');
                        btn.classList.remove('active');
                    }, 400);
                });
            });
        }

        function deleteReview(id) {
            if (!confirm('Удалить отзыв?')) return;
            supabase.from('reviews').select('author_id').eq('id', id).single()
                .then(function(res) {
                    if (res.error) {
                        alert('Ошибка: ' + res.error.message);
                        return;
                    }
                    var reviewAuthorId = res.data ? String(res.data.author_id) : null;
                    var currentUserId = window.currentUser ? String(window.currentUser.id) : null;
                    if (!window.isAdmin && reviewAuthorId !== currentUserId) {
                        alert('Вы не можете удалить этот отзыв');
                        return;
                    }
                    if (reviewAuthorId) {
                        supabase.from('user_last_review').delete().eq('user_id', reviewAuthorId);
                    }
                    supabase.from('reviews').delete().eq('id', id)
                        .then(function() {
                            loadReviews();
                        });
                })
                .catch(function(err) {
                    alert('Ошибка: ' + err.message);
                });
        }

        function editAdminReply(id) {
            var replyContainer = document.getElementById('replyContainer_' + id);
            if (!replyContainer) return;
            var currentText = replyContainer.querySelector('.reply-text')?.textContent || '';
            replyContainer.innerHTML = `
                <div class="admin-reply-edit">
                    <textarea id="editReplyText_${id}">${currentText}</textarea>
                    <button class="btn btn-sm" onclick="saveAdminReplyEdit(${id})">Сохранить</button>
                    <button class="btn btn-sm" onclick="cancelAdminReplyEdit(${id})" style="background:rgba(255,255,255,0.1);">Отмена</button>
                </div>
            `;
        }

        function saveAdminReplyEdit(id) {
            var textarea = document.getElementById('editReplyText_' + id);
            if (!textarea) return;
            var newText = textarea.value.trim();
            if (!newText) {
                alert('Введите текст ответа');
                return;
            }
            supabase.from('reviews').update({ admin_reply: newText }).eq('id', id)
                .then(function() {
                    loadReviews();
                })
                .catch(function(err) {
                    alert('Ошибка: ' + err.message);
                });
        }

        function cancelAdminReplyEdit(id) {
            loadReviews();
        }

        function saveAdminReply(id) {
            var replyText = document.getElementById('adminReply_' + id)?.value?.trim();
            if (!replyText) {
                alert('Введите текст ответа');
                return;
            }
            supabase.from('reviews').update({ admin_reply: replyText }).eq('id', id)
                .then(function() {
                    loadReviews();
                })
                .catch(function(err) {
                    alert('Ошибка: ' + err.message);
                });
        }

        function editReview(id) {
            var newText = prompt('Новый текст отзыва:');
            if (newText !== null) {
                supabase.from('reviews').update({ text: newText }).eq('id', id);
            }
        }

        // ================================================================
        // АДМИН-ФУНКЦИИ
        // ================================================================
        function editAbout() {
            supabase.from('about').select('*').eq('id', 'main').single()
                .then(function(res) {
                    if (res.error || !res.data) return;
                    var data = res.data;
                    var newHighlight = prompt('Статус:', data.highlight);
                    if (newHighlight !== null) supabase.from('about').update({ highlight: newHighlight }).eq('id', 'main');
                    var newText1 = prompt('Текст 1:', data.text1);
                    if (newText1 !== null) supabase.from('about').update({ text1: newText1 }).eq('id', 'main');
                    var newText2 = prompt('Текст 2:', data.text2);
                    if (newText2 !== null) supabase.from('about').update({ text2: newText2 }).eq('id', 'main');
                });
        }

        function addCategory() {
            var name = prompt('Название категории:');
            if (!name) return;
            var icon = prompt('Эмодзи-иконка:');
            if (!icon) return;
            var nextOrder = portfolioCategoriesData.length > 0 ? Math.max.apply(null, portfolioCategoriesData.map(function(c) { return c.order || 0; })) + 1 : 0;
            supabase.from('portfolio_categories').insert([{ name: name, icon: icon, items: [], order: nextOrder }]);
        }

        function deleteOrder(id) {
            if (confirm('Удалить заказ?')) {
                supabase.from('orders').delete().eq('id', id);
            }
        }

        function clearOrders() {
            if (confirm('Очистить все заказы?')) {
                supabase.from('orders').delete().neq('id', 0);
            }
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        // ================================================================
        // СМЕНА ЛОГОТИПА
        // ================================================================
        function changeLogo() {
            var modal = document.getElementById('modalOverlay');
            var content = document.getElementById('modalContent');
            content.innerHTML = `
                <h3>Сменить аватарку</h3>
                <input type="file" id="logoInput" accept="image/*" onchange="previewLogoImage(event)">
                <img id="logoPreview" class="preview" src="" alt="Предпросмотр">
                <button class="btn" onclick="saveLogo()">Сохранить</button>
                <button class="btn" onclick="closeModal()">Отмена</button>
            `;
            modal.style.display = 'flex';
            window.tempLogoFile = null;
        }

        function previewLogoImage(event) {
            var file = event.target.files[0];
            if (!file) return;
            window.tempLogoFile = file;
            var reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('logoPreview').src = e.target.result;
                document.getElementById('logoPreview').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        function saveLogo() {
            if (!window.tempLogoFile) { alert('Загрузите изображение'); return; }
            compressImage(window.tempLogoFile, 400, 0.6)
                .then(function(compressedDataUrl) {
                    var blob = dataURLToBlob(compressedDataUrl);
                    var file = new File([blob], window.tempLogoFile.name, { type: 'image/jpeg' });
                    return uploadFileToSupabase(file, 'logo');
                })
                .then(function(url) {
                    return supabase.from('settings').upsert({ key: 'logo', value: url });
                })
                .then(function() {
                    window.tempLogoFile = null;
                    closeModal();
                    document.getElementById('logoImage').src = url;
                })
                .catch(function(err) {
                    alert('Ошибка загрузки: ' + err.message);
                });
        }

        // ================================================================
        // КОНТАКТНАЯ МОДАЛКА
        // ================================================================
        function openContactModal() {
            var modal = document.getElementById('modalOverlay');
            var content = document.getElementById('modalContent');
            content.innerHTML = `
                <h3>Связаться с нами</h3>
                <p>Выберите способ:</p>
                <button class="btn" onclick="window.open('https://t.me/Mark1zDesign_bot', '_blank')">🤖 Написать боту</button>
                <button class="btn" onclick="window.open('https://t.me/mark1zell', '_blank')">👤 Написать дизайнеру (@Mark1zell)</button>
                <button class="btn" onclick="closeModal()">Отмена</button>
            `;
            modal.style.display = 'flex';
        }

        // ================================================================
        // ПОЛНОЭКРАННЫЙ ПРОСМОТР
        // ================================================================
        function viewImage(src, title, allowSave) {
            currentViewImageSrc = src;
            var viewer = document.getElementById('imageViewer');
            var img = document.getElementById('imageViewerImg');
            var saveBtn = document.getElementById('imageViewerSaveBtn');
            img.onload = function() { viewer.style.display = 'flex'; };
            img.onerror = function() { viewer.style.display = 'none'; };
            img.src = src;
            if (img.complete) img.onload();
            saveBtn.style.display = 'inline-block';
            scale = 1;
            img.style.transform = 'scale(1)';
            img.style.left = '0px';
            img.style.top = '0px';
        }

        function closeImageViewer() {
            document.getElementById('imageViewer').style.display = 'none';
            currentViewImageSrc = null;
            scale = 1;
        }

        function saveCurrentImage() {
            if (!currentViewImageSrc) return;
            downloadImage(currentViewImageSrc, 'изображение.jpg');
        }

        // Обработчики зума
        document.addEventListener('DOMContentLoaded', function() {
            var imageViewer = document.getElementById('imageViewer');
            var img = document.getElementById('imageViewerImg');
            var panX = 0, panY = 0;
            var startPanX = 0, startPanY = 0;
            var isPanning = false;

            imageViewer.addEventListener('touchstart', function(e) {
                if (e.touches.length === 2) {
                    startDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                    startScale = scale;
                } else if (e.touches.length === 1 && scale > 1) {
                    isPanning = true;
                    startPanX = e.touches[0].clientX - panX;
                    startPanY = e.touches[0].clientY - panY;
                }
            });
            imageViewer.addEventListener('touchmove', function(e) {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    var currentDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                    scale = Math.min(Math.max(startScale * currentDistance / startDistance, 1), 3);
                    img.style.transform = 'scale(' + scale + ')';
                    if (scale === 1) {
                        panX = 0; panY = 0;
                        img.style.left = '0px';
                        img.style.top = '0px';
                    } else {
                        var maxX = (img.offsetWidth * scale - img.offsetWidth) / 2;
                        var maxY = (img.offsetHeight * scale - img.offsetHeight) / 2;
                        panX = Math.max(-maxX, Math.min(maxX, panX));
                        panY = Math.max(-maxY, Math.min(maxY, panY));
                        img.style.left = panX + 'px';
                        img.style.top = panY + 'px';
                    }
                } else if (e.touches.length === 1 && isPanning) {
                    e.preventDefault();
                    panX = e.touches[0].clientX - startPanX;
                    panY = e.touches[0].clientY - startPanY;
                    var maxX = (img.offsetWidth * scale - img.offsetWidth) / 2;
                    var maxY = (img.offsetHeight * scale - img.offsetHeight) / 2;
                    panX = Math.max(-maxX, Math.min(maxX, panX));
                    panY = Math.max(-maxY, Math.min(maxY, panY));
                    img.style.left = panX + 'px';
                    img.style.top = panY + 'px';
                }
            });
            imageViewer.addEventListener('touchend', function() { isPanning = false; });
            imageViewer.addEventListener('dblclick', function() {
                scale = scale === 1 ? 2 : 1;
                img.style.transform = 'scale(' + scale + ')';
                if (scale === 1) {
                    panX = 0; panY = 0;
                    img.style.left = '0px';
                    img.style.top = '0px';
                }
            });
        });

        document.getElementById('imageViewerSaveBtn').addEventListener('click', saveCurrentImage);
        document.getElementById('imageViewerClose').addEventListener('click', closeImageViewer);

        // ================================================================
        // ВКЛАДКИ
        // ================================================================
        function setupTabs() {
            var tabs = document.querySelectorAll('.tab-btn');
            var sections = document.querySelectorAll('.section');
            tabs.forEach(function(tab) {
                tab.addEventListener('click', function() {
                    var target = tab.dataset.tab;
                    tabs.forEach(function(t) { t.classList.remove('active'); });
                    tab.classList.add('active');
                    sections.forEach(function(s) { s.classList.remove('active'); });
                    document.getElementById(target).classList.add('active');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    if (target === 'orders') renderOrdersSection();
                    if (window.telegramAvailable && window.tg) {
                        if (target === 'orders' && !window.isAdmin) window.tg.MainButton.show();
                        else window.tg.MainButton.hide();
                    }
                });
            });
        }

        // ================================================================
        // ЗВЁЗДЫ И АСТЕРОИДЫ
        // ================================================================
        function createStars() {
            var container = document.getElementById('starsContainer');
            for (var i = 0; i < 45; i++) {
                var star = document.createElement('div');
                star.classList.add('star');
                var size = Math.random() * 2 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                var duration = Math.random() * 4 + 3;
                var delay = Math.random() * 6;
                star.style.setProperty('--duration', duration + 's');
                star.style.setProperty('--delay', delay + 's');
                container.appendChild(star);
            }
        }

        function createAsteroids() {
            var container = document.getElementById('asteroidContainer');
            var count = 7;
            for (var i = 0; i < count; i++) {
                var asteroid = document.createElement('div');
                asteroid.classList.add('asteroid');
                var size = Math.random() * 3 + 2;
                asteroid.style.width = size + 'px';
                asteroid.style.height = size + 'px';
                asteroid.style.left = Math.random() * 100 + '%';
                asteroid.style.top = Math.random() * 100 + '%';
                var tx = (Math.random() - 0.5) * 200;
                var ty = (Math.random() - 0.5) * 200;
                asteroid.style.setProperty('--tx', tx + 'px');
                asteroid.style.setProperty('--ty', ty + 'px');
                var duration = Math.random() * 10 + 5;
                asteroid.style.animationDuration = duration + 's';
                var delay = Math.random() * 15;
                asteroid.style.animationDelay = delay + 's';
                container.appendChild(asteroid);
            }
        }

        function createLoadingStars() {
            var container = document.getElementById('loadingStars');
            for (var i = 0; i < 20; i++) {
                var star = document.createElement('div');
                star.classList.add('loading-star');
                var size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDuration = (Math.random() * 2 + 1) + 's';
                star.style.animationDelay = (Math.random() * 3) + 's';
                container.appendChild(star);
            }
        }

        // ================================================================
        // ЗАПУСК
        // ================================================================
        function init() {
            createStars();
            createAsteroids();
            createLoadingStars();
            setupTabs();
            initDefaultServices();
            initDefaultServiceOptions();
            setupRealTimeListeners();
            initTelegram();
            renderOrdersSection();
            if (lastSpinDiscount > 0) applyDiscount(lastSpinDiscount);
            loadActivePosts();
            setTimeout(function() {
                document.getElementById('loadingScreen').classList.add('hidden');
            }, 800);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
